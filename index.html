  batch: () => {
    const b = writeBatch(fs);
    return { set: (d, data, opts) => { b.set(d.ref, enc(d.path, data), opts || {}); }, update: (d, data) => { b.update(d.ref, enc(d.path, data)); }, delete: d => { b.delete(d.ref); }, commit: () => b.commit() };
  }
};

/* ---- Sign-in screen ---- */
const AUTH_ERR = {
  "auth/invalid-credential": "Wrong email or password.", "auth/wrong-password": "Wrong email or password.", "auth/user-not-found": "No account with that email. Create one instead.",
  "auth/email-already-in-use": "That email already has an account. Sign in instead.", "auth/weak-password": "Use at least 6 characters for the password.",
  "auth/invalid-email": "That email address doesn't look right.", "auth/network-request-failed": "No connection. Check your internet and try again.",
  "auth/popup-closed-by-user": "Google sign-in was closed before finishing.", "auth/too-many-requests": "Too many attempts. Wait a few minutes and try again."
};
const authErr = e => AUTH_ERR[e && e.code] || "Something went wrong (" + ((e && e.code) || "error") + ").";
function showAuth(mode = "in", msg = "") {
  document.querySelector("nav.tabs").style.display = "none";
  document.getElementById("fab").style.display = "none";
  document.getElementById("acct").hidden = true;
  document.getElementById("fleetbar").innerHTML = ""; document.getElementById("banner").innerHTML = "";
  document.getElementById("biz-name").textContent = "";
  document.getElementById("sync").textContent = "";
  const join = new URLSearchParams(location.search).get("join");
  const up = mode === "up";
  view().innerHTML = `<div class="auth">${window.brandHero ? window.brandHero() : ""}<div class="card">
    <h2>${up ? "Create your account" : "Sign in"}</h2>
    ${join ? `<p class="small">You've been invited. ${up ? "Create an account" : "Sign in or create an account"} to accept.</p>` : ""}
    <form id="auth-form">
      ${up ? `<label class="fl" for="a-name">Your name<input id="a-name" autocomplete="name" required maxlength="80"></label>` : ""}
      <label class="fl" for="a-email">Email<input id="a-email" type="email" autocomplete="email" required></label>
      <label class="fl" for="a-pass">Password<input id="a-pass" type="password" autocomplete="${up ? "new-password" : "current-password"}" minlength="6" required></label>
      <div class="small" id="a-err" style="color:var(--bad);min-height:1.2em">${escH(msg)}</div>
      <div class="row-actions"><button class="btn primary" type="submit">${up ? "Create account" : "Sign in"}</button></div>
    </form>
    <div class="or">or</div>
    <div class="row-actions"><button class="btn" id="a-google" type="button">Continue with Google</button></div>
    <p class="small" style="margin-top:14px">${up ? `Have an account? <a href="#" id="a-switch">Sign in</a>` : `New here? <a href="#" id="a-switch">Create an account</a> · <a href="#" id="a-reset">Forgot password</a>`}</p>
  </div></div>`;
  const err = t => { document.getElementById("a-err").textContent = t; };
  document.getElementById("a-switch").onclick = e => { e.preventDefault(); showAuth(up ? "in" : "up"); };
  const reset = document.getElementById("a-reset");
  if (reset) reset.onclick = async e => {
    e.preventDefault();
    const em = document.getElementById("a-email").value.trim();
    if (!em) return err("Type your email first, then tap Forgot password.");
    try { await sendPasswordResetEmail(auth, em); err("Check your email for a reset link."); } catch (x) { err(authErr(x)); }
  };
  document.getElementById("a-google").onclick = async () => { try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch (x) { err(authErr(x)); } };
  document.getElementById("auth-form").onsubmit = async e => {
    e.preventDefault();
    const em = document.getElementById("a-email").value.trim(), pw = document.getElementById("a-pass").value;
    const btn = e.target.querySelector("button[type=submit]"); btn.disabled = true; err("");
    try {
      if (up) {
        const name = document.getElementById("a-name").value.trim();
        try { sessionStorage.setItem("pendingName", name); } catch (x) {}
        const cred = await createUserWithEmailAndPassword(auth, em, pw);
        await updateProfile(cred.user, { displayName: name });
      } else await signInWithEmailAndPassword(auth, em, pw);
    } catch (x) { err(authErr(x)); btn.disabled = false; }
  };
}

let started = false;
onAuthStateChanged(auth, user => {
  if (!user) { uid = null; if (started) location.reload(); else showAuth("in"); return; }
  if (started) return;
  started = true; uid = user.uid;
  let name = user.displayName || "";
  try { name = name || sessionStorage.getItem("pendingName") || ""; } catch (x) {}
  window.startApp({ db, uid, name, email: user.email || "", signOut: () => signOut(auth) });
});
</script>
