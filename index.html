<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DRYVR · Empowering Every Journey Forward.</title>
<meta name="theme-color" content="#022353">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: phone-first operations ledger. Summary strip -> attention list -> tables. Bottom tab bar, sheets for data entry. Plates styled as Kenyan rear plates. */
:root {
  color-scheme: light;
  /* DRYVR official palette: Navy #022353, Green #02BD86, Lime #64D153, Teal #008191 */
  --bg: #F4F7FA;
  --surface: #ffffff;
  --ink: #022353;
  --muted: #51627B;
  --line: #DCE3EC;
  --accent: #007481;
  --accent-ink: #ffffff;
  --accent-soft: #E0F3F1;
  --brand-navy: #022353;
  --brand-green: #02BD86;
  --brand-lime: #64D153;
  --brand-teal: #008191;
  --plate: #f5c518;
  --plate-ink: #111111;
  --good: #1d7a3e;
  --good-soft: #e3f3e8;
  --warn: #9a6200;
  --warn-soft: #fbf0d9;
  --bad: #b3261e;
  --bad-soft: #fbe6e4;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --font-display: "Montserrat", "Segoe UI", Roboto, Arial, sans-serif;
  --font-body: "Manrope", "Segoe UI", Roboto, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #06142E; --surface: #0D1F3E; --ink: #E9EEF6; --muted: #A0AEC3; --line: #22365C;
    --accent: #02BD86; --accent-ink: #022353; --accent-soft: #0C3A3E;
    --good: #5cc282; --good-soft: #17301f; --warn: #e3ad4a; --warn-soft: #33280f; --bad: #f07b72; --bad-soft: #3a1b18;
    --series-1: #3987e5; --series-2: #d95926;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #06142E; --surface: #0D1F3E; --ink: #E9EEF6; --muted: #A0AEC3; --line: #22365C;
  --accent: #02BD86; --accent-ink: #022353; --accent-soft: #0C3A3E;
  --good: #5cc282; --good-soft: #17301f; --warn: #e3ad4a; --warn-soft: #33280f; --bad: #f07b72; --bad-soft: #3a1b18;
  --series-1: #3987e5; --series-2: #d95926;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 20px; font-weight: 800; }
h2 { font-size: 17px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 700; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.app { max-width: 1100px; margin: 0 auto; padding: env(safe-area-inset-top, 0px) 16px 96px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0 12px; }
header.top .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
header.top .brand .ctx { display: flex; flex-direction: column; min-width: 0; border-left: 1px solid var(--line); padding-left: 12px; }
header.top .brand .ctx h1 { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header.top .brand #today-label { font-size: 12px; color: var(--muted); }
.logo { display: inline-block; flex: none; line-height: 0; }
.logo img { display: block; height: 100%; width: auto; }
.logo .on-dark { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo .on-light { display: none; } :root:not([data-theme="light"]) .logo .on-dark { display: block; } }
:root[data-theme="dark"] .logo .on-light { display: none; } :root[data-theme="dark"] .logo .on-dark { display: block; }
.brand-hero { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px 20px; margin: 8px 0 14px; display: flex; justify-content: center; }
.brand-hero .logo { height: 92px; max-width: 100%; }
.brand-hero .logo img { max-width: 100%; height: auto; max-height: 92px; }
h1, h2 { font-weight: 800; }
header.top .brand .ctx:has(h1:empty) { display: none; }
.top-logo { height: 30px; }
header.top .brand #today-label { white-space: nowrap; }
@media (max-width: 520px) { .top-logo { height: 22px; } header.top .brand { gap: 8px; } header.top .brand .ctx { padding-left: 8px; } header.top .brand .ctx h1 { font-size: 15px; } #sync { display: none; } .brand-hero .logo, .brand-hero .logo img { height: auto; max-height: 72px; } }
.banner { padding: 10px 12px; border-radius: var(--radius); background: var(--warn-soft); color: var(--ink); border: 1px solid var(--line); margin-bottom: 12px; font-size: 14px; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; z-index: 20; padding-bottom: env(safe-area-inset-bottom); }
nav.tabs .inner { display: grid; grid-template-columns: repeat(6, 1fr); width: 100%; max-width: 640px; }
nav.tabs a { text-decoration: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px 10px; font-size: 12px; font-weight: 500; }
nav.tabs a svg { width: 22px; height: 22px; }
nav.tabs a.on { color: var(--accent); }

.section { margin: 16px 0; display: flex; flex-direction: column; gap: 10px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.grid { display: grid; gap: 10px; }
.kpis { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.kpi .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }
.kpi .value { font-family: var(--font-display); font-size: 24px; font-weight: 700; margin-top: 2px; }
.kpi .sub { font-size: 13px; color: var(--muted); }
.meter { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; text-decoration: none; color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.plate { display: inline-block; font-family: var(--font-mono); font-weight: 600; font-size: 13px; background: var(--plate); color: var(--plate-ink); padding: 1px 7px; border-radius: 4px; border: 1.5px solid #222; letter-spacing: 0.04em; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.neutral { background: var(--accent-soft); color: var(--accent); }

.alerts { display: flex; flex-direction: column; gap: 6px; }
/* Needs attention: a navy brand panel so it stands apart from the white cards */
.attn { --attn-bg: linear-gradient(135deg, #022353 0%, #0A3A6B 100%); background: var(--attn-bg); color: #fff; border-radius: 16px; padding: 20px 18px; margin: 0 0 22px; box-shadow: 0 6px 20px rgba(2, 35, 83, .22); border: 0; border-top: 6px solid #F2A93B; }
.attn.has-bad { border-top-color: #FF5A4E; }
.attn.clear { border-top-color: var(--brand-green); }
.attn-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.attn-head h2 { margin: 0; display: flex; align-items: center; gap: 12px; color: #fff; font-size: 26px; line-height: 1.15; }
.attn-n { display: inline-flex; align-items: center; justify-content: center; min-width: 48px; height: 48px; padding: 0 10px; border-radius: 24px; background: #F2A93B; color: #022353; font: 800 24px/1 var(--font-display); }
.attn.has-bad .attn-n { background: #FF5A4E; color: #fff; }
.attn .sub-lead { color: rgba(255,255,255,.78); font-size: 14px; margin: -6px 0 12px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font-size: 13px; font-weight: 700; padding: 5px 11px; border-radius: 999px; }
.attn .chip.bad { background: #FF5A4E; color: #fff; } .attn .chip.warn { background: #F2A93B; color: #022353; } .attn .chip.info { background: var(--brand-green); color: #022353; }
.attn .group { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: rgba(255,255,255,.75); margin: 16px 0 8px; }
.attn .group:first-of-type { margin-top: 0; }
.attn .alerts { gap: 8px; }
.attn .alert { background: #fff; color: #022353; border: 0; border-left: 6px solid #F2A93B; border-radius: 10px; padding: 14px 14px; gap: 12px; align-items: center; cursor: default; }
.attn .alert[data-action] { cursor: pointer; }
.attn .alert[data-action]:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(0,0,0,.18); }
.attn .alert.bad { background: #FFF1EF; border-left-color: #E5352B; }
.attn .alert .what { font-size: 16px; font-weight: 700; color: #022353; }
.attn .alert .why { font-size: 13.5px; color: #4A5A73; margin-top: 2px; }
.attn .alert .ico { flex: none; width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font: 800 15px/1 var(--font-display); color: #022353; background: #F2A93B; }
.attn .alert.bad .ico { background: #E5352B; color: #fff; }
.attn .alert .go { margin-left: auto; color: #8090A8; font-size: 24px; line-height: 1; }
.attn .more { margin-top: 12px; background: transparent; color: #fff; border-color: rgba(255,255,255,.45); }
.attn .approvals { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); border-radius: 12px; padding: 12px; margin-bottom: 4px; }
.attn .approvals h3 { margin-top: 0; color: #fff; }
.attn .approvals .muted { color: rgba(255,255,255,.75); }
.attn .approvals .li { background: #fff; color: #022353; border-radius: 10px; }
.attn .approvals .li .muted { color: #4A5A73; }
.attn .approvals .num { white-space: nowrap; }
.attn.clear .clear-msg { color: rgba(255,255,255,.85); font-size: 15px; }
.attn .pill { background: var(--brand-green); color: #022353; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .attn { --attn-bg: linear-gradient(135deg, #10305E 0%, #154A82 100%); box-shadow: 0 6px 20px rgba(0,0,0,.4); } }
:root[data-theme="dark"] .attn { --attn-bg: linear-gradient(135deg, #10305E 0%, #154A82 100%); }
@media (max-width: 520px) { .attn { padding: 16px 14px; margin-left: -4px; margin-right: -4px; } .attn-head h2 { font-size: 22px; } .attn-n { min-width: 42px; height: 42px; font-size: 21px; } }
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--warn); }
.alert.bad { border-left-color: var(--bad); }
.alert .what { font-weight: 600; }
.alert .why { font-size: 13px; color: var(--muted); }

.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; white-space: nowrap; background: var(--surface); }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--accent-soft); }

.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 12px; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: 0; }
.li .main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.li .main .t { font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.li .end { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; text-align: right; }

.empty { padding: 24px 16px; text-align: center; color: var(--muted); }
.steps { display: grid; gap: 10px; }
.step { display: flex; gap: 12px; align-items: flex-start; }
.step b.n { flex: 0 0 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 13px; }

.fab { position: fixed; right: max(16px, calc(50% - 534px)); bottom: 78px; z-index: 21; width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 28px; line-height: 1; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,0.22); }

.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 9px; border-radius: 6px; font-size: 12px; z-index: 50; display: none; white-space: nowrap; }

/* Insights */
.hbars { display: flex; flex-direction: column; }
.hb { display: grid; grid-template-columns: minmax(96px, 1.2fr) 2fr minmax(78px, auto); gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); }
.hb:last-child { border-bottom: 0; }
.hb-l { font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
.hb-t { height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; }
.hb-t i { display: block; height: 100%; border-radius: 5px; }
.hb-v { text-align: right; font-size: 14px; font-weight: 600; white-space: nowrap; }
.findings { margin: 0; padding-left: 18px; display: grid; gap: 8px; }
.findings li::marker { color: var(--accent); }
.cols { display: flex; align-items: flex-end; gap: 3px; height: 90px; padding-top: 6px; }
.cols i { flex: 1; background: var(--series-1); border-radius: 3px 3px 0 0; min-height: 2px; }
.cols i.z { background: var(--line); }
.feed .li .main .t { font-weight: 500; }
@media (max-width: 420px) { .hb { grid-template-columns: 1fr 74px; } .hb-t { grid-column: 1 / -1; grid-row: 2; } }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.42); z-index: 40; display: none; }
.scrim.open { display: block; }
.sheet { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; background: var(--surface); border-radius: 16px 16px 0 0; z-index: 41; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); display: none; }
.sheet.open { display: block; }
.sheet .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
.sheet .x { border: 0; background: transparent; font-size: 22px; cursor: pointer; color: var(--muted); padding: 4px 8px; }
form.f { display: grid; gap: 12px; }
form.f .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
label.fl { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
label.fl input, label.fl select, label.fl textarea { font-weight: 400; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; font-size: 15px; width: 100%; }
label.ck { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.hint { font-size: 12px; color: var(--muted); font-weight: 400; }
.err { color: var(--bad); font-size: 13px; }
pre.stmt { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); padding: 12px; border-radius: 8px; font-family: var(--font-mono); font-size: 12.5px; margin: 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 90px; background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 8px; z-index: 60; font-size: 14px; display: none; }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.detail-grid > div > span:first-child { display: block; font-size: 12px; color: var(--muted); }
.detail-grid div b { font-variant-numeric: tabular-nums; }
@media (max-width: 420px) { form.f .two { grid-template-columns: 1fr; } .kpi .value { font-size: 21px; } }
@media (prefers-reduced-motion: no-preference) { .sheet.open { animation: up .18s ease-out; } @keyframes up { from { transform: translate(-50%, 24px); opacity: .6; } to { transform: translate(-50%, 0); opacity: 1; } } }
.fleetbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: -4px 0 12px; }
.fleetbar:empty { display: none; }
.fleetbar .who { font-size: 13px; color: var(--muted); }
.count { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--bad); color: #fff; font-size: 12px; font-weight: 700; margin-left: 4px; }
.code { font-family: var(--font-mono); font-size: 13px; word-break: break-all; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: block; }
.ownrow { cursor: pointer; }
.ownrow .figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px 12px; margin-top: 8px; }
.ownrow .figs span { display: block; font-size: 12px; color: var(--muted); }
.ownrow .figs b { font-variant-numeric: tabular-nums; }
.people { display: grid; gap: 6px; margin-top: 6px; }
.people button { text-align: left; }
.auth { max-width: 420px; margin: 24px auto; }
.auth .or { text-align: center; color: var(--muted); font-size: 13px; margin: 12px 0; }
.big-num { font-family: var(--font-display, inherit); font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; margin: 4px 0; }
.member { display: flex; align-items: center; gap: 8px; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.member:last-child { border-bottom: 0; }
.member select { width: auto; }
.svc-lines { display: flex; flex-direction: column; gap: 8px; }
.svc-line { display: grid; grid-template-columns: 1fr 120px; gap: 6px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.svc-line .full { grid-column: 1 / -1; }
.svc-line .nums { grid-column: 1 / -1; display: grid; grid-template-columns: 70px 1fr 1fr auto; gap: 6px; align-items: center; }
.svc-line input, .svc-line select { width: 100%; min-width: 0; font-size: 14px; }
.svc-line .lt { font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
.svc-total { display: flex; justify-content: space-between; font-weight: 800; font-size: 18px; padding: 10px 2px; border-top: 2px solid var(--line); margin-top: 8px; }
.quick-lines { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
@media (max-width: 420px) { .grid2 { grid-template-columns: 1fr; } }
.insp-sec { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); margin: 0 0 10px; }
.insp-sec > summary { padding: 12px 14px; font-weight: 800; cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
.insp-sec > summary::-webkit-details-marker { display: none; }
.insp-body { padding: 0 12px 12px; }
.insp-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
"use strict";
/* ============ Constants ============ */
const TZ = "Africa/Nairobi";
const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const EXPENSE_CATS = ["Service", "Repairs & parts", "Tyres", "Fuel", "Insurance", "Inspection & licences", "Tracker", "Platform fees", "Fines & penalties", "Accident damage", "Car wash & other"];
const DOWN_REASONS = [
  { v: "Service / repair", excused: true },
  { v: "Accident", excused: true },
  { v: "No driver assigned", excused: true },
  { v: "Platform suspension", excused: true },
  { v: "Driver absent", excused: false },
  { v: "Other", excused: true }
];
const INCIDENT_TYPES = ["Accident", "Breakdown", "Police / traffic stop", "Fine", "Theft or break-in", "Damage (vandalism, hit while parked)", "Platform issue (account blocked)", "Passenger issue", "Other"];
const ABS_STATUS = { none: ["neutral", "Not needed"], needed: ["bad", "Needed"], requested: ["warn", "Requested"], received: ["good", "Received"] };
const absNeeded = i => i.abstractStatus === "needed" || i.abstractStatus === "requested";
const INC_STATUS = { reported: ["warn", "Reported"], handling: ["warn", "Being handled"], insurance: ["neutral", "Waiting on insurance"], closed: ["good", "Closed"] };
const METHODS = ["M-Pesa Till", "M-Pesa Paybill", "M-Pesa (personal)", "Cash", "Bank"];
const DEFAULT_SETTINGS = { payInfo: "", name: "DRYVR", trackStart: "", warnDays: 30, arrearsDays: 2, serviceWarnKm: 500, serviceIntervalKm: 5000 };

/* ============ Date & format helpers ============ */
const todayStr = () => new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
const toUTC = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); };
const fromUTC = t => new Date(t).toISOString().slice(0, 10);
const addDays = (s, n) => fromUTC(toUTC(s) + n * 86400000);
const dayDiff = (a, b) => Math.round((toUTC(b) - toUTC(a)) / 86400000);
const weekday = s => new Date(toUTC(s)).getUTCDay();
const monthOf = s => s.slice(0, 7);
const monthStart = m => m + "-01";
const monthEnd = m => { const [y, mo] = m.split("-").map(Number); return fromUTC(Date.UTC(y, mo, 0)); };
const addMonths = (m, n) => { const [y, mo] = m.split("-").map(Number); const d = new Date(Date.UTC(y, mo - 1 + n, 1)); return d.toISOString().slice(0, 7); };
function monthsBetween(a, b) { const out = []; let m = a; while (m <= b) { out.push(m); m = addMonths(m, 1); } return out; }
const MONTHS_SHORT = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const fmtMonth = m => MONTHS_SHORT[Number(m.slice(5, 7)) - 1] + " " + m.slice(0, 4);
const fmtDate = s => s ? Number(s.slice(8, 10)) + " " + MONTHS_SHORT[Number(s.slice(5, 7)) - 1] + " " + s.slice(0, 4) : "—";
const fmtShort = s => s ? Number(s.slice(8, 10)) + " " + MONTHS_SHORT[Number(s.slice(5, 7)) - 1] : "—";
const ksh = n => (n < 0 ? "−" : "") + "KSh " + Math.round(Math.abs(n || 0)).toLocaleString("en-KE");
const kshShort = n => { const a = Math.abs(n); const s = a >= 1e6 ? (a / 1e6).toFixed(a >= 1e7 ? 0 : 1) + "M" : a >= 1e3 ? Math.round(a / 1e3) + "k" : Math.round(a) + ""; return (n < 0 ? "−" : "") + s; };
const pct = x => isFinite(x) ? Math.round(x * 100) + "%" : "—";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const normPlate = s => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
const digits = s => String(s || "").replace(/\D/g, "");
const phoneKey = s => { const d = digits(s); return d.length >= 9 ? d.slice(-9) : ""; };
const num = v => { const n = Number(String(v ?? "").replace(/[^0-9.\-]/g, "")); return isFinite(n) ? n : 0; };

/* ============ State ============ */
const S = {
  db: null, raw: null, user: null, canWrite: true,
  role: null, fleet: null, fleets: [], fleetsReady: false, subsBy: {}, subWatch: {}, mySubs: [], ownerState: "loading", fleetMeta: null,
  mode: "loading", org: null, orgName: "", orgs: [], staffRole: null, canManage: false, isAdmin: false, accessRole: null, myAccess: [],
  waiting: new Set(), recordsReady: false, services: [], inspections: [], stockItems: [], stockMoves: [], fleetCars: {}, perfKind: "cars", perfMetric: "score", stockQ: "", contracts: [], priv: {}, myPriv: null, template: null, incidents: [], members: [], names: {}, top: [], accessBy: {}, accWatch: {}, evBy: {}, evWatch: {}, evKnown: new Set(), evReady: new Set(), seenAt: "", driverId: null, stmt: null, stmtReady: false, join: null, me: {},
  cars: [], drivers: [], assigns: [], settings: { ...DEFAULT_SETTINGS },
  months: {},          // "YYYY-MM" -> {payments:[], expenses:[], downtime:[], odo:[]}
  loadedMonths: new Set(), subs: [], coreReady: { cars: false, drivers: false, assigns: false, settings: false },
  period: "month", view: "home", detail: null, calc: null, uid: null, act: {}, vis: {}, actLoaded: false, insTab: "business"
};
const KINDS = ["payments", "expenses", "downtime", "odo"];
const all = kind => Object.values(S.months).flatMap(m => m[kind] || []);
const carById = id => S.cars.find(c => c.id === id);
const driverById = id => S.drivers.find(d => d.id === id);
const carLabel = id => { const c = carById(id); return c ? c.plate : "Unknown car"; };
const driverName = id => { const d = driverById(id); return d ? d.name : "Unknown driver"; };
function trackStart() { return S.settings.trackStart || monthStart(monthOf(todayStr())); }

function assignOn(carId, date) {
  return S.assigns.find(a => a.carId === carId && a.start <= date && (!a.end || a.end >= date));
}
function driverAssignOn(driverId, date) {
  return S.assigns.find(a => a.driverId === driverId && a.start <= date && (!a.end || a.end >= date));
}
function currentAssignForDriver(id) { return driverAssignOn(id, todayStr()); }
function currentAssignForCar(id) { return assignOn(id, todayStr()); }

/* ============ Calculation engine ============ */
function periodRange(p) {
  const T = todayStr(), m = monthOf(T), ts = trackStart();
  if (p === "month") return { from: monthStart(m), to: T, label: fmtMonth(m) + " to date" };
  if (p === "last") { const lm = addMonths(m, -1); return { from: monthStart(lm), to: monthEnd(lm), label: fmtMonth(lm) }; }
  if (p === "ytd") return { from: T.slice(0, 4) + "-01-01", to: T, label: "Year to date" };
  return { from: ts, to: T, label: "Since " + fmtDate(ts) };
}

function compute() {
  const T = todayStr(), TS = trackStart();
  const P = periodRange(S.period);
  const from = P.from < TS ? TS : P.from, to = P.to;
  const inP = d => d >= from && d <= to;

  // downtime map: carId -> Map(date -> {excused, reason})
  const down = {};
  // Incidents where the car can't be driven count as off-road days automatically
  const incDown = (S.incidents || []).filter(i => i.offRoad && i.carId && i.date).map(i => ({ carId: i.carId, from: i.date, to: i.backOnRoad || "", excused: i.excused !== false, reason: "Incident: " + i.type }));
  for (const x of [...all("downtime"), ...incDown]) {
    if (!x.carId || !x.from) continue;
    const end = x.to && x.to < T ? x.to : (x.to || T) > T ? T : (x.to || T);
    const m = down[x.carId] || (down[x.carId] = new Map());
    for (let d = x.from; d <= end; d = addDays(d, 1)) {
      const prev = m.get(d);
      // an unexcused entry wins only if no excused entry covers the day
      if (!prev || (!prev.excused && x.excused !== false)) m.set(d, { excused: x.excused !== false, reason: x.reason });
    }
  }

  const ds = {}, cs = {}, fleetM = {};
  const dInit = id => ds[id] || (ds[id] = { expAll: 0, expP: 0, payAll: 0, payP: 0, chgAll: 0, chgP: 0, credAll: 0, credP: 0, lastPay: null });
  const cInit = id => cs[id] || (cs[id] = { expP: 0, revP: 0, revAll: 0, costP: 0, costAll: 0, earnP: 0, denomP: 0, downP: 0, idleP: 0, kmP: 0, revM: {}, costM: {} });
  const fInit = m => fleetM[m] || (fleetM[m] = { rev: 0, cost: 0, exp: 0 });
  S.drivers.forEach(d => dInit(d.id));
  S.cars.forEach(c => cInit(c.id));

  // Day loop per car
  for (const c of S.cars) {
    const st = c.inServiceDate && c.inServiceDate > TS ? c.inServiceDate : TS;
    const en = c.soldDate && c.soldDate < T ? c.soldDate : T;
    const cst = cs[c.id], dm = down[c.id];
    for (let d = st; d <= en; d = addDays(d, 1)) {
      const a = assignOn(c.id, d);
      if (a && a.restDay !== "" && a.restDay != null && Number(a.restDay) === weekday(d)) continue;
      const dn = dm && dm.get(d);
      const p = inP(d);
      if (p) { cst.denomP++; if (dn) cst.downP++; else if (!a) cst.idleP++; }
      if (a) {
        const rate = Number(a.rate) || 0;
        if (!(dn && dn.excused)) {
          const dst = dInit(a.driverId);
          dst.expAll += rate;
          fInit(monthOf(d)).exp += rate;
          if (p) { dst.expP += rate; cst.expP += rate; }
        }
        if (!dn && p) cst.earnP++;
      }
    }
  }
  for (const x of all("payments")) {
    if (x.date < TS) continue;
    const amt = Number(x.amount) || 0, dst = dInit(x.driverId);
    dst.payAll += amt;
    if (!dst.lastPay || x.date > dst.lastPay) dst.lastPay = x.date;
    if (inP(x.date)) dst.payP += amt;
    fInit(monthOf(x.date)).rev += amt;
    if (x.carId) { const c = cInit(x.carId); c.revAll += amt; c.revM[monthOf(x.date)] = (c.revM[monthOf(x.date)] || 0) + amt; if (inP(x.date)) c.revP += amt; }
  }
  for (const x of all("expenses")) {
    if (x.date < TS) continue;
    const amt = Number(x.amount) || 0;
    fInit(monthOf(x.date)).cost += amt;
    if (x.carId) { const c = cInit(x.carId); c.costAll += amt; c.costM[monthOf(x.date)] = (c.costM[monthOf(x.date)] || 0) + amt; if (inP(x.date)) c.costP += amt; }
    if (x.chargeDriver && x.driverId) { const dst = dInit(x.driverId); dst.chgAll += amt; if (inP(x.date)) dst.chgP += amt; }
    // A car cost the driver paid from their own money: still the owner's cost, and deducted from what the driver owes
    else if (x.driverPaid && x.driverId) { const dst = dInit(x.driverId); dst.credAll += amt; if (inP(x.date)) dst.credP += amt; }
  }
  // Insurance payouts on incidents reduce the owner's costs
  for (const i of S.incidents || []) {
    const paid = Number(i.claimPaid) || 0;
    if (!paid || !i.claimPaidDate || i.claimPaidDate < TS) continue;
    fInit(monthOf(i.claimPaidDate)).cost -= paid;
    if (i.carId) { const c = cInit(i.carId); c.costAll -= paid; c.costM[monthOf(i.claimPaidDate)] = (c.costM[monthOf(i.claimPaidDate)] || 0) - paid; if (inP(i.claimPaidDate)) c.costP -= paid; }
  }
  // Odometer
  const odoBy = {};
  for (const x of all("odo")) (odoBy[x.carId] || (odoBy[x.carId] = [])).push({ date: x.date, km: Number(x.km) || 0 });
  for (const x of all("expenses")) if (x.odometer && x.carId) (odoBy[x.carId] || (odoBy[x.carId] = [])).push({ date: x.date, km: Number(x.odometer) || 0 });
  const odoInfo = {};
  for (const c of S.cars) {
    const r = (odoBy[c.id] || []).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.km - b.km);
    const last = r[r.length - 1];
    const before = r.filter(x => x.date < from).pop();
    const inside = r.filter(x => inP(x.date));
    let kmP = 0;
    if (inside.length) { const base = before ? before.km : inside[0].km; kmP = Math.max(0, inside[inside.length - 1].km - base); }
    cs[c.id].kmP = kmP;
    const svc = all("expenses").filter(x => x.carId === c.id && x.category === "Service" && x.odometer).map(x => Number(x.odometer));
    const lastService = Math.max(Number(c.lastServiceKm) || 0, ...svc, 0);
    // a service visit can set its own "next service at" km; otherwise use the car's or fleet's interval
    const baseIv = Number(c.serviceIntervalKm) || Number(S.settings.serviceIntervalKm) || 5000;
    const sv = (S.services || []).filter(x => x.carId === c.id && Number(x.odometer) === lastService && Number(x.nextKm) > lastService).sort((a, b) => b.date.localeCompare(a.date))[0];
    odoInfo[c.id] = { lastKm: last ? last.km : null, lastDate: last ? last.date : null, lastService, iv: sv ? Number(sv.nextKm) - lastService : baseIv };
  }

  // Driver balances
  const drivers = S.drivers.map(d => {
    const s = ds[d.id], a = currentAssignForDriver(d.id);
    const st = d.settlement || null;
    const settleAmt = st ? (Number(st.depositUsed) || 0) + (Number(st.writeOff) || 0) - (Number(st.refund) || 0) : 0;
    const balance = (Number(d.openingBalance) || 0) + s.expAll + s.chgAll - s.payAll - s.credAll - settleAmt;
    const rate = a ? Number(a.rate) || 0 : 0;
    const daysBehind = rate ? balance / rate : 0;
    let status = "good", statusLabel = "Up to date";
    if (st && Math.abs(balance) <= 1) { status = "neutral"; statusLabel = "Settled"; }
    else if (balance < -1) { status = "good"; statusLabel = "In credit"; }
    else if (balance > 1) { if (daysBehind > Number(S.settings.arrearsDays || 2)) { status = "bad"; statusLabel = "In arrears"; } else { status = "warn"; statusLabel = "Slightly behind"; } }
    return { ...d, ...s, balance, rate, daysBehind, assign: a, status, statusLabel, collRateP: s.expP + s.chgP ? s.payP / (s.expP + s.chgP) : NaN };
  });

  // Car rows
  const cars = S.cars.map(c => {
    const s = cs[c.id], a = currentAssignForCar(c.id), o = odoInfo[c.id];
    const net = s.revP - s.costP, netAll = s.revAll - s.costAll;
    const price = Number(c.purchasePrice) || 0;
    const recentMs = [1, 2, 3].map(i => addMonths(monthOf(T), -i));
    const avgNet = recentMs.reduce((t, m) => t + (s.revM[m] || 0) - (s.costM[m] || 0), 0) / 3;
    const remain = price - netAll;
    const today = down[c.id] && down[c.id].get(T);
    let status = "good", statusLabel = "On the road";
    if (c.soldDate && c.soldDate <= T) { status = "neutral"; statusLabel = "Sold"; }
    else if (today) { status = "bad"; statusLabel = "Off road · " + today.reason; }
    else if (!a) { status = "warn"; statusLabel = "No driver"; }
    else if (a.restDay !== "" && a.restDay != null && Number(a.restDay) === weekday(T)) { status = "neutral"; statusLabel = "Rest day"; }
    return {
      ...c, ...s, assign: a, driver: a ? driverById(a.driverId) : null, net, netAll, price,
      util: s.denomP ? s.earnP / s.denomP : NaN, collRate: s.expP ? s.revP / s.expP : NaN,
      payback: price ? netAll / price : NaN, monthsLeft: price && remain > 0 && avgNet > 0 ? remain / avgNet : (price && remain <= 0 ? 0 : NaN),
      costPerKm: s.kmP ? s.costP / s.kmP : NaN, odo: o, status, statusLabel, downToday: today
    };
  });

  // Today
  const todayRows = [];
  for (const a of S.assigns.filter(a => a.start <= T && (!a.end || a.end >= T))) {
    const car = carById(a.carId); if (!car) continue;
    const isRest = a.restDay !== "" && a.restDay != null && Number(a.restDay) === weekday(T);
    const dn = down[a.carId] && down[a.carId].get(T);
    const due = isRest || (dn && dn.excused) ? 0 : Number(a.rate) || 0;
    const paid = all("payments").filter(p => p.driverId === a.driverId && p.date === T).reduce((t, p) => t + (Number(p.amount) || 0), 0);
    todayRows.push({ a, car, driver: driverById(a.driverId), due, paid, isRest, dn });
  }

  // Fleet totals for period
  const tot = cars.reduce((t, c) => { t.rev += c.revP; t.cost += c.costP; t.exp += c.expP; t.earn += c.earnP; t.denom += c.denomP; return t; }, { rev: 0, cost: 0, exp: 0, earn: 0, denom: 0 });
  // payments with no car still count as revenue
  const unassignedRev = all("payments").filter(p => !p.carId && inP(p.date) && p.date >= TS).reduce((t, p) => t + (Number(p.amount) || 0), 0);
  tot.rev += unassignedRev;
  tot.net = tot.rev - tot.cost;
  tot.arrears = drivers.filter(d => d.balance > 0).reduce((t, d) => t + d.balance, 0);
  tot.charges = drivers.reduce((t, d) => t + d.chgP, 0);

  // Alerts
  const alerts = [];
  for (const car of S.cars) {
    if (car.soldDate && car.soldDate <= T) continue;
    const last = latestInsp(car.id);
    if (last) {
      const open = inspFindings(last).filter(f => f.st === "now" && !f.fixed);
      if (open.length) alerts.push({ sev: "bad", what: `${car.plate}: ${open.length} item${open.length === 1 ? "" : "s"} need${open.length === 1 ? "s" : ""} attention now`, why: `${open.slice(0, 3).map(f => f.label).join(", ")}${open.length > 3 ? "…" : ""} · inspection ${fmtDate(last.date)}`, link: "insp:" + last.id, sort: 6 });
      if (S.mode === "staff" && dayDiff(last.date, T) > (Number(S.settings.inspectEveryDays) || 90)) alerts.push({ sev: "warn", what: `${car.plate} is due for an inspection`, why: `Last one ${fmtDate(last.date)}`, link: "car:" + car.id, sort: 28 });
    }
  }
  if (S.mode === "staff") for (const it of lowStock()) alerts.push({ sev: it.qty <= 0 ? "bad" : "warn", what: `${it.qty <= 0 ? "Out of stock" : "Low stock"}: ${it.name}`, why: `${fmtQty(it.qty)} ${it.unit || "pcs"} left · reorder at ${it.reorder}`, link: "stock:" + it.id, sort: 30 });
  if (S.mode === "staff") for (const d of drivers) {
    if (!d.assign) continue;
    const ks = (S.contracts || []).filter(k => k.driverId === d.id && k.status !== "ended" && k.status !== "void");
    const signed = ks.find(k => k.status === "signed");
    if (signed) {
      if (signed.end && signed.end < T) alerts.push({ sev: "bad", what: `${d.name}'s contract has ended`, why: `Ended ${fmtDate(signed.end)} but they still have a car. Prepare a new one.`, link: "driver:" + d.id, sort: 3 });
      else if (signed.end && dayDiff(T, signed.end) <= 30) alerts.push({ sev: "warn", what: `${d.name}'s contract ends in ${dayDiff(T, signed.end)} days`, why: `Ends ${fmtDate(signed.end)}. Prepare a renewal.`, link: "driver:" + d.id, sort: 20 });
    } else {
      const waiting = ks.find(k => k.status === "sent" || k.status === "driver_signed");
      if (waiting) { const age = dayDiff(String(waiting.sentAt || waiting.createdAt || T).slice(0, 10), T); if (waiting.status === "driver_signed") alerts.push({ sev: "warn", what: `Countersign ${d.name}'s contract`, why: "The driver has signed. A manager needs to sign too.", link: "driver:" + d.id, sort: 12 }); else if (age >= 3) alerts.push({ sev: "warn", what: `${d.name} hasn't signed their contract`, why: `Sent ${age} days ago`, link: "driver:" + d.id, sort: 22 }); }
      else alerts.push({ sev: "warn", what: `No signed contract for ${d.name}`, why: "Prepare one from their driver page", link: "driver:" + d.id, sort: 25 });
    }
  }
  for (const i of S.incidents || []) {
    if (i.status === "closed") continue;
    const age = dayDiff(i.date, T);
    if (absNeeded(i)) alerts.push({ sev: dayDiff(i.date, T) > 7 ? "bad" : "warn", what: "Police abstract still needed", why: `${i.type}${i.carId ? " · " + carLabel(i.carId) : ""} · ${fmtDate(i.date)}${i.abstractStatus === "requested" ? " · requested" : ""}`, link: "incident:" + i.id, sort: 8 });
    alerts.push({ sev: i.injured || (i.offRoad && !i.backOnRoad) ? "bad" : "warn", what: `Open incident: ${i.type}`, why: `${i.carId ? carLabel(i.carId) + " · " : ""}${fmtDate(i.date)}${age > 0 ? ` · ${age} day${age === 1 ? "" : "s"} ago` : ""}${i.offRoad && !i.backOnRoad ? " · car off road" : ""}`, link: "incident:" + i.id, sort: i.injured ? -10 : 5 });
  }
  const W = Number(S.settings.warnDays) || 30;
  const docCheck = (date, what, who, link) => {
    if (!date) return;
    const left = dayDiff(T, date);
    if (left < 0) alerts.push({ sev: "bad", what: `${what} expired`, why: `${who} · expired ${fmtDate(date)}`, link, sort: left });
    else if (left <= W) alerts.push({ sev: left <= 7 ? "bad" : "warn", what: `${what} due in ${left} day${left === 1 ? "" : "s"}`, why: `${who} · ${fmtDate(date)}`, link, sort: left });
  };
  for (const c of cars) {
    if (c.soldDate && c.soldDate <= T) continue;
    docCheck(c.insuranceExpiry, "Insurance", c.plate, "car:" + c.id);
    docCheck(c.inspectionExpiry, "NTSA inspection", c.plate, "car:" + c.id);
    docCheck(c.tncExpiry, "PSV / platform licence", c.plate, "car:" + c.id);
    docCheck(c.trackerExpiry, "Tracker subscription", c.plate, "car:" + c.id);
    const iv = c.odo.iv;
    if (c.odo.lastKm != null && c.odo.lastService) {
      const since = c.odo.lastKm - c.odo.lastService, left = iv - since;
      if (left <= (Number(S.settings.serviceWarnKm) || 500)) alerts.push({ sev: left < 0 ? "bad" : "warn", what: left < 0 ? `Service overdue by ${Math.abs(left).toLocaleString()} km` : `Service due in ${left.toLocaleString()} km`, why: `${c.plate} · ${c.odo.lastKm.toLocaleString()} km now, last service at ${c.odo.lastService.toLocaleString()} km`, link: "car:" + c.id, sort: left / 100 });
    }
    if (c.assign && (!c.odo.lastDate || dayDiff(c.odo.lastDate, T) > 8)) alerts.push({ sev: "warn", what: "Mileage not recorded this week", why: `${c.plate} · last reading ${c.odo.lastDate ? fmtDate(c.odo.lastDate) : "never"}`, link: "car:" + c.id, sort: 50 });
    if (!c.assign && !c.downToday) alerts.push({ sev: "warn", what: "Car has no driver", why: `${c.plate} is earning nothing`, link: "car:" + c.id, sort: 5 });
  }
  for (const d of drivers) {
    if (d.status === "bad") alerts.push({ sev: "bad", what: `${d.name} owes ${ksh(d.balance)}`, why: `About ${d.daysBehind.toFixed(1)} days of payments behind`, link: "driver:" + d.id, sort: -d.daysBehind });
    docCheck(d.licenseExpiry, "Driving licence", d.name, "driver:" + d.id);
    docCheck(d.psvBadgeExpiry, "PSV badge", d.name, "driver:" + d.id);
  }
  alerts.sort((a, b) => (a.sev === b.sev ? 0 : a.sev === "bad" ? -1 : 1) || a.sort - b.sort);

  // Trend: last 6 months
  const curM = monthOf(T);
  const trend = monthsBetween(addMonths(curM, -5), curM).filter(m => m >= monthOf(TS)).map(m => ({ m, ...(fleetM[m] || { rev: 0, cost: 0, exp: 0 }) }));

  return { T, P: { ...P, from }, drivers, cars, todayRows, tot, alerts, trend, down, fleetM };
}

/* ============ Data layer ============ */
function monthBucket(m) { return S.months[m] || (S.months[m] = { payments: [], expenses: [], downtime: [], odo: [] }); }
const snapRows = snap => snap.docs.map(d => ({ id: d.id, ...d.data() }));

/* ============ Brand ============ */
window.brandHero = () => `<div class="brand-hero"><span class="logo"><img class="on-light" src="logo-full.png" alt="DRYVR: Empowering Every Journey Forward."><img class="on-dark" src="logo-full-dark.png" alt="DRYVR: Empowering Every Journey Forward."></span></div>`;

/* ============ Start-up (the Firebase module calls startApp once someone is signed in) ============ */
const fleetBase = (fid = S.fleet) => `orgs/${S.org}/fleets/${fid}`;
const ROLE_LABEL = { admin: "Admin", manager: "Manager", clerk: "Data entry", owner: "Owner", owner_viewer: "Owner's family (view only)", driver: "Driver" };
const canSubmit = () => S.mode === "owner" && S.accessRole === "owner";
const errText = e => {
  const c = e && e.code || "";
  if (c === "permission-denied") return "your role isn't allowed to do that";
  if (c === "unavailable") return "you seem to be offline";
  return c || "unexpected error";
};

window.startApp = async function (ctx) {
  S.raw = ctx.db; S.uid = ctx.uid; S.me = { name: ctx.name || "", email: ctx.email || "" }; S.signOut = ctx.signOut;
  // Inside a fleet, the app reads and writes through this wrapper: orgs/<org>/fleets/<fleet>/…
  S.db = { collection: p => S.raw.collection(`${fleetBase()}/${p}`), doc: p => S.raw.doc(`${fleetBase()}/${p}`) };
  document.getElementById("today-label").textContent = fmtDate(todayStr());
  document.getElementById("acct").hidden = false;
  const join = new URLSearchParams(location.search).get("join");
  if (join) return showJoin(join.trim());
  return findHome();
};

function stopAll() {
  resetFleetState();
  for (const u of S.top) { try { u(); } catch (e) {} }
  for (const u of Object.values(S.subWatch)) { try { u(); } catch (e) {} }
  for (const u of Object.values(S.accWatch)) { try { u(); } catch (e) {} }
  for (const arr of Object.values(S.evWatch)) for (const u of arr) { try { u(); } catch (e) {} }
  S.top = []; S.subWatch = {}; S.accWatch = {}; S.subsBy = {}; S.accessBy = {}; S.evWatch = {}; S.evBy = {};
  S.fleet = null; S.fleetMeta = null; S.fleets = []; S.fleetsReady = false; S.mySubs = []; S.stmt = null; S.stmtReady = false;
}

async function findHome() {
  S.mode = "loading"; setSync("Loading…"); render();
  let orgIds = [];
  try { const p = await S.raw.doc(`users/${S.uid}`).get(); orgIds = p.exists ? (p.data().orgs || []) : []; S.seenAt = p.exists ? (p.data().notifSeenAt || "") : ""; if (p.exists && p.data().name && !S.me.name) S.me.name = p.data().name; } catch (e) {}
  const staffOf = [];
  for (const o of orgIds) {
    try {
      const m = await S.raw.doc(`orgs/${o}/members/${S.uid}`).get();
      if (!m.exists) continue;
      const org = await S.raw.doc(`orgs/${o}`).get();
      staffOf.push({ id: o, role: m.data().role, name: org.exists ? org.data().name : "Organisation" });
    } catch (e) {}
  }
  S.orgs = staffOf;
  let acc = [];
  try {
    const q = await S.raw.group("access").where("uid", "==", S.uid).get();
    acc = q.docs.map(d => { const seg = d.path.split("/"); return { org: seg[1], fleet: seg[3], ...d.data() }; });
  } catch (e) {}
  S.myAccess = acc;
  if (staffOf.length) {
    let saved = null; try { saved = localStorage.getItem("org"); } catch (e) {}
    return startStaff(staffOf.find(x => x.id === saved) || staffOf[0]);
  }
  if (acc.length) {
    let saved = null; try { saved = localStorage.getItem("access"); } catch (e) {}
    return startAccess(acc.find(x => `${x.org}/${x.fleet}` === saved) || acc[0]);
  }
  S.mode = "welcome"; setSync(""); render();
}

function resetFleetState() {
  for (const u of S.subs) { try { u(); } catch (e) {} }
  S.subs = []; S.cars = []; S.drivers = []; S.assigns = []; S.settings = { ...DEFAULT_SETTINGS };
  S.months = {}; S.loadedMonths = new Set(); S.coreReady = { cars: false, drivers: false, assigns: false, settings: false };
  S.act = {}; S.vis = {}; S.actLoaded = false; S.detail = null; S.calc = null; S._sumKey = null; S.incidents = [];
  S.waiting = new Set(); S.recordsReady = false; clearTimeout(S._readyTimer); S._readyTimer = null; S.contracts = []; S.priv = {}; S.inspections = []; S.services = [];
}

function loadFleet() {
  const timer = setTimeout(() => setSync("Can't reach the data yet. Check your connection."), 10000);
  const onErr = e => { clearTimeout(timer); setSync("Data unavailable: " + errText(e)); };
  const core = (name, coll, key) => S.subs.push(S.db.collection(coll).onSnapshot(snap => {
    clearTimeout(timer);
    S[key] = snapRows(snap);
    S.coreReady[name] = true;
    syncFrom(snap);
    afterCore();
  }, onErr, { meta: true }));
  core("cars", "cars", "cars");
  core("drivers", "drivers", "drivers");
  core("assigns", "assignments", "assigns");
  // Incidents load alongside, without holding up the first screen
  S.subs.push(S.db.collection("incidents").onSnapshot(snap => { S.incidents = snapRows(snap); if (Object.values(S.coreReady).every(Boolean)) render(); }, () => {}));
  S.subs.push(S.db.collection("services").onSnapshot(snap => { S.services = snapRows(snap); if (Object.values(S.coreReady).every(Boolean)) render(); }, () => {}));
  S.subs.push(S.db.collection("inspections").onSnapshot(snap => { S.inspections = snapRows(snap); if (Object.values(S.coreReady).every(Boolean)) render(); }, () => {}));
  if (S.mode === "staff") S.subs.push(S.db.collection("contracts").onSnapshot(snap => { S.contracts = snapRows(snap); if (Object.values(S.coreReady).every(Boolean)) render(); }, () => {}));
  S.subs.push(S.db.doc("settings/main").onSnapshot(snap => {
    S.settings = { ...DEFAULT_SETTINGS, ...(snap.exists ? snap.data() : {}) };
    S.coreReady.settings = true;
    afterCore();
  }, onErr));
  logVisit();
}

/* ---- Staff (admin, manager, data entry): every fleet in the organisation ---- */
function startStaff(o) {
  stopAll();
  S.mode = "staff"; S.role = "manager"; S.org = o.id; S.orgName = o.name; S.staffRole = o.role;
  S.canWrite = true; S.canManage = o.role === "admin" || o.role === "manager"; S.isAdmin = o.role === "admin";
  try { localStorage.setItem("org", o.id); } catch (e) {}
  setSync("Loading…");
  S.top.push(S.raw.collection(`orgs/${o.id}/members`).onSnapshot(snap => {
    S.members = snapRows(snap);
    for (const m of S.members) S.names[m.id] = m.name || "Staff";
    const mine = S.members.find(m => m.id === S.uid);
    if (mine && mine.role !== S.staffRole) { S.staffRole = mine.role; S.canManage = mine.role !== "clerk"; S.isAdmin = mine.role === "admin"; }
    render();
  }, () => {}));
  S.top.push(S.raw.collection(`orgs/${o.id}/stockItems`).onSnapshot(snap => { S.stockItems = snapRows(snap); render(); }, () => {}));
  S.top.push(S.raw.collection(`orgs/${o.id}/stockMoves`).onSnapshot(snap => { S.stockMoves = snapRows(snap); render(); }, () => {}));
  const timer = setTimeout(() => setSync("Can't reach the data yet. Check your connection."), 10000);
  S.top.push(S.raw.collection(`orgs/${o.id}/fleets`).onSnapshot(snap => {
    clearTimeout(timer);
    S.fleets = snapRows(snap).sort((a, b) => String(a.name || "").localeCompare(String(b.name || "")));
    S.fleetsReady = true;
    syncFrom(snap);
    for (const f of S.fleets) watchFleet(f.id);
    S.fleetMeta = S.fleets.find(f => f.id === S.fleet) || null;
    if (!S.fleet) {
      let saved = null; try { saved = localStorage.getItem("fleet:" + S.org); } catch (e) {}
      if (saved && S.fleets.some(f => f.id === saved) && S.view !== "owners") { selectFleet(saved); return; }
    }
    render();
  }, e => { clearTimeout(timer); setSync("Data unavailable: " + errText(e)); }, { meta: true }));
}
function watchFleet(fid) {
  watchEvents(fid, ["staff"]);
  if (!S.subWatch[fid]) S.subWatch[fid] = S.raw.collection(`${fleetBase(fid)}/submissions`).onSnapshot(snap => { S.subsBy[fid] = snapRows(snap); render(); }, () => {});
  if (!S.accWatch[fid]) S.accWatch[fid] = S.raw.collection(`${fleetBase(fid)}/access`).onSnapshot(snap => {
    S.accessBy[fid] = snapRows(snap);
    for (const a of S.accessBy[fid]) if (a.name) S.names[a.id] = a.name;
    render();
  }, () => {});
}
const pendingFor = fid => (S.subsBy[fid] || []).filter(x => x.status === "pending").sort((a, b) => String(a.submittedAt).localeCompare(String(b.submittedAt)));
const pendingAll = () => S.fleets.reduce((t, f) => t + pendingFor(f.id).length, 0);

function selectFleet(fid) {
  resetFleetState();
  S.fleet = fid; S.fleetMeta = S.fleets.find(f => f.id === fid) || null;
  try { localStorage.setItem("fleet:" + S.org, fid); } catch (e) {}
  setSync("Loading…");
  loadFleet();
  if (S.view === "owners") location.hash = "home"; else render();
  window.scrollTo(0, 0);
}
function leaveFleet() {
  resetFleetState(); S.fleet = null; S.fleetMeta = null;
  try { localStorage.removeItem("fleet:" + S.org); } catch (e) {}
  if (location.hash !== "#owners") location.hash = "owners"; else render();
}

/* ---- Owners, owners' family and drivers: one fleet ---- */
function startAccess(a) {
  stopAll();
  S.org = a.org; S.fleet = a.fleet; S.accessRole = a.role; S.canWrite = false; S.canManage = false; S.isAdmin = false;
  try { localStorage.setItem("access", `${a.org}/${a.fleet}`); } catch (e) {}
  S.top.push(S.raw.doc(fleetBase()).onSnapshot(s => { S.fleetMeta = s.exists ? { id: s.id, ...s.data() } : null; render(); }, () => {}));
  if (a.role === "driver") {
    S.mode = "driver"; S.role = "driver"; S.driverId = a.driverId;
    S.top.push(S.raw.doc(`${fleetBase()}/statements/${a.driverId}`).onSnapshot(s => {
      S.stmt = s.exists ? s.data() : null; S.stmtReady = true;
      syncFrom(s);
      render();
    }, e => { S.stmtReady = true; setSync("Data unavailable: " + errText(e)); render(); }, { meta: true }));
    S.top.push(S.raw.collection(`${fleetBase()}/submissions`).where("by", "==", S.uid).onSnapshot(snap => {
      S.mySubs = snapRows(snap).sort((a, b) => String(b.submittedAt).localeCompare(String(a.submittedAt)));
      render();
    }, () => {}));
    S.top.push(S.raw.collection(`${fleetBase()}/incidents`).where("driverId", "==", a.driverId).onSnapshot(snap => { S.incidents = snapRows(snap); render(); }, () => {}));
    S.top.push(S.raw.collection(`${fleetBase()}/contracts`).where("driverId", "==", a.driverId).onSnapshot(snap => { S.contracts = snapRows(snap).filter(x => x.status !== "draft"); render(); }, () => {}));
    S.top.push(S.raw.doc(`${fleetBase()}/drivers/${a.driverId}/private/details`).onSnapshot(snap => { S.myPriv = snap.exists ? snap.data() : null; render(); }, () => {}));
    watchEvents(a.fleet, ["driver:" + a.driverId, "uid:" + S.uid]);
    render(); return;
  }
  S.mode = "owner"; S.role = "owner"; S.ownerState = "ready";
  S.top.push(S.raw.collection(`${fleetBase()}/submissions`).onSnapshot(snap => {
    S.mySubs = snapRows(snap).sort((a, b) => String(b.submittedAt).localeCompare(String(a.submittedAt)));
    render();

/* ============ Updates (in-app notifications) ============ */
// Events live at orgs/<org>/fleets/<fleet>/months/<YYYY-MM>/events, addressed to "staff", "owners", "driver:<id>" or "uid:<user>".
function prevMonth(m) { let [y, mo] = m.split("-").map(Number); mo--; if (!mo) { mo = 12; y--; } return `${y}-${String(mo).padStart(2, "0")}`; }
function watchEvents(fid, audiences) {
  if (S.evWatch[fid]) return;
  const m = monthOf(todayStr()), months = [m, prevMonth(m)];
  S.evWatch[fid] = [];
  for (const mm of months) for (const to of audiences) {
    const key = `${fid}|${mm}|${to}`;
    S.evWatch[fid].push(S.raw.collection(`${fleetBase(fid)}/months/${mm}/events`).where("to", "==", to).onSnapshot(snap => {
      const rows = snapRows(snap).map(r => ({ ...r, fid }));
      const fresh = S.evReady.has(key) ? rows.filter(r => !S.evKnown.has(r.id) && r.by !== S.uid) : [];
      rows.forEach(r => S.evKnown.add(r.id));
      S.evReady.add(key);
      S.evBy[key] = rows;
      if (fresh.length) announce(fresh);
      renderBell();
      if (S.mode === "driver") render();
    }, () => {}));
  }
}
function allEvents() {
  const seen = new Set(), out = [];
  for (const rows of Object.values(S.evBy)) for (const r of rows) { if (seen.has(r.id) || r.by === S.uid) continue; seen.add(r.id); out.push(r); }
  return out.sort((a, b) => String(b.at).localeCompare(String(a.at))).slice(0, 60);
}
const unreadEvents = () => allEvents().filter(e => String(e.at) > String(S.seenAt || ""));
function renderBell() {
  const b = document.getElementById("bell"), n = document.getElementById("bell-n");
  if (!b) return;
  const show = ["staff", "owner", "driver"].includes(S.mode);
  b.hidden = !show; if (!show) return;
  const u = unreadEvents().length;
  n.hidden = !u; n.textContent = u > 9 ? "9+" : String(u);
  b.setAttribute("aria-label", u ? `Updates, ${u} new` : "Updates");
}
function announce(list) {
  const e = list[0];
  toast(list.length > 1 ? `${list.length} new updates` : e.text);
  try {
    if (document.visibilityState === "hidden" && "Notification" in window && Notification.permission === "granted") {
      const title = "DRYVR", body = list.length > 1 ? `${list.length} new updates. ${e.text}` : e.text;
      if (navigator.serviceWorker && navigator.serviceWorker.ready) navigator.serviceWorker.ready.then(r => r.showNotification(title, { body, icon: "icon-192.png", badge: "icon-192.png", tag: "dryvr-" + e.id })).catch(() => {});
      else new Notification(title, { body, icon: "icon-192.png" });

  } catch (x) {}
}
function postEvent(fid, to, type, text, extra) {

  const data = { to, type, text: String(text || "").slice(0, 200), at: S.raw.TS, by: S.uid, ...(extra || {}) };
  S.raw.collection(`${fleetBase(fid)}/months/${monthOf(todayStr())}/events`).doc().set(data).catch(() => {});
}
function reminders() {
  const out = [];
  if (S.mode === "driver" && S.stmt) {
    const st = S.stmt, sv = st.service;
    if (sv && sv.left != null && sv.left <= (sv.warnKm || 500)) out.push({ sev: sv.left < 0 ? "bad" : "warn", what: sv.left < 0 ? `Service overdue by ${Math.abs(sv.left).toLocaleString()} km` : `Service due in ${sv.left.toLocaleString()} km`, why: `${st.car || "Your car"} · tell your manager to book it` });
    for (const d of docList(st)) if (d.days != null && d.days <= (st.warnDays || 30)) out.push({ sev: d.days < 0 ? "bad" : "warn", what: d.days < 0 ? `${d.label} expired` : `${d.label} expires in ${d.days} day${d.days === 1 ? "" : "s"}`, why: fmtDate(d.date) });
    for (const i of S.incidents || []) if (i.status !== "closed" && absNeeded(i)) out.push({ sev: "warn", what: "Police abstract still needed", why: `${i.type} · ${fmtDate(i.date)}. Add it to the incident once you have it.` });
    if (sv && (!sv.lastDate || dayDiff(sv.lastDate, todayStr()) > 8)) out.push({ sev: "warn", what: "Send this week's mileage", why: sv.lastDate ? `Last reading ${fmtDate(sv.lastDate)}` : "No reading yet" });

}
function openNotifs() {

  const remHtml = rem.length ? `<h3>Reminders</h3><div class="list">${rem.map(r => `<div class="li"><div class="main"><div class="t">${esc(r.what)}</div><div class="small muted">${esc(r.why || "")}</div></div><div class="end">${pill(r.sev === "bad" ? "bad" : "warn", r.sev === "bad" ? "Now" : "Soon")}</div></div>`).join("")}</div>` : "";

function afterCore() {
  if (!Object.values(S.coreReady).every(Boolean)) return;
  const T = todayStr();
  const months = monthsBetween(monthOf(trackStart()), monthOf(T));
  const live = new Set(months.slice(-12));
  const fleetAtStart = S.fleet;
  // Figures stay hidden until every month's records have arrived once, so nothing flashes with half the data
  const done = key => { if (S.fleet !== fleetAtStart) return; S.waiting.delete(key); if (!S.waiting.size && !S.recordsReady) { S.recordsReady = true; clearTimeout(S._readyTimer); } };
  for (const m of months) {
    if (S.loadedMonths.has(m)) continue;
    S.loadedMonths.add(m);
    monthBucket(m);
    for (const k of KINDS) {
      const key = m + "/" + k; S.waiting.add(key);
      const col = S.db.collection(`months/${m}/${k}`);
      if (live.has(m)) S.subs.push(col.onSnapshot(snap => { monthBucket(m)[k] = snapRows(snap); done(key); render(); }, e => { done(key); setSync("Data unavailable: " + e.code); render(); }));
      else col.get().then(snap => { monthBucket(m)[k] = snapRows(snap); done(key); render(); }).catch(() => { done(key); render(); });
    }
  }
  if (!S.waiting.size) S.recordsReady = true;
  else if (!S._readyTimer) S._readyTimer = setTimeout(() => { S._readyTimer = null; if (!S.recordsReady) { S.recordsReady = true; render(); } }, 15000);
  render();
}

async function refreshMonth(m, kind) {
  if (!S.loadedMonths.has(m)) { afterCore(); return; }
  try { const snap = await S.db.collection(`months/${m}/${kind}`).get(); monthBucket(m)[kind] = snapRows(snap); render(); } catch (e) {}
}

function setSync(t) { S.syncText = t; document.getElementById("sync").textContent = t; }
// Called from the main listeners: cached data first, then the server confirms it
function syncFrom(snap) {

  else setSync(navigator.onLine ? "Syncing…" : "Offline · showing saved data");
}
window.addEventListener("offline", () => { if (S.raw) setSync("Offline · showing saved data"); });
window.addEventListener("online", () => { if (S.raw) setSync("Syncing…"); });

async function save(fn, okMsg) {
  if (!S.canWrite) { toast("You have view-only access"); return false; }
  S._logged = false;
  const fail = e => {
    const c = e && e.code;
    if (c === "permission-denied") toast("Not saved: your role can't change this. Ask a manager.");
    else if (c === "resource-exhausted") toast("Not saved: the free daily limit is used up. Try again tomorrow.");
    else toast("Not saved, please try again (" + (c || "error") + ")");
  };
  const work = Promise.resolve().then(fn);
  // Offline, Firebase keeps the change on this phone and sends it later; don't leave the form hanging.
  const r = await Promise.race([work.then(() => "ok", e => e), new Promise(res => setTimeout(() => res("slow"), 6000))]);
  if (r === "ok") { if (okMsg) toast(okMsg); if (okMsg && !S._logged) logActivity("changed", "setup", okMsg); return true; }
  if (r === "slow") { toast("Saved on this phone. It will sync when you're back online."); work.catch(fail); return true; }
  fail(r); return false;
}

function recordId(ref) { const r = String(ref || "").toUpperCase().replace(/[^A-Z0-9]/g, ""); return r.length >= 6 ? r : null; }
async function writeRecord(kind, data, oldRec, quiet) {
  const m = monthOf(data.date || data.from);

  logActivity(oldRec ? "edited" : "added", kind, recSummary(kind, data), data.amount);

// Tell drivers and owners about new records
function recordEvents(kind, d) {
  const fid = S.fleet, amt = ksh(d.amount || 0), pl = d.carId ? carLabel(d.carId) : "";
  if (kind === "payments" && d.driverId) {
    postEvent(fid, "driver:" + d.driverId, "payment", `Payment of ${amt} received (${fmtShort(d.date)}). Thank you.`);

    if (d.chargeDriver && d.driverId) postEvent(fid, "driver:" + d.driverId, "charge", `${amt} added to your balance: ${d.category}${d.note ? " · " + d.note : ""}`);

function trendChart(tr) {
  if (!tr.length) return "";
  const W = Math.max(340, Math.min(640, (document.getElementById("view").clientWidth || 640) - 30)), H = 220, L = 46, R = 8, Tp = 12, B = 26;
  const max = Math.max(1, ...tr.map(x => Math.max(x.rev, x.cost)));
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= max) return m * p; return 10 * p; })();
  const y = v => Tp + (H - Tp - B) * (1 - v / nice);
  const gw = (W - L - R) / tr.length, bw = Math.min(26, gw / 3.2);
  const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => f * nice);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly collections and owner costs">`;
  for (const t of ticks) s += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${kshShort(t)}</text>`;
  tr.forEach((m, i) => {
    const cx = L + gw * i + gw / 2;
    const bar = (v, x, col, name) => { const top = y(v), h = Math.max(0, H - B - top); return h > 0 ? `<path d="M${x},${H - B} V${top + Math.min(4, h)} q0,-4 4,-4 h${bw - 8} q4,0 4,4 V${H - B} Z" fill="${col}" data-tip="${esc(fmtMonth(m.m))} · ${name}: ${esc(ksh(v))}"/>` : ""; };
    s += bar(m.rev, cx - bw - 1, "var(--series-1)", "Collected") + bar(m.cost, cx + 1, "var(--series-2)", "Owner costs");
    s += `<rect x="${cx - gw / 2}" y="${Tp}" width="${gw}" height="${H - Tp - B}" fill="transparent" data-tip="${esc(fmtMonth(m.m))} · Collected ${esc(ksh(m.rev))} · Costs ${esc(ksh(m.cost))} · Net ${esc(ksh(m.rev - m.cost))}"/>`;
    s += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${MONTHS_SHORT[Number(m.m.slice(5)) - 1]}</text>`;
  });
  s += `<line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="var(--muted)" stroke-width="1"/></svg>`;
  return `<div class="section"><div class="section-head"><h2>Monthly trend</h2><div class="legend"><span><i style="background:var(--series-1)"></i>Collected</span><span><i style="background:var(--series-2)"></i>Owner costs</span></div></div><div class="card">${s}</div></div>`;
}

function bindChart() {
  const tip = document.getElementById("tip");
  document.querySelectorAll("[data-tip]").forEach(el => {
    el.addEventListener("pointermove", e => { tip.textContent = el.getAttribute("data-tip"); tip.style.display = "block"; const x = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8); tip.style.left = x + "px"; tip.style.top = (e.clientY - 34) + "px"; });

  });
}

// Day-by-day account of what the driver owed and which days their money has covered.
function driverDays(c, d) {
  const T = c.T, TS = trackStart();
  const periods = S.assigns.filter(a => a.driverId === d.id).sort((a, b) => a.start.localeCompare(b.start)).map(a => {
    const car = carById(a.carId) || {};
    let st = a.start > TS ? a.start : TS;
    let en = a.end && a.end < T ? a.end : T;
    if (car.soldDate && car.soldDate < en) en = car.soldDate;
    const rate = Number(a.rate) || 0, dm = c.down[a.carId];
    const p = { a, from: st, to: en, rate, withCar: 0, rest: 0, offRoad: 0, worked: 0, absent: 0, toPay: 0, due: 0, days: [] };
    for (let day = st; day <= en; day = addDays(day, 1)) {
      p.withCar++;
      if (a.restDay !== "" && a.restDay != null && Number(a.restDay) === weekday(day)) { p.rest++; continue; }
      const dn = dm && dm.get(day);
      if (dn && dn.excused) { p.offRoad++; continue; }
      if (dn) p.absent++; else p.worked++;
      p.toPay++; p.due += rate; p.days.push({ date: day, rate });
    }
    return p;
  }).filter(p => p.withCar > 0);
  // Money in covers the opening balance and charges first, then the oldest unpaid day.
  const stl = d.settlement || {};
  let pool = d.payAll + d.credAll + (Number(stl.depositUsed) || 0) - (Number(stl.refund) || 0) - (Number(d.openingBalance) || 0) - d.chgAll;
  let woff = Number(stl.writeOff) || 0;
  const days = periods.flatMap(p => p.days);
  let paid = 0, written = 0, unpaid = 0, partial = 0, unpaidAmt = 0;
  for (const x of days) {
    if (pool >= x.rate - 0.5) { pool -= x.rate; paid++; continue; }
    if (pool > 0.5) { partial = pool; }
    let gap = x.rate - Math.max(pool, 0); pool = 0;
    if (woff >= gap - 0.5) { woff -= gap; written++; continue; }
    unpaid++; unpaidAmt += gap - Math.max(woff, 0); woff = 0;
  }
  return { periods, toPay: days.length, paid, written, unpaid, unpaidAmt, partial, extra: Math.max(pool, 0) };
}
function daysPaidCard(c, d) {
  const r = driverDays(c, d);
  if (!r.periods.length) return "";
  const sum = k => r.periods.reduce((t, p) => t + p[k], 0);
  const first = r.periods[0].from, last = r.periods[r.periods.length - 1].to;
  const head = r.unpaid ? `<b style="color:var(--bad)">${r.unpaid} day${r.unpaid === 1 ? "" : "s"} unpaid</b> <span class="small muted">(${ksh(r.unpaidAmt)})</span>`
    : r.written ? `<b>All days settled</b> <span class="small muted">${r.written} written off</span>`
    : `<b style="color:var(--good)">All days paid</b>${r.extra > 1 ? ` <span class="small muted">plus ${ksh(r.extra)} ahead</span>` : ""}`;
  return `<div class="card"><div class="section-head" style="margin:0 0 8px"><h3 style="margin:0">Days worked and paid</h3><span class="small muted">${fmtDate(first)} → ${fmtDate(last)}</span></div>
  <div class="detail-grid">
    <div><span>Days with a car</span><b>${sum("withCar")}</b></div>
    <div><span>Rest days</span><b>${sum("rest")}</b></div>

    <div><span>Days worked</span><b>${sum("worked")}</b>${sum("absent") ? `<div class="small muted">+ ${sum("absent")} absent (still charged)</div>` : ""}</div>
    <div><span>Days to pay for</span><b>${r.toPay}</b></div>
    <div><span>Days paid</span><b style="color:var(--good)">${r.paid}</b></div>
    ${r.written ? `<div><span>Days written off</span><b>${r.written}</b></div>` : ""}
    <div><span>Days unpaid</span><b style="color:${r.unpaid ? "var(--bad)" : "inherit"}">${r.unpaid}</b></div>
  </div>
  <div style="margin-top:10px">${head}</div>
  <p class="small muted" style="margin:4px 0 8px">Payments (and car costs the driver paid) first cover any opening balance and charges (fines, damage), then the oldest unpaid day.</p>
  <div class="table-wrap"><table><thead><tr><th>Car</th><th>Period</th><th class="r">Rate</th><th class="r">With car</th><th class="r">Rest</th><th class="r">Off road</th><th class="r">Worked</th><th class="r">Absent</th><th class="r">To pay</th><th class="r">Due</th></tr></thead><tbody>
  ${r.periods.map(p => `<tr><td>${plate(carLabel(p.a.carId))}</td><td>${fmtShort(p.from)} → ${fmtShort(p.to)}</td><td class="r">${ksh(p.rate)}</td><td class="r">${p.withCar}</td><td class="r">${p.rest}</td><td class="r">${p.offRoad}</td><td class="r">${p.worked}</td><td class="r">${p.absent}</td><td class="r">${p.toPay}</td><td class="r">${ksh(p.due)}</td></tr>`).join("")}
  </tbody></table></div></div>`;
}

function formSettle(id) {
  const d = (S.calc.drivers || []).find(x => x.id === id); if (!d) return;
  const st = d.settlement || {};
  // balance before any settlement
  const before = d.balance + (Number(st.depositUsed) || 0) + (Number(st.writeOff) || 0) - (Number(st.refund) || 0);
  const deposit = Number(d.deposit) || 0;
  const hist = S.assigns.filter(a => a.driverId === id);
  const lastEnd = hist.length && hist.every(a => a.end) ? hist.map(a => a.end).sort().pop() : todayStr();
  const depDefault = st.date ? st.depositUsed : Math.max(0, Math.min(deposit, before));
  const woDefault = st.date ? st.writeOff : Math.max(0, before - depDefault);
  const rfDefault = st.date ? st.refund : before < -1 ? Math.round(-before) : 0;
  openForm(`Settle ${d.name}`, [
    { id: "leftDate", label: "Left the fleet on", type: "date", value: st.leftDate || lastEnd, half: true },
    { id: "date", label: "Settled on", type: "date", value: st.date || todayStr(), half: true },
    { id: "depositUsed", label: "Deposit kept towards the balance (KSh)", type: "number", value: depDefault || "", half: true, hint: deposit ? `Deposit held: ${ksh(deposit)}` : "No deposit recorded" },
    { id: "writeOff", label: "Write off (KSh)", type: "number", value: woDefault || "", half: true, hint: "What they owe that you won't collect" },
    { id: "refund", label: "Refunded to the driver (KSh)", type: "number", value: rfDefault || "", half: true, hint: "Credit or deposit you paid back" },
    { id: "note", label: "Note", type: "textarea", value: st.note || "" }
  ], async v => {
    const n = k => Math.max(0, Number(v[k]) || 0);
    const set = { leftDate: v.leftDate || "", date: v.date || todayStr(), depositUsed: n("depositUsed"), writeOff: n("writeOff"), refund: n("refund"), note: String(v.note || "").slice(0, 300) };
    if (set.depositUsed > deposit + 0.5) return `They only left a deposit of ${ksh(deposit)}`;
    const after = before - set.depositUsed - set.writeOff + set.refund;
    if (Math.abs(after) > 1 && !confirm(`After this they'd still ${after > 0 ? "owe " + ksh(after) : "be " + ksh(-after) + " in credit"}. Save anyway?`)) return false;
    const ok = await save(() => S.db.collection("drivers").doc(id).update({ settlement: set, status: "left", updatedAt: new Date().toISOString() }), "Settlement saved");

}

function parseAnyDate(v) {
  if (v == null || v === "") return null;
  if (typeof v === "number") { const d = XLSX.SSF.parse_date_code(v); return d ? `${d.y}-${String(d.m).padStart(2, "0")}-${String(d.d).padStart(2, "0")}` : null; }
  if (v instanceof Date) return v.toISOString().slice(0, 10);
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
  m = s.match(/^(\d{1,2})[\/\.-](\d{1,2})[\/\.-](\d{4})/); if (m) return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
  const t = Date.parse(s); return isNaN(t) ? null : new Date(t).toISOString().slice(0, 10);
}

function matchDriver(row) {
  const T = row.date || todayStr();
  const hay = (row.party + " " + row.details + " " + row.account).toUpperCase();
  const acct = normPlate(row.account + " " + row.details);
  // 1. Plate in account number
  for (const c of S.cars) { const p = normPlate(c.plate); if (p.length >= 5 && acct.includes(p)) { const a = assignOn(c.id, T); if (a) return { driverId: a.driverId, how: "plate" }; } }
  // 2. Full phone number
  const ph = phoneKey(row.party) || phoneKey(row.details);
  if (ph) { const d = S.drivers.find(d => phoneKey(d.phone) === ph); if (d) return { driverId: d.id, how: "phone" }; }
  // 3. Name: all name parts found, or first + last
  let best = null;
  for (const d of S.drivers) {
    const parts = String(d.name || "").toUpperCase().split(/\s+/).filter(x => x.length > 1);
    const hits = parts.filter(p => new RegExp("\\b" + p.replace(/[^A-Z]/g, "") + "\\b").test(hay)).length;
    if (parts.length && hits >= Math.min(2, parts.length) && (!best || hits > best.hits)) best = { driverId: d.id, how: "name", hits };
  }
  return best || { driverId: "", how: "" };
}

async function handleImportFile(file) {
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array", cellDates: false });
    let rows = [];
    for (const name of wb.SheetNames) rows = rows.concat(XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: "" }));
    const hi = rows.findIndex(r => r.some(c => /receipt/i.test(String(c))) && r.some(c => /paid\s*in|amount|credit/i.test(String(c))));
    if (hi < 0) { toast("Couldn't find the Receipt No. and Paid In columns in this file"); return; }
    const H = rows[hi].map(c => String(c).trim().toLowerCase());
    const col = re => H.findIndex(h => re.test(h));
    const ci = { rec: col(/receipt/), time: col(/completion|date|time/), det: col(/details|description/), paid: col(/paid\s*in|credit|amount/), party: col(/other party|party|sender|name/), acct: col(/a\/c|account|bill ref/), status: col(/status/) };
    const known = new Set(all("payments").map(p => p.id));
    const out = [];
    for (const r of rows.slice(hi + 1)) {
      const rec = String(r[ci.rec] ?? "").trim(); const amt = num(r[ci.paid]);
      if (!rec || amt <= 0) continue;
      if (ci.status >= 0 && r[ci.status] && !/complet/i.test(String(r[ci.status]))) continue;
      const row = { ref: rec, id: recordId(rec), date: parseAnyDate(r[ci.time]), amount: amt, details: ci.det >= 0 ? String(r[ci.det]) : "", party: ci.party >= 0 ? String(r[ci.party]) : "", account: ci.acct >= 0 ? String(r[ci.acct]) : "" };
      const m = matchDriver(row);
      row.driverId = m.driverId; row.how = m.how; row.dup = row.id && known.has(row.id);
      row.include = !row.dup && !!row.driverId && !!row.date && row.date >= trackStart();
      out.push(row);
    }
    IMP = { rows: out, file: file.name };
    render();
  } catch (e) { toast("Couldn't read that file. Try saving it as .xlsx or .csv"); }
}

  const opts = id => `<option value="">Not a driver payment</option>` + S.drivers.map(d => `<option value="${d.id}" ${d.id === id ? "selected" : ""}>${esc(d.name)}</option>`).join("");

async function runImport() {
  const sel = IMP.rows.filter(x => x.include && x.driverId);
  let n = 0, total = 0;
  const btn = document.querySelector('[data-action="imp-go"]'); if (btn) { btn.disabled = true; btn.textContent = "Importing…"; }
  const touched = new Set();
  for (const x of sel) {
    const a = driverAssignOn(x.driverId, x.date);
    const data = { date: x.date, driverId: x.driverId, carId: a ? a.carId : "", amount: x.amount, method: /paybill/i.test(IMP.file) ? "M-Pesa Paybill" : "M-Pesa Till", ref: x.ref, note: "Imported" + (x.party ? " · " + x.party.slice(0, 60) : ""), updatedAt: new Date().toISOString() };
    const col = S.db.collection(`months/${monthOf(x.date)}/payments`);
    const ok = await save(() => (x.id ? col.doc(x.id) : col.doc()).set(data));
    if (!ok) break;
    n++; total += Number(x.amount) || 0; touched.add(monthOf(x.date));
  }
  if (n) logActivity("imported", "payments", `${n} M-Pesa payment${n === 1 ? "" : "s"} (${ksh(total)}) from ${String(IMP.file || "statement").slice(0, 60)}`, total);
  if (n) postEvent(S.fleet, "owners", "import", `${n} M-Pesa payment${n === 1 ? "" : "s"} recorded (${ksh(total)})`);
  touched.forEach(m => refreshMonth(m, "payments"));
  toast(`Imported ${n} payment${n === 1 ? "" : "s"}`);
  IMP = null; S.view = "collect"; location.hash = "collect"; render();
}

/* ============ Statement ============ */
function statementText(id) {
  const d = S.calc.drivers.find(x => x.id === id); if (!d) return "";
  const T = todayStr(), from = (() => { const f = addDays(T, -13); return f < trackStart() ? trackStart() : f; })();
  const pays = all("payments").filter(p => p.driverId === id && p.date >= from).sort((a, b) => a.date.localeCompare(b.date));
  const chg = all("expenses").filter(x => x.chargeDriver && x.driverId === id && x.date >= from);
  const lines = [];
  lines.push(`${S.settings.name || "Fleet"}: statement for ${d.name}`);
  if (d.assign) lines.push(`Car ${carLabel(d.assign.carId)} · ${ksh(d.rate)} per day`);
  lines.push(`As at ${fmtDate(T)}`);
  lines.push("");
  lines.push(`Payments since ${fmtShort(from)}:`);
  if (!pays.length) lines.push("  none");
  pays.forEach(p => lines.push(`  ${fmtShort(p.date)}  ${ksh(p.amount)}${p.ref ? "  (" + p.ref + ")" : ""}`));
  if (chg.length) { lines.push(""); lines.push("Charges:"); chg.forEach(x => lines.push(`  ${fmtShort(x.date)}  ${x.category}  ${ksh(x.amount)}${x.note ? " · " + x.note : ""}`)); }
  const cr = all("expenses").filter(x => x.driverPaid && !x.chargeDriver && x.driverId === id && x.date >= from);
  if (cr.length) { lines.push(""); lines.push("Car costs you paid (deducted):"); cr.forEach(x => lines.push(`  ${fmtShort(x.date)}  ${x.category}  ${ksh(x.amount)}${x.note ? " · " + x.note : ""}`)); }
  if (d.settlement && d.settlement.date) { const st = d.settlement; lines.push(""); lines.push(`Settled ${fmtShort(st.date)}:${Number(st.depositUsed) ? " deposit used " + ksh(st.depositUsed) + ";" : ""}${Number(st.writeOff) ? " written off " + ksh(st.writeOff) + ";" : ""}${Number(st.refund) ? " refunded " + ksh(st.refund) + ";" : ""}`.replace(/;$/, "")); }
  lines.push("");
  lines.push(d.balance > 1 ? `Balance owed: ${ksh(d.balance)} (about ${d.daysBehind.toFixed(1)} days)` : d.balance < -1 ? `You are ${ksh(-d.balance)} in credit. Thank you.` : "You are fully paid up. Thank you.");
  return lines.join("\n");
}

function fieldHtml(f) {
  const id = "f-" + f.id, v = f.value ?? "";
  if (f.type === "check") return `<label class="ck" for="${id}"><input type="checkbox" id="${id}" ${v ? "checked" : ""}> ${esc(f.label)}</label>${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ""}`;
  let input;
  if (f.type === "select") input = `<select id="${id}" ${f.required ? "required" : ""}>${f.options.map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov)}" ${String(ov) === String(v) ? "selected" : ""}>${esc(ol)}</option>`; }).join("")}</select>`;
  else if (f.type === "textarea") input = `<textarea id="${id}" rows="2">${esc(v)}</textarea>`;
  else input = `<input id="${id}" type="${f.type || "text"}" value="${esc(v)}" ${f.required ? "required" : ""} ${f.min ? `min="${f.min}"` : ""} ${f.type === "number" ? 'inputmode="decimal" step="any"' : ""} ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ""}>`;
  return `<label class="fl" for="${id}">${esc(f.label)}${input}${f.hint ? `<span class="hint">${esc(f.hint)}</span>` : ""}</label>`;
