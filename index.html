    ${[["new-payment", "Payment received", "Daily fee from a driver"], ["new-expense", "Expense", "Service, repairs, insurance, fines"], ["new-downtime", "Off-road days", "Garage, accident, no driver"], ["new-odo", "Mileage reading", "Weekly odometer"], ["new-car", "Car", "Add a car to the fleet"], ["new-driver", "Driver", "Add a new driver"], ["new-assign", "Assign driver", "Hand a car to a driver"]].map(([a, t, d]) => `<div class="li" data-action="${a}" style="cursor:pointer"><div class="main"><div class="t">${t}</div><div class="small muted">${d}</div></div><div class="end muted">›</div></div>`).join("")}
  </div>`);
}

/* ============ Activity log (who did what) ============ */
const ACT_LABEL = { payments: "payment", expenses: "expense", downtime: "off-road record", odo: "mileage reading", setup: "" };
function recSummary(kind, r) {
  if (!r) return "";
  if (kind === "payments") return `${ksh(r.amount)} from ${driverName(r.driverId)}`;
  if (kind === "expenses") return `${r.category || "Expense"} ${ksh(r.amount)} · ${carLabel(r.carId)}`;
  if (kind === "downtime") return `${r.reason || "Off road"} · ${carLabel(r.carId)}`;
  if (kind === "odo") return `${Number(r.km || 0).toLocaleString()} km · ${carLabel(r.carId)}`;
  return "";
}
function logActivity(action, kind, summary, amount) {
  S._logged = true;
  if (!S.db || !S.uid) return;
  const T = todayStr();
  S.db.collection(`months/${monthOf(T)}/activity`).doc().set({
    uid: S.uid, at: new Date().toISOString(), date: T, action, kind,
    summary: String(summary || "").slice(0, 160), amount: Number(amount) || 0
  }).catch(() => {});
}
async function logVisit() {
  if (!S.db || !S.uid || !S.canWrite) return;
  const T = todayStr(), now = new Date().toISOString();
  const ref = S.db.collection(`months/${monthOf(T)}/visits`).doc(`${S.uid}_${T}`);
  try {
    const snap = await ref.get();
    const d = snap.exists ? snap.data() : null;
    await ref.set({ uid: S.uid, date: T, first: d && d.first ? d.first : now, last: now, opens: (d ? Number(d.opens) || 0 : 0) + 1 });
  } catch (e) {}
}
function ensureActivity() {
  if (S.actLoaded || !S.db) return;
  S.actLoaded = true;
  const cur = monthOf(todayStr());
  for (const m of [addMonths(cur, -1), cur]) {
    S.subs.push(S.db.collection(`months/${m}/activity`).onSnapshot(sn => { S.act[m] = snapRows(sn); if (S.view === "insights") render(); }, () => {}));
    S.subs.push(S.db.collection(`months/${m}/visits`).onSnapshot(sn => { S.vis[m] = snapRows(sn); if (S.view === "insights") render(); }, () => {}));
  }
}
const who = id => `<span data-uid="${esc(id)}">${id && id === S.uid ? "You" : "Someone"}</span>`;
async function fillNames() {
  const els = [...document.querySelectorAll("[data-uid]")];
  els.forEach(e => { const id = e.dataset.uid; if (id && id === S.uid) e.textContent = "You"; else if (S.names[id]) e.textContent = S.names[id]; });
}
function timeAgo(iso) {
  if (!iso) return "never";
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (!isFinite(s)) return "—";
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + " min ago";
  if (s < 86400) return Math.floor(s / 3600) + " h ago";
  const d = Math.floor(s / 86400);
  return d === 1 ? "yesterday" : d + " days ago";
}

/* ============ Insights view ============ */
const hbars = (rows, fmt) => {
  if (!rows.length) return `<div class="small muted">Nothing recorded for this period.</div>`;
  const max = Math.max(1, ...rows.map(r => Math.abs(r.v)));
  return `<div class="hbars">${rows.map(r => `<div class="hb"${r.link ? ` data-action="open" data-v="${r.link}" style="cursor:pointer"` : ""}>
    <div class="hb-l">${r.label}</div>
    <div class="hb-t"><i style="width:${Math.abs(r.v) / max * 100}%;background:${r.color || "var(--series-1)"}"></i></div>
    <div class="hb-v num">${fmt(r.v)}${r.sub ? `<div class="small muted" style="font-weight:400">${r.sub}</div>` : ""}</div>
  </div>`).join("")}</div>`;
};

function viewInsights(c) {
  if (!S.cars.length || !S.drivers.length || !S.assigns.length) return onboarding();
  const tab = S.insTab || "business";
  const seg = `<div class="seg" role="group" aria-label="Insight type">${[["business", "Business"], ["team", "Team activity"]].map(([k, l]) => `<button data-action="ins-tab" data-v="${k}" class="${tab === k ? "on" : ""}">${l}</button>`).join("")}</div>`;
  return `<div class="section"><div class="section-head"><h2>Insights</h2>${seg}</div></div>${tab === "team" ? insTeam(c) : insBusiness(c)}`;
}

function insBusiness(c) {
  const T = c.T, TS = trackStart(), from = c.P.from, to = c.P.to;
  const inP = d => d >= from && d <= to && d >= TS;
  const t = c.tot;
  const live = c.cars.filter(x => !(x.soldDate && x.soldDate <= T));
  const collRate = t.exp + t.charges ? t.rev / (t.exp + t.charges) : NaN;
  const costRatio = t.rev ? t.cost / t.rev : NaN;
  const netPerCarDay = t.denom ? t.net / t.denom : NaN;
  const rates = S.assigns.filter(a => !a.end || a.end >= from).map(a => Number(a.rate) || 0).filter(Boolean);
  const avgRate = rates.length ? rates.reduce((s, x) => s + x, 0) / rates.length : 0;

  // Off-road days by reason, with income lost (excused days only; unexcused days are still owed by the driver)
  const byReason = {}; let lostDown = 0;
  for (const car of S.cars) {
    const dm = c.down[car.id]; if (!dm) continue;
    for (const [d, dn] of dm) {
      if (!inP(d)) continue;
      const a = assignOn(car.id, d);
      if (a && a.restDay !== "" && a.restDay != null && Number(a.restDay) === weekday(d)) continue;
      const lost = dn.excused ? (a ? Number(a.rate) || 0 : avgRate) : 0;
      const k = dn.reason || "Other";
      const r = byReason[k] || (byReason[k] = { days: 0, lost: 0 });
      r.days++; r.lost += lost; lostDown += lost;
    }
  }
  const idleDays = c.cars.reduce((s, x) => s + (x.idleP || 0), 0), lostIdle = idleDays * avgRate;
  const reasons = Object.entries(byReason).sort((a, b) => b[1].lost - a[1].lost || b[1].days - a[1].days);
  if (idleDays) reasons.push(["No driver (not recorded as off-road)", { days: idleDays, lost: lostIdle }]);

  // Owner costs by category
  const cats = {};
  for (const x of all("expenses")) { if (!inP(x.date)) continue; const k = x.category || "Other"; cats[k] = (cats[k] || 0) + (Number(x.amount) || 0); }
  const catRows = Object.entries(cats).sort((a, b) => b[1] - a[1]);

  // Arrears ageing
  const owing = c.drivers.filter(d => d.balance > 1);
  const buckets = [
    ["1 to 3 days behind", d => d.rate && d.daysBehind <= 3, "var(--warn)"],
    ["4 to 7 days behind", d => d.rate && d.daysBehind > 3 && d.daysBehind <= 7, "var(--series-2)"],
    ["8 to 14 days behind", d => d.rate && d.daysBehind > 7 && d.daysBehind <= 14, "var(--bad)"],
    ["15+ days behind", d => d.rate && d.daysBehind > 14, "var(--bad)"],
    ["No longer driving", d => !d.rate, "var(--muted)"]
  ].map(([label, f, color]) => { const ds = owing.filter(f); return { label: esc(label), v: ds.reduce((s, d) => s + d.balance, 0), sub: ds.length ? `${ds.length} driver${ds.length === 1 ? "" : "s"}` : "", color }; }).filter(r => r.v > 0);

  // Monthly chart: last 12 months
  const curM = monthOf(T);
  const months = monthsBetween(addMonths(curM, -11), curM).filter(m => m >= monthOf(TS)).map(m => ({ m, ...(c.fleetM[m] || { rev: 0, cost: 0, exp: 0 }) }));

  // Cars ranked by net profit per working day
  const carRows = live.map(x => ({ x, perDay: x.denomP ? x.net / x.denomP : 0 })).sort((a, b) => b.perDay - a.perDay);

  // Drivers' payment reliability
  const drv = c.drivers.filter(d => d.assign || d.payP > 0 || d.balance > 1).map(d => {
    const pays = all("payments").filter(p => p.driverId === d.id && inP(p.date));
    return { d, n: pays.length, avg: pays.length ? d.payP / pays.length : 0, since: d.lastPay ? dayDiff(d.lastPay, T) : null };
  }).sort((a, b) => (isFinite(a.d.collRateP) ? a.d.collRateP : 9) - (isFinite(b.d.collRateP) ? b.d.collRateP : 9));

  // Plain-language findings
  const F = [];
  if (isFinite(collRate)) F.push(`You collected <b>${pct(collRate)}</b> of what drivers owed for this period (${ksh(t.rev)} of ${ksh(t.exp + t.charges)}).${collRate < 0.9 ? " Every 10% shortfall is about " + ksh((t.exp + t.charges) * 0.1) + "." : ""}`);
  if (carRows.length > 1) {
    const best = carRows[0], worst = carRows[carRows.length - 1];
    F.push(`Best earner: <b>${esc(best.x.plate)}</b> at ${ksh(best.perDay)} net per working day. Weakest: <b>${esc(worst.x.plate)}</b> at ${ksh(worst.perDay)}${worst.x.costP > worst.x.revP ? ", where costs are bigger than collections" : ""}.`);
  }
  if (catRows.length && t.cost) F.push(`<b>${esc(catRows[0][0])}</b> is your biggest owner cost at ${pct(catRows[0][1] / t.cost)} of spending (${ksh(catRows[0][1])}).`);
  if (lostDown + lostIdle > 0) F.push(`Cars off the road or without a driver cost about <b>${ksh(lostDown + lostIdle)}</b> in lost income${reasons.length ? `, mostly from “${esc(reasons[0][0])}”` : ""}.`);
  const late = owing.filter(d => d.rate && d.daysBehind > 7);
  if (late.length) F.push(`<b>${late.length} driver${late.length === 1 ? " is" : "s are"}</b> more than a week behind, owing ${ksh(late.reduce((s, d) => s + d.balance, 0))} between them.`);
  else if (owing.length) F.push(`No driver is more than a week behind. Total owed is ${ksh(t.arrears)}.`);
  const mPrev = c.fleetM[addMonths(curM, -1)], mPrev2 = c.fleetM[addMonths(curM, -2)];
  if (mPrev && mPrev2 && mPrev2.rev - mPrev2.cost) {
    const n1 = mPrev.rev - mPrev.cost, n2 = mPrev2.rev - mPrev2.cost, ch = (n1 - n2) / Math.abs(n2);
    F.push(`Net profit for ${fmtMonth(addMonths(curM, -1))} was ${ksh(n1)}, ${ch >= 0 ? "up" : "down"} ${pct(Math.abs(ch))} on ${fmtMonth(addMonths(curM, -2))}.`);
  }

  return `
  <div class="section">
    <div class="section-head"><h2>Key findings</h2>${periodSeg()}</div>
    <div class="card">${F.length ? `<ul class="findings">${F.map(x => `<li>${x}</li>`).join("")}</ul>` : `<div class="small muted">Record a few weeks of payments and expenses to see findings here.</div>`}</div>
    <div class="grid kpis">
      <div class="card kpi"><div class="label">Collection rate</div><div class="value num" style="color:${collRate < 0.9 ? "var(--bad)" : "var(--ink)"}">${pct(collRate)}</div><div class="sub">of expected payments</div></div>
      <div class="card kpi"><div class="label">Net per car-day</div><div class="value num">${isFinite(netPerCarDay) ? ksh(netPerCarDay) : "—"}</div><div class="sub">after owner costs</div></div>
      <div class="card kpi"><div class="label">Costs vs collected</div><div class="value num">${pct(costRatio)}</div><div class="sub">of every shilling collected</div></div>
      <div class="card kpi"><div class="label">Lost to downtime</div><div class="value num" style="color:${lostDown + lostIdle > 0 ? "var(--bad)" : "var(--ink)"}">${ksh(lostDown + lostIdle)}</div><div class="sub">estimated · ${esc(c.P.label)}</div></div>
    </div>
  </div>
  ${monthChart(months)}
  <div class="section"><div class="section-head"><h2>Cars ranked</h2><span class="small muted">Net profit per working day</span></div>
    <div class="card">${hbars(carRows.map(({ x, perDay }) => ({ label: plate(x.plate), v: perDay, color: perDay < 0 ? "var(--bad)" : "var(--good)", sub: `${pct(x.util)} on road`, link: "car:" + x.id })), v => ksh(v))}</div></div>
  <div class="section"><div class="section-head"><h2>Where owner money goes</h2><span class="small muted">${ksh(t.cost)} total</span></div>
    <div class="card">${hbars(catRows.map(([k, v]) => ({ label: esc(k), v, color: "var(--series-2)", sub: t.cost ? pct(v / t.cost) : "" })), v => ksh(v))}</div></div>
  <div class="section"><div class="section-head"><h2>Off-road days</h2><span class="small muted">Income lost by reason</span></div>
    <div class="card">${hbars(reasons.map(([k, r]) => ({ label: esc(k), v: r.lost, color: "var(--bad)", sub: `${r.days} day${r.days === 1 ? "" : "s"}` })), v => ksh(v))}
    <div class="small muted" style="margin-top:8px">Lost income counts working days when the driver wasn’t charged. “Driver absent” days are still owed, so they show days but no loss.</div></div></div>
  <div class="section"><div class="section-head"><h2>Arrears by age</h2><span class="small muted">${ksh(t.arrears)} owed now</span></div>
    <div class="card">${buckets.length ? hbars(buckets, v => ksh(v)) : `<div class="small muted">No driver owes anything.</div>`}</div></div>
  <div class="section"><div class="section-head"><h2>Driver reliability</h2><span class="small muted">${esc(c.P.label)}</span></div>
    <div class="table-wrap"><table><thead><tr><th>Driver</th><th class="r">Paid vs due</th><th class="r">Payments</th><th class="r">Avg payment</th><th class="r">Last paid</th><th class="r">Balance</th></tr></thead><tbody>
    ${drv.map(({ d, n, avg, since }) => `<tr class="click" data-action="open" data-v="driver:${d.id}"><td>${esc(d.name)}<div>${pill(d.status, d.statusLabel)}</div></td>
      <td class="r" style="color:${d.collRateP < 0.9 ? "var(--bad)" : "inherit"}">${pct(d.collRateP)}</td><td class="r">${n}</td><td class="r">${n ? ksh(avg) : "—"}</td>
      <td class="r">${since == null ? "never" : since === 0 ? "today" : since + " d ago"}</td>
      <td class="r"><b style="color:${d.balance > 1 ? "var(--bad)" : "var(--good)"}">${d.balance > 1 ? ksh(d.balance) : d.balance < -1 ? ksh(-d.balance) + " cr" : "KSh 0"}</b></td></tr>`).join("") || `<tr><td colspan="6" class="muted">No drivers yet.</td></tr>`}
    </tbody></table></div></div>`;
}

function monthChart(tr) {
  if (!tr.length) return "";
  const W = Math.max(340, Math.min(760, (document.getElementById("view").clientWidth || 640) - 30)), H = 230, L = 46, R = 8, Tp = 12, B = 26;
  const max = Math.max(1, ...tr.map(x => Math.max(x.rev, x.cost, x.exp)));
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= max) return m * p; return 10 * p; })();
  const y = v => Tp + (H - Tp - B) * (1 - Math.max(0, v) / nice);
  const gw = (W - L - R) / tr.length, bw = Math.max(4, Math.min(22, gw / 3.2));
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Expected, collected and owner costs by month">`;
  for (const f of [0, 0.25, 0.5, 0.75, 1]) { const v = f * nice; s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${kshShort(v)}</text>`; }
  tr.forEach((m, i) => {
    const cx = L + gw * i + gw / 2;
    const bar = (v, x, col) => { const top = y(v), h = Math.max(0, H - B - top); return h > 0 ? `<rect x="${x}" y="${top}" width="${bw}" height="${h}" rx="2" fill="${col}"/>` : ""; };
    s += bar(m.rev, cx - bw - 1, "var(--series-1)") + bar(m.cost, cx + 1, "var(--series-2)");
    if (m.exp > 0) s += `<line x1="${cx - bw - 4}" x2="${cx + 3}" y1="${y(m.exp)}" y2="${y(m.exp)}" stroke="var(--ink)" stroke-width="2" stroke-dasharray="3 2"/>`;
    s += `<rect x="${cx - gw / 2}" y="${Tp}" width="${gw}" height="${H - Tp - B}" fill="transparent" data-tip="${esc(fmtMonth(m.m))} · Expected ${esc(ksh(m.exp))} · Collected ${esc(ksh(m.rev))} (${esc(m.exp ? pct(m.rev / m.exp) : "—")}) · Costs ${esc(ksh(m.cost))} · Net ${esc(ksh(m.rev - m.cost))}"/>`;
    if (tr.length <= 7 || i % 2 === tr.length % 2 || i === tr.length - 1) s += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${MONTHS_SHORT[Number(m.m.slice(5)) - 1]}</text>`;
  });
  s += `<line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="var(--muted)" stroke-width="1"/></svg>`;
  return `<div class="section"><div class="section-head"><h2>12-month picture</h2><div class="legend"><span><i style="background:var(--series-1)"></i>Collected</span><span><i style="background:var(--series-2)"></i>Costs</span><span><i style="background:var(--ink);height:2px;vertical-align:3px"></i>Expected</span></div></div><div class="card">${s}<div class="small muted">Tap a month for the details.</div></div></div>`;
}

function insTeam(c) {
  const T = c.T, cur = monthOf(T);
  const acts = Object.values(S.act || {}).flat().filter(a => a && a.uid).sort((a, b) => (b.at || "").localeCompare(a.at || ""));
  const vis = Object.values(S.vis || {}).flat().filter(v => v && v.uid);
  const people = {};
  const P = id => people[id] || (people[id] = { id, entries: 0, opens: 0, days: new Set(), last: "", kinds: {} });
  for (const a of acts) { const p = P(a.uid); if ((a.at || "") > p.last) p.last = a.at; if ((a.date || "").startsWith(cur)) { p.entries++; p.kinds[a.kind] = (p.kinds[a.kind] || 0) + 1; } }
  for (const v of vis) { const p = P(v.uid); if ((v.last || "") > p.last) p.last = v.last; if ((v.date || "").startsWith(cur)) { p.opens += Number(v.opens) || 0; p.days.add(v.date); } }
  const ppl = Object.values(people).sort((a, b) => b.entries - a.entries || b.last.localeCompare(a.last));
  const monthActs = acts.filter(a => (a.date || "").startsWith(cur));

  // Entries per day, last 30 days
  const days = []; for (let i = 29; i >= 0; i--) days.push(addDays(T, -i));
  const perDay = days.map(d => acts.filter(a => a.date === d).length), maxDay = Math.max(1, ...perDay);

  // Data freshness, from the records themselves
  const latest = k => all(k).reduce((m, x) => { const d = x.date || x.from || ""; return d > m ? d : m; }, "");
  const lastImport = acts.find(a => a.action === "imported");
  const fresh = [
    ["Last payment recorded", latest("payments"), 2],
    ["Last expense recorded", latest("expenses"), 14],
    ["Last mileage reading", latest("odo"), 8],
    ["Last off-road record", latest("downtime"), null]
  ].map(([label, d, warn]) => { const age = d ? dayDiff(d, T) : null; return `<div class="li"><div class="main"><div class="t">${label}</div><div class="small muted">${d ? fmtDate(d) : "Nothing yet"}</div></div><div class="end">${age == null ? pill("neutral", "None") : warn != null && age > warn ? pill("warn", age + " days ago") : pill("good", age === 0 ? "Today" : age + " day" + (age === 1 ? "" : "s") + " ago")}</div></div>`; }).join("")
    + `<div class="li"><div class="main"><div class="t">Last M-Pesa import</div><div class="small muted">${lastImport ? esc(lastImport.summary) : "None since activity tracking began"}</div></div><div class="end">${lastImport ? pill("neutral", timeAgo(lastImport.at)) : pill("neutral", "—")}</div></div>`;

  const kindTxt = k => Object.entries(k).map(([kind, n]) => `${n} ${kind === "setup" ? "setup change" : ACT_LABEL[kind] || kind}${n === 1 ? "" : "s"}`).join(", ");
  const noId = !S.uid ? `<div class="banner">Your account can’t be identified on this page, so your own visits and entries aren’t being logged.</div>` : "";

  return `${noId}
  <div class="section">
    <div class="grid kpis">
      <div class="card kpi"><div class="label">Entries this month</div><div class="value num">${monthActs.length}</div><div class="sub">payments, expenses, mileage and more</div></div>
      <div class="card kpi"><div class="label">Active family members</div><div class="value num">${ppl.filter(p => p.entries || p.opens).length}</div><div class="sub">opened or edited this month</div></div>
      <div class="card kpi"><div class="label">Last change</div><div class="value" style="font-size:20px">${acts[0] ? timeAgo(acts[0].at) : "—"}</div><div class="sub">${acts[0] ? who(acts[0].uid) : "No entries logged yet"}</div></div>
    </div>
  </div>
  <div class="section"><div class="section-head"><h2>Who’s keeping the books</h2><span class="small muted">${fmtMonth(cur)}</span></div>
    ${ppl.length ? `<div class="list">${ppl.map(p => `<div class="li"><div class="main"><div class="t">${who(p.id)}</div><div class="small muted">${p.entries ? kindTxt(p.kinds) : "No entries this month"}</div></div>
      <div class="end"><b class="num">${p.entries} entr${p.entries === 1 ? "y" : "ies"}</b><span class="small muted">${p.days.size} day${p.days.size === 1 ? "" : "s"} active · seen ${timeAgo(p.last)}</span></div></div>`).join("")}</div>`
      : `<div class="card empty">Nobody has been logged yet. Visits and entries are tracked from now on.</div>`}
  </div>
  <div class="section"><div class="section-head"><h2>Entries per day</h2><span class="small muted">Last 30 days</span></div>
    <div class="card"><div class="cols">${perDay.map((n, i) => `<i class="${n ? "" : "z"}" style="height:${n ? Math.max(6, n / maxDay * 100) : 3}%" data-tip="${esc(fmtDate(days[i]))} · ${n} entr${n === 1 ? "y" : "ies"}"></i>`).join("")}</div>
    <div class="small muted" style="display:flex;justify-content:space-between;margin-top:4px"><span>${fmtShort(days[0])}</span><span>Today</span></div></div></div>
  <div class="section"><div class="section-head"><h2>Is the data up to date?</h2></div><div class="list">${fresh}</div></div>
  <div class="section"><div class="section-head"><h2>Recent activity</h2><span class="small muted">Latest 25</span></div>

function saveSummary(c) {
  if (!S.fleet || !S.canManage) return;
  const m = monthOf(c.T), fm = c.fleetM[m] || { rev: 0, cost: 0, exp: 0 };
  const sum = { month: m, collected: Math.round(fm.rev), expected: Math.round(fm.exp), costs: Math.round(fm.cost), net: Math.round(fm.rev - fm.cost), arrears: Math.round(c.tot.arrears), cars: c.cars.filter(x => !x.soldDate || x.soldDate > c.T).length, alerts: c.alerts.filter(a => a.sev === "bad").length };
  const key = JSON.stringify(sum);
  if (key === S._sumKey) return;
  const prev = S.fleetMeta && S.fleetMeta.summary ? JSON.stringify(S.fleetMeta.summary) : null;
  S._sumKey = key;
  if (key === prev) return;
  clearTimeout(saveSummary._t);
  const fid = S.fleet;
  saveSummary._t = setTimeout(() => { if (S.fleet === fid) S.raw.doc(fleetBase(fid)).update({ summary: sum, summaryAt: new Date().toISOString() }).catch(() => {}); }, 1500);
}

// Each driver's statement is copied to statements/<driverId>, the only thing a driver can read.
function saveStatements(c) {
  if (!S.fleet || !S.canWrite) return;
  if (saveStatements._t) return;
  const fid = S.fleet;
  saveStatements._t = setTimeout(() => {
    saveStatements._t = null;
    if (S.fleet !== fid || !S.calc) return;
    S._stmt = S._stmt || {};
    for (const d of S.calc.drivers) {
      const body = { name: d.name || "", balance: Math.round(Number(d.balance) || 0), daysBehind: Math.round((Number(d.daysBehind) || 0) * 10) / 10, rate: Number(d.rate) || 0, car: d.assign ? carLabel(d.assign.carId) : "", text: statementText(d.id) };
      const key = JSON.stringify(body);
      if (S._stmt[fid + "/" + d.id] === key) continue;
      S._stmt[fid + "/" + d.id] = key;
      S.db.doc(`statements/${d.id}`).set({ ...body, updatedAt: new Date().toISOString() }).catch(() => { S._stmt[fid + "/" + d.id] = null; });
    }
  }, 2500);
}

function randCode() { const a = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789"; return [...crypto.getRandomValues(new Uint8Array(24))].map(x => a[x % a.length]).join(""); }
async function inviteFlow({ role, fleetId = "", driverId = "", label, to = "them", phone = "" }) {
  const code = randCode();
  const data = { orgId: S.org, fleetId, role, label: String(label || "").slice(0, 120), createdBy: S.uid, createdAt: S.raw.TS, expiresAt: S.raw.daysFromNow(14), usedBy: null };

  try { await S.raw.doc(`invites/${code}`).set(data); }

async function createOrg() {

async function showJoin(code) {
  code = String(code || "").replace(/^.*[?&]join=/, "").replace(/[^A-Za-z0-9]/g, "");
  if (code.length < 20) { toast("That code doesn't look right"); return; }
  S.mode = "join"; S.join = { code, state: "loading" }; closeSheet(); render();
  try {
    const s = await S.raw.doc(`invites/${code}`).get();
    if (!s.exists) S.join.state = "missing";
    else {
      const d = s.data(); S.join.inv = d;
      if (d.usedBy === S.uid) S.join.state = "mine";
      else if (d.usedBy) S.join.state = "used";
      else if (Date.parse(d.expiresAt) < Date.now()) S.join.state = "expired";
      else S.join.state = "ready";
    }
  } catch (e) { S.join.state = "missing"; }
  if (S.join.state === "mine") return finishJoin();
  render();
}
function finishJoin() { history.replaceState(null, "", location.pathname + location.hash); S.join = null; findHome(); }
function viewJoin() {
  const j = S.join || {};
  if (j.state === "loading") return `<div class="card empty">Checking your invite…</div>`;
  const back = `<div class="row-actions" style="margin-top:10px"><button class="btn" data-action="join-cancel">Continue without joining</button></div>`;
  if (j.state === "missing") return `<div class="card auth"><h2>Invite not found</h2><p>The link may be incomplete. Ask whoever sent it for a new one.</p>${back}</div>`;
  if (j.state === "used") return `<div class="card auth"><h2>This invite was already used</h2><p>Each link works once. Ask for a new one.</p>${back}</div>`;
  if (j.state === "expired") return `<div class="card auth"><h2>This invite has expired</h2><p>Links last 14 days. Ask for a new one.</p>${back}</div>`;
  const inv = j.inv;
  return `<div class="card auth"><h2>You're invited</h2><p>Join <b>${esc(inv.label || "a fleet")}</b> as <b>${esc(ROLE_LABEL[inv.role] || inv.role)}</b>.</p>
    <label class="fl" for="join-name">Your name (shown to the team)<input id="join-name" value="${esc(S.me.name || "")}" maxlength="80"></label>
    <div class="row-actions" style="margin-top:10px"><button class="btn primary" data-action="accept-invite">Join</button><button class="btn" data-action="join-cancel">Not now</button></div>
    <p class="small muted">Signed in as ${esc(S.me.email || "you")}. If that's the wrong account, sign out from Account first.</p></div>`;
}
async function acceptInvite() {
  const { code, inv } = S.join;
  const name = (document.getElementById("join-name").value || "").trim().slice(0, 80);
  if (!name) { toast("Enter your name"); return; }
  const b = S.raw.batch();
  if (!inv.fleetId) {
    b.set(S.raw.doc(`orgs/${inv.orgId}/members/${S.uid}`), { role: inv.role, name, addedAt: S.raw.TS, invite: code });
    b.set(S.raw.doc(`users/${S.uid}`), { name, orgs: S.raw.arrayUnion(inv.orgId) }, { merge: true });
  } else {
    const acc = { uid: S.uid, role: inv.role, name, invite: code, joinedAt: S.raw.TS };
    if (inv.role === "driver") acc.driverId = inv.driverId;
    b.set(S.raw.doc(`orgs/${inv.orgId}/fleets/${inv.fleetId}/access/${S.uid}`), acc);
  }
  b.update(S.raw.doc(`invites/${code}`), { usedBy: S.uid, usedAt: S.raw.TS });
  try {
    await b.commit(); S.me.name = name; toast("You're in");
    try { if (inv.fleetId) localStorage.setItem("access", `${inv.orgId}/${inv.fleetId}`); else localStorage.setItem("org", inv.orgId); } catch (e) {}
    finishJoin();
  } catch (e) { toast("Couldn't join: " + errText(e)); }
}

    return `<div class="li"><div class="main"><div class="t">${esc(x.category)} ${plate(carLabel(x.carId))}</div><div class="small muted">${fmtDate(x.date)}${x.vendor ? " · " + esc(x.vendor) : ""}${x.managerNote ? " · Manager: " + esc(x.managerNote) : ""}</div></div><div class="end"><b class="num">${amt}</b><div>${pill(cls, lab)}</div>${canSubmit() && x.status === "pending" && x.by === S.uid ? `<button class="btn sm" data-action="withdraw-sub" data-v="${esc(x.id)}">Withdraw</button>` : ""}</div></div>`; }).join("")}</div>`
    : `<div class="card empty small">${canSubmit() ? "Expenses you add appear here until a manager approves them." : "No expenses sent by the owner yet."}</div>`;
  return `<div class="card"><div class="section-head" style="margin:0 0 8px"><h3 style="margin:0">Expenses sent by the owner</h3>${canSubmit() ? `<button class="btn primary sm" data-action="submit-expense">Add expense</button>` : ""}</div>${body}</div>`;
}

const expenseFields = r => [
  { id: "carId", label: "Car", type: "select", options: carOpts("Choose car"), value: r.carId || "", required: true },
  { id: "category", label: "Category", type: "select", options: EXPENSE_CATS, value: r.category || "Service", half: true },
  { id: "amount", label: "Amount (KSh)", type: "number", value: r.amount ?? "", required: true, half: true },
  { id: "date", label: "Date", type: "date", value: r.date || todayStr(), half: true, min: trackStart() },
  { id: "odometer", label: "Odometer (km)", type: "number", value: r.odometer ?? "", half: true },
  { id: "vendor", label: "Garage / supplier", value: r.vendor || "" }
];

function formSubmitExpense() {
  if (!canSubmit()) return;
  if (!S.cars.length) { toast("Your manager hasn't added cars yet"); return; }
  openForm("Add an expense", [...expenseFields({}),
    { id: "ref", label: "M-Pesa code or receipt no.", value: "", placeholder: "Optional" },
    { id: "chargeDriver", label: "The driver should pay this back", type: "check", value: false, hint: "For fines or damage. Your manager decides." },
    { id: "note", label: "Note for your manager", type: "textarea", value: "" }
  ], async v => {
    if (!v.carId) return "Choose the car"; if (!(v.amount > 0)) return "Enter the amount"; if (!v.date) return "Enter the date";
    if (v.odometer === "" || v.odometer == null) delete v.odometer;
    for (const k of ["vendor", "ref", "note"]) v[k] = String(v[k] || "").slice(0, k === "note" ? 500 : k === "ref" ? 40 : 120);
    const ref = S.raw.collection(`${fleetBase()}/submissions`).doc();
    const work = ref.set({ ...v, status: "pending", submittedAt: S.raw.TS, by: S.uid });
    const r = await Promise.race([work.then(() => "ok", e => e), new Promise(res => setTimeout(() => res("slow"), 6000))]);
    if (r === "ok") { toast("Sent to your manager for approval"); return true; }
    if (r === "slow") { toast("Saved on this phone. It will send when you're back online."); return true; }
    return "Couldn't send: " + errText(r);
  }, { saveLabel: "Send for approval", intro: "A manager checks it before it's added to your fleet's figures." });
}

function approvalsCard() {
  if (S.mode !== "staff") return "";
  const list = pendingFor(S.fleet); if (!list.length) return "";
  return `<div class="card" style="border-left:4px solid var(--warn)"><h3>${list.length} expense${list.length === 1 ? "" : "s"} from the owner to approve</h3>${S.canManage ? "" : `<p class="small muted">A manager needs to approve these.</p>`}<div class="list">${list.map(x => `<div class="li"><div class="main"><div class="t">${esc(x.category)} ${plate(carLabel(x.carId))}</div><div class="small muted">${fmtDate(x.date)}${x.vendor ? " · " + esc(x.vendor) : ""}${x.note ? " · " + esc(x.note) : ""}</div></div><div class="end"><b class="num">${ksh(x.amount)}</b>${S.canManage ? `<div class="row-actions"><button class="btn primary sm" data-action="review-sub" data-v="${esc(x.id)}">Review</button></div>` : ""}</div></div>`).join("")}</div></div>`;
}

function reviewSubmission(sid) {
  const fid = S.fleet, x = (S.subsBy[fid] || []).find(r => r.id === sid);
  if (!x || x.status !== "pending") { toast("This expense was already handled"); return; }
  const subRef = () => S.raw.doc(`${fleetBase(fid)}/submissions/${sid}`);
  openForm("Review owner's expense", [...expenseFields(x),
    { id: "chargeDriver", label: "Charge this to the driver", type: "check", value: !!x.chargeDriver, hint: "Adds it to what the driver owes." },
    { id: "note", label: "Note on the record", type: "textarea", value: [x.note, x.ref ? "Ref " + x.ref : ""].filter(Boolean).join(" · ") },
    { id: "managerNote", label: "Message to the owner", value: "", placeholder: "Optional. Shown to them, e.g. why you changed or declined it" }
  ], async v => {
    if (!v.carId) return "Choose the car"; if (!(v.amount > 0)) return "Enter the amount";
    if (v.date < trackStart()) return "Date is before this fleet's tracking start date";
    if (v.chargeDriver) { const a = assignOn(v.carId, v.date); if (!a) return "No driver had this car on that date, so it can't be charged"; v.driverId = a.driverId; } else v.driverId = "";
    if (v.odometer === "" || v.odometer == null) delete v.odometer;
    const managerNote = String(v.managerNote || "").slice(0, 500); delete v.managerNote;
    const m = monthOf(v.date);
    return save(async () => {
      await S.db.collection(`months/${m}/expenses`).doc("owner_" + sid).set({ ...v, source: "owner", submissionId: sid, updatedAt: new Date().toISOString() });
      await subRef().update({ status: "approved", approvedAmount: v.amount, managerNote, decidedAt: S.raw.TS, decidedBy: S.uid, expenseId: "owner_" + sid });
      logActivity("approved", "expenses", recSummary("expenses", v), v.amount);
      refreshMonth(m, "expenses");
    }, "Expense approved");
  }, { saveLabel: "Approve", deleteLabel: "Decline", intro: `Sent by ${esc(S.names[x.by] || "the owner")} on ${fmtDate(String(x.submittedAt || "").slice(0, 10))}. Correct anything that's wrong, then approve.`,
    onDelete: () => { const note = String((document.getElementById("f-managerNote") || {}).value || "").trim().slice(0, 500); return save(() => subRef().update({ status: "rejected", managerNote: note, decidedAt: S.raw.TS, decidedBy: S.uid }), "Expense declined"); } });
}

// Two-tap confirm for buttons outside forms
function confirmTap(el, label) { if (el.dataset.confirm) return true; el.dataset.confirm = "1"; el.textContent = label || "Tap again to confirm"; setTimeout(() => { if (el.isConnected) { delete el.dataset.confirm; } }, 4000); return false; }

function toast(t) { const el = document.getElementById("toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast._t); toast._t = setTimeout(() => el.style.display = "none", 2800); }

function findRec(kind, id, m) { return ((S.months[m] || {})[kind] || []).find(r => r.id === id); }

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-action]"); if (!el) return;
  const a = el.dataset.action, v = el.dataset.v;
  if (el.tagName === "INPUT" || el.tagName === "SELECT") return;
  if (el.tagName === "A") return;
  e.preventDefault();
  switch (a) {
    case "period": S.period = v; render(); break;
    case "more-tab": S.moreTab = v; render(); break;
    case "ins-tab": S.insTab = v; render(); break;
    case "go": S.detail = null; location.hash = v; break;
    case "back": S.detail = null; render(); break;
    case "open": { const [k, id] = v.split(":"); S.detail = v; closeSheet(); const tab = k === "car" ? "cars" : "drivers"; if (location.hash !== "#" + tab) location.hash = tab; else render(); window.scrollTo(0, 0); break; }
    case "close": closeSheet(); break;
    case "quick-add": if (S.mode === "owner") formSubmitExpense(); else quickAdd(); break;
    case "submit-expense": formSubmitExpense(); break;
    case "pick-fleet": selectFleet(v); break;
    case "all-owners": leaveFleet(); break;
    case "new-fleet": formFleet(); break;
    case "edit-fleet": formFleet(S.fleets.find(f => f.id === v)); break;
    case "fleet-people": openPeople(v); break;
    case "team": openTeam(); break;
    case "account": openAccount(); break;
    case "sign-out": if (S.signOut) S.signOut(); break;
    case "switch-org": { const o = S.orgs.find(x => x.id === v); closeSheet(); if (o) { location.hash = "owners"; startStaff(o); } break; }
    case "switch-access": { const a = S.myAccess[+v]; closeSheet(); if (a) { location.hash = "home"; startAccess(a); } break; }
    case "invite-owner": case "invite-family": { const f = S.fleets.find(x => x.id === v); if (f) inviteFlow({ role: a === "invite-owner" ? "owner" : "owner_viewer", fleetId: v, label: f.name || "a fleet", to: a === "invite-owner" ? "the owner" : "the owner's family member" }); break; }
    case "invite-staff": inviteFlow({ role: v, label: S.orgName, to: "your new team member" }); break;
    case "invite-driver": { const d = driverById(v); if (d) inviteFlow({ role: "driver", fleetId: S.fleet, driverId: v, label: (S.fleetMeta && S.fleetMeta.name) || "your fleet", to: d.name, phone: phoneKey(d.phone) || "" }); break; }
    case "remove-access": { if (!confirmTap(el, "Tap again to remove")) break; const [fid, uid] = v.split("|"); if (await save(() => S.raw.doc(`${fleetBase(fid)}/access/${uid}`).delete(), "Access removed")) setTimeout(() => openPeople(fid), 300); break; }
    case "remove-member": { if (!confirmTap(el, "Tap again to remove")) break; if (await save(() => S.raw.doc(`orgs/${S.org}/members/${v}`).delete(), "Removed from team")) setTimeout(openTeam, 300); break; }
    case "withdraw-sub": { if (!confirmTap(el, "Tap again")) break; try { await S.raw.doc(`${fleetBase()}/submissions/${v}`).delete(); toast("Withdrawn"); } catch (er) { toast("Couldn't withdraw: " + errText(er)); } break; }
    case "copy-text": try { await navigator.clipboard.writeText(v); toast("Copied"); } catch (er) { toast("Copy blocked. Select the text and copy it."); } break;
    case "create-org": createOrg(); break;
    case "use-code": showJoin((document.getElementById("code-in") || {}).value); break;
    case "enter-code": { const c = prompt("Paste the invite code or link"); if (c) showJoin(c); break; }
    case "accept-invite": acceptInvite(); break;
    case "join-cancel": finishJoin(); break;
    case "review-sub": reviewSubmission(v); break;
    case "new-payment": formPayment(v); break;
    case "new-expense": formExpense(v); break;
    case "new-downtime": formDowntime(v); break;
    case "new-odo": formOdo(v); break;
    case "new-car": formCar(); break;
    case "new-driver": formDriver(); break;
    case "new-assign": formAssign(v); break;
    case "edit-settings": formSettings(); break;
    case "edit-car": formCar(S.cars.find(c => c.id === v)); break;
    case "edit-driver": formDriver(S.drivers.find(d => d.id === v)); break;
    case "edit-assign": formAssign(null, S.assigns.find(x => x.id === v)); break;
    case "edit-rec": { const k = el.dataset.k, rec = findRec(k, v, el.dataset.m); if (!rec) break; ({ payments: () => formPayment(null, rec), expenses: () => formExpense(null, rec), downtime: () => formDowntime(null, rec), odo: () => formOdo(null, rec) })[k](); break; }
    case "statement": openStatement(v); break;
    case "settle-driver": formSettle(v); break;
    case "copy-stmt": try { await navigator.clipboard.writeText(document.getElementById("stmt-text").textContent); toast("Statement copied"); } catch (er) { toast("Copy blocked. Select the text and copy it."); } break;
    case "form-delete": if (el.dataset.confirm) { const r = await FORM.onDelete(); if (r !== false) closeSheet(); } else { el.dataset.confirm = "1"; el.textContent = FORM.deleteLabel ? "Tap again to " + FORM.deleteLabel.toLowerCase() : "Tap again to delete"; } break;
    case "imp-reset": if (IMP) { IMP = null; render(); } else { location.hash = "more"; } break;
    case "imp-go": runImport(); break;
  }
});
document.addEventListener("change", async e => {
  const el = e.target;
  if (el.dataset.roleFor) { if (await save(() => S.raw.doc(`orgs/${S.org}/members/${el.dataset.roleFor}`).update({ role: el.value }), "Role changed")) setTimeout(openTeam, 300); return; }
  if (el.id === "imp-file" && el.files[0]) handleImportFile(el.files[0]);
  if (el.dataset.action === "imp-toggle") { IMP.rows[+el.dataset.v].include = el.checked; render(); }
  if (el.dataset.action === "imp-driver") { const r = IMP.rows[+el.dataset.v]; r.driverId = el.value; r.how = el.value ? "you" : ""; r.include = !!el.value && !r.dup && !!r.date; render(); }
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "the-form") return;
  e.preventDefault();
  const btn = e.target.querySelector('button[type="submit"]'); btn.disabled = true;
  const res = await FORM.onSubmit(formVals());
  btn.disabled = false;
  if (typeof res === "string") { document.getElementById("form-err").textContent = res; return; }
  if (res) closeSheet();
});
document.getElementById("scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

function route() {
  const h = (location.hash || "#home").slice(1);
  const valid = ["home", "collect", "cars", "drivers", "insights", "more", "import", "settings", "owners"];
  if (S.mode !== "staff" && (h === "import" || h === "settings" || h === "owners")) { if (h !== "home") { location.hash = "home"; return; } }
  const nv = valid.includes(h) ? h : "home";
  if (nv !== S.view) { if (!(S.detail && ((nv === "cars" && S.detail.startsWith("car:")) || (nv === "drivers" && S.detail.startsWith("driver:"))))) S.detail = null; }
  S.view = nv;
  render();
}
window.addEventListener("hashchange", route);
S.view = (location.hash || "#home").slice(1) || "home";
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
<script type="module">
/* ============ Firebase: sign-in and database ============ */
import { firebaseConfig } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, sendPasswordResetEmail, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, collection, collectionGroup, getDoc, getDocs, setDoc, updateDoc, deleteDoc, onSnapshot, query, where, orderBy, limit, serverTimestamp, Timestamp, writeBatch, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const view = () => document.getElementById("view");
const escH = t => String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

if (!firebaseConfig || !firebaseConfig.apiKey || String(firebaseConfig.apiKey).startsWith("PASTE")) {
  document.getElementById("sync").textContent = "";
  view().innerHTML = `<div class="card auth"><h2>Almost there</h2><p>Paste your Firebase web app settings into <b>firebase-config.js</b>, then deploy again. See the README for where to find them.</p></div>`;
  document.querySelector("nav.tabs").style.display = "none";
  document.getElementById("fab").style.display = "none";
  throw new Error("Firebase config missing");
}

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
let fs;
try { fs = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch (e) { fs = initializeFirestore(app, {}); }

let uid = null;
const TS = { __serverTime: true };
const RECORD = /\/months\/[^/]+\/(payments|expenses|downtime|odo)\/[^/]+$/;

// Values going in: server-time marker → serverTimestamp(); records get updatedBy (the rules require it).
function enc(path, data) {
  const out = {};
  for (const [k, v] of Object.entries(data || {})) { if (v === undefined) continue; out[k] = v === TS ? serverTimestamp() : v; }
  if (RECORD.test(path)) out.updatedBy = uid;
  return out;
}
// Values coming out: Firestore timestamps → ISO strings, which the app already uses everywhere.
function dec(v) {
  if (v instanceof Timestamp) return v.toDate().toISOString();
  if (Array.isArray(v)) return v.map(dec);
  if (v && typeof v === "object" && Object.getPrototypeOf(v) === Object.prototype) { const o = {}; for (const k in v) o[k] = dec(v[k]); return o; }
  return v;
}
const wrapDoc = s => ({ id: s.id, path: s.ref.path, exists: s.exists(), data: () => s.exists() ? dec(s.data({ serverTimestamps: "estimate" })) : undefined, metadata: s.metadata });
const wrapQuery = q => ({ docs: q.docs.map(wrapDoc), size: q.size, empty: q.empty, metadata: q.metadata });

function D(path) {
  const ref = doc(fs, path);
  return {
    id: ref.id, path, ref,
    get: async () => wrapDoc(await getDoc(ref)),
    set: (d, opts) => setDoc(ref, enc(path, d), opts || {}),
    update: d => updateDoc(ref, enc(path, d)),
    delete: () => deleteDoc(ref),
    onSnapshot: (next, err) => onSnapshot(ref, s => next(wrapDoc(s)), err)
  };
}
function Q(base, cons = []) {
  const q = () => cons.length ? query(base, ...cons) : base;
  return {
    where: (f, op, v) => Q(base, [...cons, where(f, op, v)]),
    orderBy: (f, d) => Q(base, [...cons, orderBy(f, d)]),
    limit: n => Q(base, [...cons, limit(n)]),
    get: async () => wrapQuery(await getDocs(q())),
    onSnapshot: (next, err) => onSnapshot(q(), s => next(wrapQuery(s)), err)
  };
}
function C(path) {
  const col = collection(fs, path);
  return { ...Q(col), path, doc: id => D(id ? `${path}/${id}` : doc(col).path), add: async d => { const r = doc(col); await setDoc(r, enc(r.path, d)); return D(r.path); } };
}
const db = {
  TS,
  collection: C,
  doc: D,
  group: name => Q(collectionGroup(fs, name)),
  newId: path => doc(collection(fs, path)).id,
  arrayUnion: (...xs) => arrayUnion(...xs),
  daysFromNow: n => Timestamp.fromMillis(Date.now() + n * 864e5),
  batch: () => {
    const b = writeBatch(fs);
    return { set: (d, data, opts) => { b.set(d.ref, enc(d.path, data), opts || {}); }, update: (d, data) => { b.update(d.ref, enc(d.path, data)); }, delete: d => { b.delete(d.ref); }, commit: () => b.commit() };
  }
};

/* ---- Sign-in screen ---- */
const AUTH_ERR = {
  "auth/invalid-credential": "Wrong email or password.", "auth/wrong-password": "Wrong email or password.", "auth/user-not-found": "No account with that email. Create one instead.",
  "auth/email-already-in-use": "That email already has an account. Sign in instead.", "auth/weak-password": "Use at least 6 characters for the password.",
  "auth/invalid-email": "That email address doesn't look right.", "auth/network-request-failed": "No connection. Check your internet and try again.",
  "auth/popup-closed-by-user": "Google sign-in was closed before finishing.", "auth/too-many-requests": "Too many attempts. Wait a few minutes and try again."
};
const authErr = e => AUTH_ERR[e && e.code] || "Something went wrong (" + ((e && e.code) || "error") + ").";
function showAuth(mode = "in", msg = "") {
  document.querySelector("nav.tabs").style.display = "none";
  document.getElementById("fab").style.display = "none";
  document.getElementById("acct").hidden = true;
  document.getElementById("fleetbar").innerHTML = ""; document.getElementById("banner").innerHTML = "";
  document.getElementById("biz-name").textContent = "Fleet Ledger";
  document.getElementById("sync").textContent = "";
  const join = new URLSearchParams(location.search).get("join");
  const up = mode === "up";
  view().innerHTML = `<div class="auth"><div class="card">
    <h2>${up ? "Create your account" : "Sign in"}</h2>
    ${join ? `<p class="small">You've been invited. ${up ? "Create an account" : "Sign in or create an account"} to accept.</p>` : ""}
    <form id="auth-form">
      ${up ? `<label class="fl" for="a-name">Your name<input id="a-name" autocomplete="name" required maxlength="80"></label>` : ""}
      <label class="fl" for="a-email">Email<input id="a-email" type="email" autocomplete="email" required></label>
      <label class="fl" for="a-pass">Password<input id="a-pass" type="password" autocomplete="${up ? "new-password" : "current-password"}" minlength="6" required></label>
      <div class="small" id="a-err" style="color:var(--bad);min-height:1.2em">${escH(msg)}</div>
      <div class="row-actions"><button class="btn primary" type="submit">${up ? "Create account" : "Sign in"}</button></div>
    </form>
    <div class="or">or</div>
    <div class="row-actions"><button class="btn" id="a-google" type="button">Continue with Google</button></div>
    <p class="small" style="margin-top:14px">${up ? `Have an account? <a href="#" id="a-switch">Sign in</a>` : `New here? <a href="#" id="a-switch">Create an account</a> · <a href="#" id="a-reset">Forgot password</a>`}</p>
  </div></div>`;
  const err = t => { document.getElementById("a-err").textContent = t; };
  document.getElementById("a-switch").onclick = e => { e.preventDefault(); showAuth(up ? "in" : "up"); };
  const reset = document.getElementById("a-reset");
  if (reset) reset.onclick = async e => {
    e.preventDefault();
    const em = document.getElementById("a-email").value.trim();
    if (!em) return err("Type your email first, then tap Forgot password.");
    try { await sendPasswordResetEmail(auth, em); err("Check your email for a reset link."); } catch (x) { err(authErr(x)); }
  };
  document.getElementById("a-google").onclick = async () => { try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch (x) { err(authErr(x)); } };
  document.getElementById("auth-form").onsubmit = async e => {
    e.preventDefault();
    const em = document.getElementById("a-email").value.trim(), pw = document.getElementById("a-pass").value;
    const btn = e.target.querySelector("button[type=submit]"); btn.disabled = true; err("");
    try {
      if (up) {
        const name = document.getElementById("a-name").value.trim();
        try { sessionStorage.setItem("pendingName", name); } catch (x) {}
        const cred = await createUserWithEmailAndPassword(auth, em, pw);
        await updateProfile(cred.user, { displayName: name });
      } else await signInWithEmailAndPassword(auth, em, pw);
    } catch (x) { err(authErr(x)); btn.disabled = false; }
  };
}

let started = false;
onAuthStateChanged(auth, user => {
  if (!user) { uid = null; if (started) location.reload(); else showAuth("in"); return; }
  if (started) return;
  started = true; uid = user.uid;
  let name = user.displayName || "";
  try { name = name || sessionStorage.getItem("pendingName") || ""; } catch (x) {}
  window.startApp({ db, uid, name, email: user.email || "", signOut: () => signOut(auth) });
});
</script>
