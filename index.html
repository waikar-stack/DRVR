function timeAgo(iso) {
  if (!iso) return "never";
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (!isFinite(s)) return "—";
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + " min ago";
  if (s < 86400) return Math.floor(s / 3600) + " h ago";
  const d = Math.floor(s / 86400);
  return d === 1 ? "yesterday" : d + " days ago";
}

function insBusiness(c) {
  const T = c.T, TS = trackStart(), from = c.P.from, to = c.P.to;
  const inP = d => d >= from && d <= to && d >= TS;
  const t = c.tot;
  const live = c.cars.filter(x => !(x.soldDate && x.soldDate <= T));
  const collRate = t.exp + t.charges ? t.rev / (t.exp + t.charges) : NaN;
  const costRatio = t.rev ? t.cost / t.rev : NaN;
  const netPerCarDay = t.denom ? t.net / t.denom : NaN;
  const rates = S.assigns.filter(a => !a.end || a.end >= from).map(a => Number(a.rate) || 0).filter(Boolean);
  const avgRate = rates.length ? rates.reduce((s, x) => s + x, 0) / rates.length : 0;

  // Off-road days by reason, with income lost (excused days only; unexcused days are still owed by the driver)
  const byReason = {}; let lostDown = 0;
  for (const car of S.cars) {
    const dm = c.down[car.id]; if (!dm) continue;
    for (const [d, dn] of dm) {
      if (!inP(d)) continue;
      const a = assignOn(car.id, d);
      if (a && a.restDay !== "" && a.restDay != null && Number(a.restDay) === weekday(d)) continue;
      const lost = dn.excused ? (a ? Number(a.rate) || 0 : avgRate) : 0;
      const k = dn.reason || "Other";
      const r = byReason[k] || (byReason[k] = { days: 0, lost: 0 });
      r.days++; r.lost += lost; lostDown += lost;
    }
  }
  const idleDays = c.cars.reduce((s, x) => s + (x.idleP || 0), 0), lostIdle = idleDays * avgRate;
  const reasons = Object.entries(byReason).sort((a, b) => b[1].lost - a[1].lost || b[1].days - a[1].days);
  if (idleDays) reasons.push(["No driver (not recorded as off-road)", { days: idleDays, lost: lostIdle }]);

  // Owner costs by category
  const cats = {};
  for (const x of all("expenses")) { if (!inP(x.date)) continue; const k = x.category || "Other"; cats[k] = (cats[k] || 0) + (Number(x.amount) || 0); }
  const catRows = Object.entries(cats).sort((a, b) => b[1] - a[1]);

  // Arrears ageing
  const owing = c.drivers.filter(d => d.balance > 1);
  const buckets = [
    ["1 to 3 days behind", d => d.rate && d.daysBehind <= 3, "var(--warn)"],
    ["4 to 7 days behind", d => d.rate && d.daysBehind > 3 && d.daysBehind <= 7, "var(--series-2)"],
    ["8 to 14 days behind", d => d.rate && d.daysBehind > 7 && d.daysBehind <= 14, "var(--bad)"],
    ["15+ days behind", d => d.rate && d.daysBehind > 14, "var(--bad)"],
    ["No longer driving", d => !d.rate, "var(--muted)"]
  ].map(([label, f, color]) => { const ds = owing.filter(f); return { label: esc(label), v: ds.reduce((s, d) => s + d.balance, 0), sub: ds.length ? `${ds.length} driver${ds.length === 1 ? "" : "s"}` : "", color }; }).filter(r => r.v > 0);

  // Monthly chart: last 12 months
  const curM = monthOf(T);
  const months = monthsBetween(addMonths(curM, -11), curM).filter(m => m >= monthOf(TS)).map(m => ({ m, ...(c.fleetM[m] || { rev: 0, cost: 0, exp: 0 }) }));

  // Cars ranked by net profit per working day
  const carRows = live.map(x => ({ x, perDay: x.denomP ? x.net / x.denomP : 0 })).sort((a, b) => b.perDay - a.perDay);

  // Drivers' payment reliability
  const drv = c.drivers.filter(d => d.assign || d.payP > 0 || d.balance > 1).map(d => {
    const pays = all("payments").filter(p => p.driverId === d.id && inP(p.date));
    return { d, n: pays.length, avg: pays.length ? d.payP / pays.length : 0, since: d.lastPay ? dayDiff(d.lastPay, T) : null };
  }).sort((a, b) => (isFinite(a.d.collRateP) ? a.d.collRateP : 9) - (isFinite(b.d.collRateP) ? b.d.collRateP : 9));

  // Plain-language findings
  const F = [];
  if (isFinite(collRate)) F.push(`You collected <b>${pct(collRate)}</b> of what drivers owed for this period (${ksh(t.rev)} of ${ksh(t.exp + t.charges)}).${collRate < 0.9 ? " Every 10% shortfall is about " + ksh((t.exp + t.charges) * 0.1) + "." : ""}`);
  if (carRows.length > 1) {
    const best = carRows[0], worst = carRows[carRows.length - 1];
    F.push(`Best earner: <b>${esc(best.x.plate)}</b> at ${ksh(best.perDay)} net per working day. Weakest: <b>${esc(worst.x.plate)}</b> at ${ksh(worst.perDay)}${worst.x.costP > worst.x.revP ? ", where costs are bigger than collections" : ""}.`);
  }
  if (catRows.length && t.cost) F.push(`<b>${esc(catRows[0][0])}</b> is your biggest owner cost at ${pct(catRows[0][1] / t.cost)} of spending (${ksh(catRows[0][1])}).`);
  if (lostDown + lostIdle > 0) F.push(`Cars off the road or without a driver cost about <b>${ksh(lostDown + lostIdle)}</b> in lost income${reasons.length ? `, mostly from “${esc(reasons[0][0])}”` : ""}.`);
  const late = owing.filter(d => d.rate && d.daysBehind > 7);
  if (late.length) F.push(`<b>${late.length} driver${late.length === 1 ? " is" : "s are"}</b> more than a week behind, owing ${ksh(late.reduce((s, d) => s + d.balance, 0))} between them.`);
  else if (owing.length) F.push(`No driver is more than a week behind. Total owed is ${ksh(t.arrears)}.`);
  const mPrev = c.fleetM[addMonths(curM, -1)], mPrev2 = c.fleetM[addMonths(curM, -2)];
  if (mPrev && mPrev2 && mPrev2.rev - mPrev2.cost) {
    const n1 = mPrev.rev - mPrev.cost, n2 = mPrev2.rev - mPrev2.cost, ch = (n1 - n2) / Math.abs(n2);
    F.push(`Net profit for ${fmtMonth(addMonths(curM, -1))} was ${ksh(n1)}, ${ch >= 0 ? "up" : "down"} ${pct(Math.abs(ch))} on ${fmtMonth(addMonths(curM, -2))}.`);
  }

  return `
  <div class="section">
    <div class="section-head"><h2>Summary</h2>${periodSeg()}</div>
    <div class="grid kpis">
      <div class="card kpi"><div class="label">Collected</div><div class="value num">${ksh(t.rev)}</div><div class="sub">${pct(collRate)} of ${ksh(t.exp + t.charges)} expected</div></div>
      <div class="card kpi"><div class="label">Owner costs</div><div class="value num">${ksh(t.cost)}</div><div class="sub">Service, repairs, insurance, etc.</div></div>

      <div class="card kpi"><div class="label">Utilisation</div><div class="value num">${pct(t.denom ? t.earn / t.denom : NaN)}</div><div class="sub">${t.earn} of ${t.denom} working car-days</div><div class="meter"><i style="width:${t.denom ? t.earn / t.denom * 100 : 0}%"></i></div></div>
    </div>
    <div class="small muted" style="margin-bottom:14px">${esc(c.P.label)}. Expected income counts each driver's daily rate, minus rest days and days the car was off the road for reasons that were not the driver's fault.</div>
    <div class="section-head"><h2>Key findings</h2></div>
    <div class="card">${F.length ? `<ul class="findings">${F.map(x => `<li>${x}</li>`).join("")}</ul>` : `<div class="small muted">Record a few weeks of payments and expenses to see findings here.</div>`}</div>
    <div class="grid kpis">
      <div class="card kpi"><div class="label">Collection rate</div><div class="value num" style="color:${collRate < 0.9 ? "var(--bad)" : "var(--ink)"}">${pct(collRate)}</div><div class="sub">of expected payments</div></div>
      <div class="card kpi"><div class="label">Net per car-day</div><div class="value num">${isFinite(netPerCarDay) ? ksh(netPerCarDay) : "—"}</div><div class="sub">after owner costs</div></div>
      <div class="card kpi"><div class="label">Costs vs collected</div><div class="value num">${pct(costRatio)}</div><div class="sub">of every shilling collected</div></div>
      <div class="card kpi"><div class="label">Lost to downtime</div><div class="value num" style="color:${lostDown + lostIdle > 0 ? "var(--bad)" : "var(--ink)"}">${ksh(lostDown + lostIdle)}</div><div class="sub">estimated · ${esc(c.P.label)}</div></div>
    </div>
  </div>
  ${monthChart(months)}
  <div class="section"><div class="section-head"><h2>Cars ranked</h2><span class="small muted">Net profit per working day</span></div>
    <div class="card">${hbars(carRows.map(({ x, perDay }) => ({ label: plate(x.plate), v: perDay, color: perDay < 0 ? "var(--bad)" : "var(--good)", sub: `${pct(x.util)} on road`, link: "car:" + x.id })), v => ksh(v))}</div></div>
  <div class="section"><div class="section-head"><h2>Profit by car</h2><span class="small muted">${esc(c.P.label)}</span></div>${carTable(c.cars)}</div>

    <div class="card">${hbars(catRows.map(([k, v]) => ({ label: esc(k), v, color: "var(--series-2)", sub: t.cost ? pct(v / t.cost) : "" })), v => ksh(v))}</div></div>
  <div class="section"><div class="section-head"><h2>Off-road days</h2><span class="small muted">Income lost by reason</span></div>
    <div class="card">${hbars(reasons.map(([k, r]) => ({ label: esc(k), v: r.lost, color: "var(--bad)", sub: `${r.days} day${r.days === 1 ? "" : "s"}` })), v => ksh(v))}
    <div class="small muted" style="margin-top:8px">Lost income counts working days when the driver wasn’t charged. “Driver absent” days are still owed, so they show days but no loss.</div></div></div>

    </tbody></table></div></div>`;
}

function monthChart(tr) {
  if (!tr.length) return "";
  const W = Math.max(340, Math.min(760, (document.getElementById("view").clientWidth || 640) - 30)), H = 230, L = 46, R = 8, Tp = 12, B = 26;
  const max = Math.max(1, ...tr.map(x => Math.max(x.rev, x.cost, x.exp)));
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= max) return m * p; return 10 * p; })();
  const y = v => Tp + (H - Tp - B) * (1 - Math.max(0, v) / nice);
  const gw = (W - L - R) / tr.length, bw = Math.max(4, Math.min(22, gw / 3.2));
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Expected, collected and owner costs by month">`;
  for (const f of [0, 0.25, 0.5, 0.75, 1]) { const v = f * nice; s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${kshShort(v)}</text>`; }
  tr.forEach((m, i) => {
    const cx = L + gw * i + gw / 2;
    const bar = (v, x, col) => { const top = y(v), h = Math.max(0, H - B - top); return h > 0 ? `<rect x="${x}" y="${top}" width="${bw}" height="${h}" rx="2" fill="${col}"/>` : ""; };
    s += bar(m.rev, cx - bw - 1, "var(--series-1)") + bar(m.cost, cx + 1, "var(--series-2)");
    if (m.exp > 0) s += `<line x1="${cx - bw - 4}" x2="${cx + 3}" y1="${y(m.exp)}" y2="${y(m.exp)}" stroke="var(--ink)" stroke-width="2" stroke-dasharray="3 2"/>`;
    s += `<rect x="${cx - gw / 2}" y="${Tp}" width="${gw}" height="${H - Tp - B}" fill="transparent" data-tip="${esc(fmtMonth(m.m))} · Expected ${esc(ksh(m.exp))} · Collected ${esc(ksh(m.rev))} (${esc(m.exp ? pct(m.rev / m.exp) : "—")}) · Costs ${esc(ksh(m.cost))} · Net ${esc(ksh(m.rev - m.cost))}"/>`;
    if (tr.length <= 7 || i % 2 === tr.length % 2 || i === tr.length - 1) s += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${MONTHS_SHORT[Number(m.m.slice(5)) - 1]}</text>`;
  });
  s += `<line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="var(--muted)" stroke-width="1"/></svg>`;
  return `<div class="section"><div class="section-head"><h2>12-month picture</h2><div class="legend"><span><i style="background:var(--series-1)"></i>Collected</span><span><i style="background:var(--series-2)"></i>Costs</span><span><i style="background:var(--ink);height:2px;vertical-align:3px"></i>Expected</span></div></div><div class="card">${s}<div class="small muted">Tap a month for the details.</div></div></div>`;
}

function insTeam(c) {
  const T = c.T, cur = monthOf(T);
  const acts = Object.values(S.act || {}).flat().filter(a => a && a.uid).sort((a, b) => (b.at || "").localeCompare(a.at || ""));
  const vis = Object.values(S.vis || {}).flat().filter(v => v && v.uid);
  const people = {};
  const P = id => people[id] || (people[id] = { id, entries: 0, opens: 0, days: new Set(), last: "", kinds: {} });
  for (const a of acts) { const p = P(a.uid); if ((a.at || "") > p.last) p.last = a.at; if ((a.date || "").startsWith(cur)) { p.entries++; p.kinds[a.kind] = (p.kinds[a.kind] || 0) + 1; } }
  for (const v of vis) { const p = P(v.uid); if ((v.last || "") > p.last) p.last = v.last; if ((v.date || "").startsWith(cur)) { p.opens += Number(v.opens) || 0; p.days.add(v.date); } }
  const ppl = Object.values(people).sort((a, b) => b.entries - a.entries || b.last.localeCompare(a.last));
  const monthActs = acts.filter(a => (a.date || "").startsWith(cur));

  // Entries per day, last 30 days
  const days = []; for (let i = 29; i >= 0; i--) days.push(addDays(T, -i));
  const perDay = days.map(d => acts.filter(a => a.date === d).length), maxDay = Math.max(1, ...perDay);

  // Data freshness, from the records themselves
  const latest = k => all(k).reduce((m, x) => { const d = x.date || x.from || ""; return d > m ? d : m; }, "");
  const lastImport = acts.find(a => a.action === "imported");
  const fresh = [
    ["Last payment recorded", latest("payments"), 2],
    ["Last expense recorded", latest("expenses"), 14],
    ["Last mileage reading", latest("odo"), 8],
    ["Last off-road record", latest("downtime"), null]
  ].map(([label, d, warn]) => { const age = d ? dayDiff(d, T) : null; return `<div class="li"><div class="main"><div class="t">${label}</div><div class="small muted">${d ? fmtDate(d) : "Nothing yet"}</div></div><div class="end">${age == null ? pill("neutral", "None") : warn != null && age > warn ? pill("warn", age + " days ago") : pill("good", age === 0 ? "Today" : age + " day" + (age === 1 ? "" : "s") + " ago")}</div></div>`; }).join("")
    + `<div class="li"><div class="main"><div class="t">Last M-Pesa import</div><div class="small muted">${lastImport ? esc(lastImport.summary) : "None since activity tracking began"}</div></div><div class="end">${lastImport ? pill("neutral", timeAgo(lastImport.at)) : pill("neutral", "—")}</div></div>`;

  const kindTxt = k => Object.entries(k).map(([kind, n]) => `${n} ${kind === "setup" ? "setup change" : ACT_LABEL[kind] || kind}${n === 1 ? "" : "s"}`).join(", ");
  const noId = !S.uid ? `<div class="banner">Your account can’t be identified on this page, so your own visits and entries aren’t being logged.</div>` : "";

  return `${noId}
  <div class="section">
    <div class="grid kpis">
      <div class="card kpi"><div class="label">Entries this month</div><div class="value num">${monthActs.length}</div><div class="sub">payments, expenses, mileage and more</div></div>
      <div class="card kpi"><div class="label">Active family members</div><div class="value num">${ppl.filter(p => p.entries || p.opens).length}</div><div class="sub">opened or edited this month</div></div>
      <div class="card kpi"><div class="label">Last change</div><div class="value" style="font-size:20px">${acts[0] ? timeAgo(acts[0].at) : "—"}</div><div class="sub">${acts[0] ? who(acts[0].uid) : "No entries logged yet"}</div></div>
    </div>
  </div>
  <div class="section"><div class="section-head"><h2>Who’s keeping the books</h2><span class="small muted">${fmtMonth(cur)}</span></div>
    ${ppl.length ? `<div class="list">${ppl.map(p => `<div class="li"><div class="main"><div class="t">${who(p.id)}</div><div class="small muted">${p.entries ? kindTxt(p.kinds) : "No entries this month"}</div></div>
      <div class="end"><b class="num">${p.entries} entr${p.entries === 1 ? "y" : "ies"}</b><span class="small muted">${p.days.size} day${p.days.size === 1 ? "" : "s"} active · seen ${timeAgo(p.last)}</span></div></div>`).join("")}</div>`
      : `<div class="card empty">Nobody has been logged yet. Visits and entries are tracked from now on.</div>`}
  </div>
  <div class="section"><div class="section-head"><h2>Entries per day</h2><span class="small muted">Last 30 days</span></div>
    <div class="card"><div class="cols">${perDay.map((n, i) => `<i class="${n ? "" : "z"}" style="height:${n ? Math.max(6, n / maxDay * 100) : 3}%" data-tip="${esc(fmtDate(days[i]))} · ${n} entr${n === 1 ? "y" : "ies"}"></i>`).join("")}</div>
    <div class="small muted" style="display:flex;justify-content:space-between;margin-top:4px"><span>${fmtShort(days[0])}</span><span>Today</span></div></div></div>
  <div class="section"><div class="section-head"><h2>Is the data up to date?</h2></div><div class="list">${fresh}</div></div>
  <div class="section"><div class="section-head"><h2>Recent activity</h2><span class="small muted">Latest 25</span></div>
    ${acts.length ? `<div class="list feed">${acts.slice(0, 25).map(a => `<div class="li"><div class="main"><div class="t">${who(a.uid)} ${esc(a.action)}${a.kind && a.kind !== "setup" && a.action !== "imported" ? " a " + esc(ACT_LABEL[a.kind] || a.kind) : ""}</div><div class="small muted">${esc(a.summary)}</div></div><div class="end small muted">${timeAgo(a.at)}</div></div>`).join("")}</div>`
      : `<div class="card empty">No activity logged yet. Each payment, expense, mileage reading, import and setup change will appear here with who made it.</div>`}
    <div class="small muted">Only your team can see this. Activity covers the last two months.</div>
  </div>`;
}

function saveSummary(c) {
  if (!S.fleet || !S.canManage) return;
  const m = monthOf(c.T), fm = c.fleetM[m] || { rev: 0, cost: 0, exp: 0 };
  const sum = { month: m, collected: Math.round(fm.rev), expected: Math.round(fm.exp), costs: Math.round(fm.cost), net: Math.round(fm.rev - fm.cost), arrears: Math.round(c.tot.arrears), cars: c.cars.filter(x => !x.soldDate || x.soldDate > c.T).length, drivers: S.drivers.filter(d => d.status !== "left" && !(d.settlement && d.settlement.date)).length, driving: c.drivers.filter(d => d.assign).length, alerts: c.alerts.filter(a => a.sev === "bad").length };
  const key = JSON.stringify(sum);
  if (key === S._sumKey) return;
  const prev = S.fleetMeta && S.fleetMeta.summary ? JSON.stringify(S.fleetMeta.summary) : null;
  S._sumKey = key;
  if (key === prev) return;
  clearTimeout(saveSummary._t);
  const fid = S.fleet;
  saveSummary._t = setTimeout(() => { if (S.fleet === fid) S.raw.doc(fleetBase(fid)).update({ summary: sum, summaryAt: new Date().toISOString() }).catch(() => {}); }, 1500);
}

// Each driver's statement is copied to statements/<driverId>, the only thing a driver can read.
function saveStatements(c) {
  if (!S.fleet || !S.canWrite) return;
  if (saveStatements._t) return;
  const fid = S.fleet;
  saveStatements._t = setTimeout(() => {
    saveStatements._t = null;
    if (S.fleet !== fid || !S.calc) return;
    S._stmt = S._stmt || {};
    for (const d of S.calc.drivers) {
      const car = d.assign ? S.calc.cars.find(x => x.id === d.assign.carId) : null;
      const iv = car ? car.odo.iv : 0;
      const service = car ? { lastKm: car.odo.lastKm, lastDate: car.odo.lastDate || "", lastService: car.odo.lastService || 0, interval: iv, next: car.odo.lastService ? car.odo.lastService + iv : null, left: car.odo.lastKm != null && car.odo.lastService ? car.odo.lastService + iv - car.odo.lastKm : null, warnKm: Number(S.settings.serviceWarnKm) || 500 } : null;
      const recent = all("payments").filter(p => p.driverId === d.id).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 6).map(p => ({ date: p.date, amount: Number(p.amount) || 0, ref: p.ref || "" }));
      const body = { name: d.name || "", balance: Math.round(Number(d.balance) || 0), daysBehind: Math.round((Number(d.daysBehind) || 0) * 10) / 10, rate: Number(d.rate) || 0, car: d.assign ? carLabel(d.assign.carId) : "", carId: d.assign ? d.assign.carId : "", carName: car ? [car.make, car.model].filter(Boolean).join(" ") : "",
        service, docs: { licence: d.licenseExpiry || "", psvBadge: d.psvBadgeExpiry || "", insurance: car ? car.insuranceExpiry || "" : "", inspection: car ? car.inspectionExpiry || "" : "", psvLicence: car ? car.tncExpiry || "" : "" },
        warnDays: Number(S.settings.warnDays) || 30, payInfo: S.settings.payInfo || "", recent, text: statementText(d.id) };
      const key = JSON.stringify(body);
      if (S._stmt[fid + "/" + d.id] === key) continue;
      S._stmt[fid + "/" + d.id] = key;
      S.db.doc(`statements/${d.id}`).set({ ...body, updatedAt: new Date().toISOString() }).catch(() => { S._stmt[fid + "/" + d.id] = null; });
    }
  }, 2500);
}

const ownersOf = fid => (S.accessBy[fid] || []).filter(a => a.role === "owner").map(a => a.name || "Owner");

function viewOwners() {
  const fl = S.fleets, m = monthOf(todayStr());
  const cur = f => f.summary && f.summary.month === m ? f.summary : null;
  const tot = fl.reduce((t, f) => { const s = cur(f); if (s) { t.collected += s.collected; t.expected += s.expected; t.net += s.net; } if (f.summary) { t.arrears += f.summary.arrears; t.cars += f.summary.cars; t.drivers += f.summary.drivers || 0; } return t; }, { collected: 0, expected: 0, net: 0, arrears: 0, cars: 0, drivers: 0 });
  const n = pendingAll();
  const head = `<div class="section-head"><h2>Fleets</h2><div class="row-actions"><button class="btn sm" data-action="team">Team</button><button class="btn sm" data-action="go" data-v="stock">Stock${lowStock().length ? `<span class="count">${lowStock().length}</span>` : ""}</button>${S.canManage ? `<button class="btn primary sm" data-action="new-fleet">Add fleet</button>` : ""}</div></div>`;
  if (!fl.length) return `<div class="section">${head}<div class="card"><h3>Set up your first fleet</h3><div class="steps small">
    <p>1. Tap <b>Add fleet</b> and name it after the owner, e.g. “Mwangi Fleet”. Your own cars can be a fleet too.</p>
    <p>2. On the fleet, tap <b>People</b> → <b>Invite owner</b> and send them the link by WhatsApp.</p>
    <p>3. Open the fleet and add its cars, drivers and assignments.</p>
    <p class="muted">Add your managers and data-entry staff under <b>Team</b>. They see every fleet; owners see only their own.</p></div></div></div>`;
  const kpis = `<div class="card"><h3>All fleets · ${fmtMonth(m)} to date</h3><div class="detail-grid" style="margin-top:8px">
    <div><span>Collected</span><b>${ksh(tot.collected)}</b></div><div><span>Expected</span><b>${ksh(tot.expected)}</b></div>
    <div><span>Owners' net</span><b>${ksh(tot.net)}</b></div><div><span>Drivers owe</span><b>${ksh(tot.arrears)}</b></div>
    <div><span>Cars</span><b>${tot.cars}</b></div><div><span>Drivers</span><b>${tot.drivers}</b></div><div><span>Waiting approval</span><b>${n}</b></div></div>
    <p class="small muted" style="margin:8px 0 0">A fleet's figures refresh when a manager opens it.</p></div>`;
  const rows = fl.map(f => {

function formFleet(rec) {
  openForm(rec ? "Rename fleet" : "Add fleet", [{ id: "name", label: "Fleet name", value: rec ? rec.name : "", placeholder: "e.g. Mwangi Fleet", required: true, hint: rec ? "" : "Usually the owner's name. You'll invite the owner next." }], async v => {

    if (rec) return save(() => S.raw.doc(fleetBase(rec.id)).update({ name }), "Fleet renamed");
    const ref = S.raw.collection(`orgs/${S.org}/fleets`).doc();
    const ok = await save(async () => {

function randCode() { const a = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789"; return [...crypto.getRandomValues(new Uint8Array(24))].map(x => a[x % a.length]).join(""); }
async function inviteFlow({ role, fleetId = "", driverId = "", label, to = "them", phone = "" }) {
  const code = randCode();
  const data = { orgId: S.org, fleetId, role, label: String(label || "").slice(0, 120), createdBy: S.uid, createdAt: S.raw.TS, expiresAt: S.raw.daysFromNow(14), usedBy: null };
  if (role === "driver") data.driverId = driverId;
  try { await S.raw.doc(`invites/${code}`).set(data); }
  catch (e) { toast("Couldn't create the invite: " + errText(e)); return; }
  const link = `${location.origin}${location.pathname}?join=${code}`;
  const msg = `You're invited to ${label} on DRYVR as ${ROLE_LABEL[role]}. Open this link and sign in to join. It works once and expires in 14 days.\n${link}`;
  const wa = `https://wa.me/${phone ? "254" + phone : ""}?text=${encodeURIComponent(msg)}`;
  openSheet("Invite link", `<p>Send this to ${esc(to)}. It works once and expires in 14 days.</p><code class="code">${esc(link)}</code>

    <p class="small muted">Anyone who opens this link first can use it, so send it only to the right person.</p>`);
}

async function showJoin(code) {
  code = String(code || "").replace(/^.*[?&]join=/, "").replace(/[^A-Za-z0-9]/g, "");
  if (code.length < 20) { toast("That code doesn't look right"); return; }
  S.mode = "join"; S.join = { code, state: "loading" }; closeSheet(); render();
  try {
    const s = await S.raw.doc(`invites/${code}`).get();
    if (!s.exists) S.join.state = "missing";
    else {
      const d = s.data(); S.join.inv = d;
      if (d.usedBy === S.uid) S.join.state = "mine";
      else if (d.usedBy) S.join.state = "used";
      else if (Date.parse(d.expiresAt) < Date.now()) S.join.state = "expired";
      else S.join.state = "ready";
    }
  } catch (e) { S.join.state = "missing"; }
  if (S.join.state === "mine") return finishJoin();
  render();
}
function finishJoin() { history.replaceState(null, "", location.pathname + location.hash); S.join = null; findHome(); }
function viewJoin() {
  const j = S.join || {};
  if (j.state === "loading") return `<div class="card empty">Checking your invite…</div>`;
  const back = `<div class="row-actions" style="margin-top:10px"><button class="btn" data-action="join-cancel">Continue without joining</button></div>`;
  if (j.state === "missing") return `<div class="card auth"><h2>Invite not found</h2><p>The link may be incomplete. Ask whoever sent it for a new one.</p>${back}</div>`;
  if (j.state === "used") return `<div class="card auth"><h2>This invite was already used</h2><p>Each link works once. Ask for a new one.</p>${back}</div>`;
  if (j.state === "expired") return `<div class="card auth"><h2>This invite has expired</h2><p>Links last 14 days. Ask for a new one.</p>${back}</div>`;
  const inv = j.inv;
  return `<div class="auth">${brandHero()}<div class="card"><h2>You're invited</h2><p>Join <b>${esc(inv.label || "a fleet")}</b> as <b>${esc(ROLE_LABEL[inv.role] || inv.role)}</b>.</p>

    <div class="row-actions" style="margin-top:10px"><button class="btn primary" data-action="accept-invite">Join</button><button class="btn" data-action="join-cancel">Not now</button></div>
    <p class="small muted">Signed in as ${esc(S.me.email || "you")}. If that's the wrong account, sign out from Account first.</p></div></div>`;
}
async function acceptInvite() {
  const { code, inv } = S.join;
  const name = (document.getElementById("join-name").value || "").trim().slice(0, 80);
  if (!name) { toast("Enter your name"); return; }
  const b = S.raw.batch();
  if (!inv.fleetId) {
    b.set(S.raw.doc(`orgs/${inv.orgId}/members/${S.uid}`), { role: inv.role, name, addedAt: S.raw.TS, invite: code });
    b.set(S.raw.doc(`users/${S.uid}`), { name, orgs: S.raw.arrayUnion(inv.orgId) }, { merge: true });
  } else {
    const acc = { uid: S.uid, role: inv.role, name, invite: code, joinedAt: S.raw.TS };
    if (inv.role === "driver") acc.driverId = inv.driverId;
    b.set(S.raw.doc(`orgs/${inv.orgId}/fleets/${inv.fleetId}/access/${S.uid}`), acc);
  }
  b.update(S.raw.doc(`invites/${code}`), { usedBy: S.uid, usedAt: S.raw.TS });
  try {
    await b.commit(); S.me.name = name; toast("You're in");
    try { if (inv.fleetId) localStorage.setItem("access", `${inv.orgId}/${inv.fleetId}`); else localStorage.setItem("org", inv.orgId); } catch (e) {}
    finishJoin();
  } catch (e) { toast("Couldn't join: " + errText(e)); }
}

/* ---- Driver submissions (go to a manager for approval) ---- */
async function sendSub(data, okMsg, staffText) {
  const ref = S.raw.collection(`${fleetBase()}/submissions`).doc();
  const work = ref.set({ ...data, from: "driver", driverId: S.driverId, status: "pending", submittedAt: S.raw.TS, by: S.uid });
  const r = await Promise.race([work.then(() => "ok", e => e), new Promise(res => setTimeout(() => res("slow"), 6000))]);
  if (r === "ok" || r === "slow") {
    postEvent(S.fleet, "staff", "submission", staffText, { subId: ref.id });
    toast(r === "ok" ? okMsg : "Saved on this phone. It will send when you're back online.");
    return true;
  }
  return "Couldn't send: " + errText(r);
}

  const st = S.stmt || {};

function reviewSubmission(sid) {
  const fid = S.fleet, x = (S.subsBy[fid] || []).find(r => r.id === sid);
  if (!x || x.status !== "pending") { toast("This was already handled"); return; }
  const subRef = () => S.raw.doc(`${fleetBase(fid)}/submissions/${sid}`);
  const fromDriver = x.from === "driver", kind = x.kind || "expense";
  const who = fromDriver ? driverName(x.driverId) : (S.names[x.by] || "the owner");
  const noun = kind === "payment" ? "payment" : kind === "odo" ? "mileage reading" : "expense";
  const tell = (status, note, amount) => postEvent(fid, "uid:" + x.by, "decision",
    `Your ${noun}${kind === "odo" ? ` of ${Number(x.km).toLocaleString()} km` : ` of ${ksh(amount != null ? amount : x.amount)}`} was ${status === "approved" ? "approved" : "declined"}${note ? ": " + note : ""}`);
  const decide = async (status, managerNote, extra) => {
    await subRef().update({ status, managerNote: managerNote || "", decidedAt: S.raw.TS, decidedBy: S.uid, ...(extra || {}) });
    tell(status, managerNote, extra && extra.approvedAmount);
  };
  const msgField = { id: "managerNote", label: `Message to ${fromDriver ? "the driver" : "the owner"}`, value: "", placeholder: "Optional. Shown to them, e.g. why you changed or declined it" };
  const opts = { saveLabel: "Approve", deleteLabel: "Decline", intro: `Sent by ${esc(who)} on ${fmtDate(String(x.submittedAt || "").slice(0, 10))}. Correct anything that's wrong, then approve.`,
    onDelete: () => { const note = String((document.getElementById("f-managerNote") || {}).value || "").trim().slice(0, 500); return save(() => decide("rejected", note), "Declined"); } };

  if (kind === "payment") {
    const dup = x.ref && all("payments").find(p => recordId(p.ref) && recordId(p.ref) === recordId(x.ref));
    openForm(`Confirm payment from ${who}`, [
      { id: "amount", label: "Amount (KSh)", type: "number", value: x.amount, required: true, half: true },
      { id: "date", label: "Date", type: "date", value: x.date, half: true, min: trackStart() },
      { id: "method", label: "Paid by", type: "select", options: METHODS, value: x.method || "M-Pesa Till", half: true },
      { id: "ref", label: "M-Pesa code", value: x.ref || "", half: true },
      { id: "note", label: "Note", type: "textarea", value: x.note || "" }, msgField
    ], async v => {
      if (!(v.amount > 0)) return "Enter the amount";
      const a = driverAssignOn(x.driverId, v.date);
      const managerNote = String(v.managerNote || "").slice(0, 500); delete v.managerNote;
      const data = { ...v, driverId: x.driverId, carId: a ? a.carId : "", source: "driver", submissionId: sid };
      return save(async () => {
        await writeRecord("payments", data, null, true);
        await decide("approved", managerNote, { approvedAmount: v.amount, recordId: recordId(v.ref) || "" });
        postEvent(fid, "owners", "payment", `${ksh(v.amount)} received from ${who}${a ? " · " + carLabel(a.carId) : ""}`);
      }, "Payment confirmed");
    }, { ...opts, intro: opts.intro + (dup ? ` <b>A payment with this M-Pesa code is already recorded (${ksh(dup.amount)} on ${fmtDate(dup.date)}).</b> Approving keeps one record, not two.` : " Check it against your M-Pesa statement first.") });
    return;
  }
  if (kind === "odo") {
    openForm(`Mileage from ${who}`, [
      { id: "carId", label: "Car", type: "select", options: carOpts("Choose car"), value: x.carId, required: true },
      { id: "km", label: "Odometer reading (km)", type: "number", value: x.km, required: true, half: true },
      { id: "date", label: "Date", type: "date", value: x.date, half: true, min: trackStart() }, msgField
    ], async v => {
      if (!v.carId) return "Choose the car"; if (!(v.km > 0)) return "Enter the reading";
      const managerNote = String(v.managerNote || "").slice(0, 500); delete v.managerNote;
      return save(async () => { await writeRecord("odo", { ...v, source: "driver" }, null, true); await decide("approved", managerNote); }, "Mileage approved");
    }, { ...opts, intro: opts.intro + (x.note ? ` Note: ${esc(x.note)}` : "") });
    return;
  }
  openForm(fromDriver ? `Expense paid by ${who}` : "Review owner's expense", [...expenseFields(x),
    { id: "chargeDriver", label: "Charge this to the driver", type: "check", value: !!x.chargeDriver, hint: "Adds it to what the driver owes." },
    ...(fromDriver ? [{ id: "driverPaid", label: "Driver paid this from their own money", type: "check", value: true, hint: "Takes it off what the driver owes." }] : []),
    { id: "note", label: "Note on the record", type: "textarea", value: [x.note, x.ref ? "Ref " + x.ref : ""].filter(Boolean).join(" · ") }, msgField
  ], async v => {
    if (!v.carId) return "Choose the car"; if (!(v.amount > 0)) return "Enter the amount";
    if (v.date < trackStart()) return "Date is before this fleet's tracking start date";
    if (v.chargeDriver && v.driverPaid) return "Choose one: charge it to the driver, or the driver paid it.";
    if (v.driverPaid) v.driverId = x.driverId;
    else if (v.chargeDriver) { const a = assignOn(v.carId, v.date); if (!a) return "No driver had this car on that date, so it can't be charged"; v.driverId = a.driverId; } else v.driverId = "";
    if (v.odometer === "" || v.odometer == null) delete v.odometer;
    const managerNote = String(v.managerNote || "").slice(0, 500); delete v.managerNote;
    const m = monthOf(v.date), id = (fromDriver ? "driver_" : "owner_") + sid;
    return save(async () => {
      await S.db.collection(`months/${m}/expenses`).doc(id).set({ ...v, source: fromDriver ? "driver" : "owner", submissionId: sid, updatedAt: new Date().toISOString() });
      await decide("approved", managerNote, { approvedAmount: v.amount, expenseId: id });
      logActivity("approved", "expenses", recSummary("expenses", v), v.amount);
      refreshMonth(m, "expenses");
      recordEvents("expenses", v);
    }, "Expense approved");
  }, opts);
}

// Two-tap confirm for buttons outside forms
function confirmTap(el, label) { if (el.dataset.confirm) return true; el.dataset.confirm = "1"; el.textContent = label || "Tap again to confirm"; setTimeout(() => { if (el.isConnected) { delete el.dataset.confirm; } }, 4000); return false; }

/* ============ Incidents ============ */
const incById = id => (S.incidents || []).find(i => i.id === id);
const incWho = i => i.driverId ? driverNameSafe(i.driverId) : (i.driverLabel || "Not recorded");
function driverNameSafe(id) { if (S.mode === "driver") return id === S.driverId ? "You" : "Driver"; const d = S.drivers.find(x => x.id === id); return d ? d.name : "Driver"; }
const incCar = i => i.carId ? (S.mode === "driver" ? (S.stmt && S.stmt.carId === i.carId ? S.stmt.car : "Car") : carLabel(i.carId)) : "";
function incRow(i) {
  const [cls, lab] = INC_STATUS[i.status] || INC_STATUS.reported;
  const flags = [i.injured ? "someone hurt" : "", i.offRoad && !i.backOnRoad ? "car off road" : "", absNeeded(i) ? "abstract needed" : i.police ? "police" : ""].filter(Boolean).join(" · ");
  return `<div class="li" data-action="incident" data-v="${esc(i.id)}" style="cursor:pointer"><div class="main"><div class="t">${esc(i.type)} ${i.carId ? plate(incCar(i)) : ""}</div><div class="small muted">${fmtDate(i.date)}${S.mode !== "driver" ? " · " + esc(incWho(i)) : ""}${flags ? " · " + flags : ""}</div></div><div class="end">${pill(cls, lab)}</div></div>`;
}
const sortInc = rows => rows.slice().sort((a, b) => (a.status === "closed") - (b.status === "closed") || b.date.localeCompare(a.date));
function incSection(rows) { return rows.length ? `<h3>Incidents</h3><div class="list">${sortInc(rows).slice(0, 10).map(incRow).join("")}</div>` : ""; }
function incidentsCard() {
  const open = (S.incidents || []).filter(i => i.status !== "closed");
  if (!open.length || S.mode === "driver") return "";
  return `<div class="card" style="border-left:4px solid var(--bad)"><div class="section-head" style="margin:0 0 6px"><h3 style="margin:0">${open.length} open incident${open.length === 1 ? "" : "s"}</h3><button class="btn sm" data-action="more-tab" data-v="incidents">See all</button></div><div class="list">${sortInc(open).slice(0, 3).map(incRow).join("")}</div></div>`;
}
function viewIncidents() {
  const rows = sortInc(S.incidents || []);
  const tabs = REC_TABS();
  const canReport = S.canWrite || S.accessRole === "owner";
  const open = rows.filter(i => i.status !== "closed").length;
  const cost = rows.reduce((t, i) => t + incCosts(i).net, 0);
  return `<div class="section"><div class="section-head"><h2>Records</h2></div>${S.role === "owner" ? mySubmissions() : ""}
  <div class="section-head"><div class="seg">${tabs.map(([k, l]) => `<button data-action="more-tab" data-v="${k}" class="${k === "incidents" ? "on" : ""}">${l}</button>`).join("")}</div>${canReport && S.cars.length ? `<button class="btn primary sm" data-action="new-incident">Report</button>` : ""}</div>
  ${rows.length ? `<div class="card small" style="margin-bottom:10px">${open} open · ${rows.length} total · net cost ${ksh(cost)} after insurance</div><div class="list">${rows.map(incRow).join("")}</div>` : `<div class="card empty small">No incidents recorded. Drivers and owners can report one from their phone.</div>`}</div>`;
}
function incCosts(i) {
  const ex = S.mode === "driver" ? [] : all("expenses").filter(x => x.incidentId === i.id);
  const costs = ex.reduce((t, x) => t + (Number(x.amount) || 0), 0);
  const charged = ex.filter(x => x.chargeDriver).reduce((t, x) => t + (Number(x.amount) || 0), 0);
  const paid = Number(i.claimPaid) || 0;
  return { ex, costs, charged, paid, net: costs - paid - charged };
}

function useLocation() {
  if (!navigator.geolocation) { toast("This phone can't share its location here"); return; }
  toast("Finding your location…");
  navigator.geolocation.getCurrentPosition(p => {
    S.geo = { lat: Math.round(p.coords.latitude * 1e5) / 1e5, lng: Math.round(p.coords.longitude * 1e5) / 1e5 };
    const el = document.getElementById("f-location"); if (el && !el.value) el.value = `Near ${S.geo.lat}, ${S.geo.lng}`;
    toast("Location added");
  }, () => toast("Couldn't get your location. Type it instead."), { enableHighAccuracy: true, timeout: 12000 });
}

function formIncident() {
  S.geo = null;
  const isDriver = S.mode === "driver", isOwner = S.mode === "owner";
  if (isOwner && S.accessRole !== "owner") { toast("Only the owner can report incidents"); return; }
  if (isDriver && !S.stmt) { toast("Your page isn't ready yet"); return; }
  const now = new Date(), hh = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
  const fields = [
    { id: "type", label: "What happened", type: "select", options: INCIDENT_TYPES, value: "Accident" },
    { id: "date", label: "Date", type: "date", value: todayStr(), half: true },
    { id: "time", label: "Time", type: "time", value: hh, half: true }
  ];
  if (!isDriver) fields.push(
    { id: "carId", label: "Car", type: "select", options: carOpts("Choose car"), value: "", required: true },
    { id: "driverId", label: "Who was driving", type: "select", options: [["", "Not one of the drivers (owner, someone else, or parked)"]].concat(S.drivers.filter(d => d.status !== "left").map(d => [d.id, d.name])), value: "" },
    { id: "driverLabel", label: "If not a driver, who?", value: "", placeholder: isOwner ? "e.g. Me (owner)" : "e.g. The owner, a mechanic" });
  fields.push(
    { id: "location", label: "Where", value: "", placeholder: "e.g. Thika Road near Roysambu" },
    { id: "drivable", label: "The car can still be driven", type: "check", value: true, hint: "Untick if it can't be driven. The car is then marked off the road from this date." },
    { id: "injured", label: "Someone was hurt", type: "check", value: false },
    { id: "police", label: "Police were involved", type: "check", value: false },
    { id: "ob", label: "Police OB number", value: "", half: true },
    { id: "station", label: "Police station", value: "", half: true },
    { id: "abstractNo", label: "Police abstract number", value: "", hint: "Only if you already have the abstract. You can add it later." },
    { id: "otherPlate", label: "Other vehicle's plate", value: "", half: true },
    { id: "otherName", label: "Other person's name", value: "", half: true },
    { id: "otherPhone", label: "Their phone", type: "tel", value: "", half: true },
    { id: "otherInsurer", label: "Their insurer", value: "", half: true },
    { id: "description", label: "What happened, in a few words", type: "textarea", value: "", required: true });
  openForm("Report an incident", fields, async v => {
    if (!v.description) return "Describe what happened";
    if (!v.date) return "Enter the date";
    if (!isDriver && !v.carId) return "Choose the car";
    const carId = isDriver ? (S.stmt.carId || "") : v.carId;
    const driverId = isDriver ? S.driverId : (v.driverId || "");
    const t = (x, n) => String(x || "").trim().slice(0, n);
    const data = {
      type: v.type, date: v.date, time: t(v.time, 5), carId, driverId, driverLabel: isDriver ? "" : t(v.driverLabel, 80),
      location: t(v.location, 200), drivable: !!v.drivable, injured: !!v.injured, police: !!v.police, ob: t(v.ob, 40), station: t(v.station, 80),
      otherPlate: t(v.otherPlate, 20).toUpperCase(), otherName: t(v.otherName, 80), otherPhone: t(v.otherPhone, 20), otherInsurer: t(v.otherInsurer, 80),
      description: t(v.description, 1000), status: "reported", reportedBy: S.uid, reporterRole: isDriver ? "driver" : isOwner ? "owner" : "staff", reportedAt: S.raw.TS,
      offRoad: !v.drivable && !!carId, excused: true, backOnRoad: "",
      abstractNo: t(v.abstractNo, 60), abstractDate: "",
      abstractStatus: v.abstractNo ? "received" : (v.police || ["Accident", "Theft or break-in"].includes(v.type)) ? "needed" : "none"
    };
    if (S.geo) { data.lat = S.geo.lat; data.lng = S.geo.lng; }
    const ref = S.raw.collection(`${fleetBase()}/incidents`).doc();
    const work = ref.set(data);

/* ---- Incident report PDF (an internal DRYVR record, not a police document) ---- */
function loadScript(src) {
  return new Promise((res, rej) => { if (document.querySelector(`script[src="${src}"]`)) return res(); const el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = () => rej(new Error("load")); document.head.appendChild(el); });
}
async function imgData(src) {
  try { const b = await (await fetch(src)).blob(); return await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); }); } catch (e) { return null; }
}
async function incidentPdf(id) {
  const i = incById(id); if (!i) return;
  toast("Preparing the report…");
  try { if (!window.jspdf) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"); }
  catch (e) { toast("Couldn't load the PDF maker. Check your connection and try again."); return; }
  let notes = [];
  try { notes = snapRows(await S.raw.collection(`${fleetBase()}/incidents/${id}/notes`).get()).sort((a, b) => String(a.at).localeCompare(String(b.at))); } catch (e) {}
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const W = 210, M = 16, CW = W - 2 * M; let y = 16;
  const NAVY = [2, 35, 83], MUTED = [81, 98, 123], GREEN = [2, 189, 134];
  const clean = t => String(t ?? "").replace(/[→]/g, "-").replace(/[^\x00-\xFF’‘“”–—·]/g, "");
  const need = h => { if (y + h > 282) { doc.addPage(); y = 16; } };
  const logo = await imgData("logo.png");
  if (logo) { try { doc.addImage(logo, "PNG", M, y, 44, 8); } catch (e) {} }
  const ref = "INC-" + String(i.id).slice(0, 6).toUpperCase();
  doc.setFont("helvetica", "bold"); doc.setFontSize(16); doc.setTextColor(...NAVY);
  doc.text("Incident report", W - M, y + 4, { align: "right" });
  doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(...MUTED);
  doc.text(`${ref} · generated ${fmtDate(todayStr())}`, W - M, y + 9, { align: "right" });
  y += 16;
  doc.setDrawColor(...GREEN); doc.setLineWidth(0.8); doc.line(M, y, W - M, y); y += 6;
  const fleetName = (S.fleetMeta && S.fleetMeta.name) || S.settings.name || "Fleet";
  doc.setFontSize(8.5); doc.setTextColor(...MUTED);
  const disc = doc.splitTextToSize(clean(`Internal record prepared by ${fleetName} using DRYVR from information reported in the app. This is not a police abstract or any other police document.`), CW);
  doc.text(disc, M, y); y += disc.length * 4 + 4;
  const section = title => { y += 2; need(14); doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(...NAVY); doc.text(clean(title), M, y); y += 2; doc.setDrawColor(220, 227, 236); doc.setLineWidth(0.3); doc.line(M, y, W - M, y); y += 5; };
  const row = (k, v) => {
    if (v == null || v === "") return;
    const lines = doc.splitTextToSize(clean(v), CW - 48); need(lines.length * 4.6 + 1.5);
    doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(...MUTED); doc.text(clean(k), M, y);
    doc.setTextColor(...NAVY); doc.text(lines, M + 48, y); y += lines.length * 4.6 + 1.5;
  };
  const para = t => { const lines = doc.splitTextToSize(clean(t), CW); need(lines.length * 4.6 + 2); doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(...NAVY); doc.text(lines, M, y); y += lines.length * 4.6 + 2; };
  const car = S.mode === "driver" ? null : carById(i.carId);
  const drv = S.mode === "driver" ? null : S.drivers.find(d => d.id === i.driverId);
  const T = todayStr(), offEnd = i.backOnRoad || T, offDays = i.offRoad ? dayDiff(i.date, offEnd) + (i.backOnRoad ? 0 : 1) : 0;
  section("Incident");
  row("Type", i.type); row("Date and time", `${fmtDate(i.date)}${i.time ? " at " + i.time : ""}`); row("Location", i.location);
  if (i.lat != null) row("Coordinates", `${i.lat}, ${i.lng}`);
  row("Status", (INC_STATUS[i.status] || INC_STATUS.reported)[1]);
  row("Reported by", i.reporterRole === "driver" ? "Driver" : i.reporterRole === "owner" ? "Owner" : "Staff");
  row("Reported on", i.reportedAt ? fmtDate(String(i.reportedAt).slice(0, 10)) : "");
  row("Anyone hurt", i.injured ? "Yes" : "No"); row("Car drivable", i.drivable === false ? "No" : "Yes");
  section("Description"); para(i.description || "No description given.");
  section("Vehicle");
  row("Number plate", i.carId ? incCar(i) : "Not recorded");
  row("Make and model", car ? [car.make, car.model, car.year].filter(Boolean).join(" ") : S.mode === "driver" && S.stmt ? S.stmt.carName : "");
  if (car) row("Insurance valid until", car.insuranceExpiry ? fmtDate(car.insuranceExpiry) : "");
  section("Driver");
  if (S.mode === "driver") { row("Name", S.stmt ? S.stmt.name : ""); }
  else { row("Name", drv ? drv.name : (i.driverLabel || "Not recorded")); if (drv) { row("Phone", drv.phone); row("Licence valid until", drv.licenseExpiry ? fmtDate(drv.licenseExpiry) : ""); } }
  if (i.otherPlate || i.otherName || i.otherPhone || i.otherInsurer) { section("Other party"); row("Vehicle plate", i.otherPlate); row("Name", i.otherName); row("Phone", i.otherPhone); row("Insurer", i.otherInsurer); }
  section("Police");
  row("Police involved", i.police ? "Yes" : "No"); row("OB number", i.ob); row("Police station", i.station);
  row("Police abstract", (ABS_STATUS[i.abstractStatus || "none"] || ABS_STATUS.none)[1] + (i.abstractNo ? ` · No. ${i.abstractNo}` : "") + (i.abstractDate ? ` · issued ${fmtDate(i.abstractDate)}` : ""));
  if (i.offRoad) { section("Time off the road"); row("Off the road from", fmtDate(i.date)); row("Back on the road", i.backOnRoad ? fmtDate(i.backOnRoad) : "Still off the road"); row("Days", String(offDays)); }
  if (i.claimInsurer || i.claimNo || i.claimAmount || i.claimPaid) {
    section("Insurance claim"); row("Insurer", i.claimInsurer); row("Claim number", i.claimNo);
    if (i.claimAmount) row("Amount claimed", ksh(i.claimAmount)); if (i.claimPaid) row("Amount paid", `${ksh(i.claimPaid)}${i.claimPaidDate ? " on " + fmtDate(i.claimPaidDate) : ""}`);
  }
  if (S.mode !== "driver") {
    const k = incCosts(i);
    if (k.ex.length) {
      section("Costs");
      for (const x of k.ex.sort((a, b) => a.date.localeCompare(b.date))) row(fmtDate(x.date), `${x.category} · ${ksh(x.amount)}${x.vendor ? " · " + x.vendor : ""}${x.chargeDriver ? " · charged to driver" : ""}`);
      row("Total costs", ksh(k.costs)); if (k.charged) row("Charged to driver", ksh(k.charged)); if (k.paid) row("Insurance paid", ksh(k.paid)); row("Net cost to owner", ksh(k.net));
    }
  }
  if (notes.length) { section("Updates"); for (const n of notes) row(n.at ? fmtDate(String(n.at).slice(0, 10)) : "", n.text); }
  const pages = doc.getNumberOfPages();
  for (let pg = 1; pg <= pages; pg++) { doc.setPage(pg); doc.setFontSize(8); doc.setTextColor(...MUTED); doc.text(clean(`${fleetName} · ${ref} · page ${pg} of ${pages}`), W / 2, 290, { align: "center" }); }
  const name = `DRYVR-incident-${String(i.carId ? incCar(i) : "").replace(/\s+/g, "")}-${i.date}.pdf`.replace("--", "-");
  doc.save(name);
}

// ---- Template ----
const K_FIELDS = [
  ["fleet_name", "Fleet name"], ["org_name", "Your organisation"], ["owner_name", "Owner's name"], ["driver_name", "Driver's full name"], ["driver_id_no", "Driver's ID number"], ["driver_dl_no", "Licence number"],
  ["driver_phone", "Driver's phone"], ["kin_name", "Next of kin"], ["kin_phone", "Next of kin phone"], ["car_plate", "Number plate"], ["car_make_model", "Make and model"],
  ["daily_rate", "Daily fee"], ["rest_day", "Rest day"], ["deposit", "Deposit"], ["start_date", "Start date"], ["end_date", "End date"], ["notice_days", "Notice period (days)"],
  ["arrears_days", "Days of arrears before the car is withdrawn"], ["pay_info", "How to pay"], ["extra_terms", "Extra terms for this driver"], ["today", "Today's date"]
];
const DEFAULT_TEMPLATE = `VEHICLE LEASE AGREEMENT

This agreement is between {{org_name}}, managing the vehicle on behalf of its owner ("the Manager"), and {{driver_name}}, ID number {{driver_id_no}}, driving licence number {{driver_dl_no}}, phone {{driver_phone}} ("the Driver").

1. THE VEHICLE
The Manager leases to the Driver the vehicle {{car_plate}} ({{car_make_model}}) for use on ride-hailing platforms such as Uber and Bolt.

2. TERM
This agreement starts on {{start_date}} and ends on {{end_date}}, unless ended earlier under clause 11.

3. DAILY FEE
3.1 The Driver pays {{daily_rate}} for each day they have the vehicle, except their weekly rest day ({{rest_day}}).
3.2 Payment is due daily. {{pay_info}}
3.3 No fee is charged for days the vehicle is off the road for reasons that are not the Driver's fault, such as servicing or repairs the Manager arranges.
3.4 Partial payments are allowed, but any balance owed is carried forward and must be cleared.

4. DEPOSIT
The Driver pays a refundable deposit of {{deposit}}. At the end of this agreement it may be used to cover money owed, fines, or damage the Driver is responsible for. Any remainder is refunded.

5. WHAT THE DRIVER PAYS FOR
Fuel; traffic fines and penalties incurred while the Driver has the vehicle; minor damage caused by the Driver; and their own licences, PSV badge and platform accounts. If the Manager pays any of these first, the amount is added to what the Driver owes.

6. WHAT THE MANAGER PAYS FOR
Servicing and repairs from normal use, insurance, vehicle inspection and licences, tyres, and the tracker.

7. USE OF THE VEHICLE
7.1 Only the Driver may drive the vehicle. It must not be sublet or lent to anyone.
7.2 The Driver must hold a valid driving licence and PSV badge at all times and obey traffic laws and platform rules.
7.3 The Driver must keep the vehicle clean, check oil, water and tyres regularly, and report any fault immediately.
7.4 The Driver must report the odometer reading at least once a week, and bring the vehicle for servicing when asked.

8. ACCIDENTS AND INCIDENTS
The Driver must report any accident, breakdown, theft or police matter to the Manager within 24 hours, using the DRYVR app where possible, and obtain a police abstract when required. Damage caused by the Driver's negligence, or the insurance excess on a claim caused by the Driver, may be charged to the Driver.

9. ARREARS
If the Driver falls more than {{arrears_days}} days behind on payments, the Manager may take back the vehicle until the balance is cleared.

10. TRACKING AND PERSONAL DATA
The vehicle has a tracker. The Driver agrees that the Manager may record their personal details, payments and vehicle use to manage this agreement, in line with the Data Protection Act, 2019. This information is not shared except with the vehicle owner, insurers, or authorities where required.

11. ENDING THE AGREEMENT
Either party may end this agreement with {{notice_days}} days' written notice, including through the DRYVR app. The Manager may end it immediately for serious breach, including unpaid fees beyond clause 9, unlicensed driving, subletting, or dangerous or illegal use. On ending, the Driver returns the vehicle, keys and documents in the same condition, apart from normal wear.

12. EXTRA TERMS
{{extra_terms}}

13. NEXT OF KIN
In an emergency the Manager may contact the Driver's next of kin: {{kin_name}}, {{kin_phone}}.

14. AGREEMENT
By signing below, both parties confirm they have read, understood and agree to these terms. Electronic signatures made in the DRYVR app are binding.`;
async function loadTemplate() {
  if (S.template) return S.template;

  return S.template || { title: "Vehicle lease agreement", body: DEFAULT_TEMPLATE, months: 6, noticeDays: 7 };
}

    { id: "noticeDays", label: "Notice period (days)", type: "number", value: t.noticeDays || 7, half: true },
    { id: "body", label: "Contract text", type: "textarea", value: t.body || DEFAULT_TEMPLATE, hint: "Fill-in fields: " + K_FIELDS.map(([k]) => "{{" + k + "}}").join(" ") }
  ], async v => {
    if (String(v.body || "").length < 200) return "The contract text looks too short";
    const data = { title: String(v.title || "Vehicle lease agreement").slice(0, 120), body: String(v.body).slice(0, 30000), months: Math.max(1, Number(v.months) || 6), noticeDays: Math.max(0, Number(v.noticeDays) || 7), updatedAt: new Date().toISOString(), updatedBy: S.uid };
    const ok = await save(() => S.raw.doc(`orgs/${S.org}/templates/contract`).set(data), "Template saved");
    if (ok) S.template = data;

  }, { intro: "This is used for every new contract in your organisation. Contracts already sent keep the wording they were sent with. Have a lawyer check it before you rely on it." });

function contractEnd(dateStr, n) { const [y, m, d] = dateStr.split("-").map(Number); const dt = new Date(y, m - 1 + n, d); if (dt.getDate() !== d) dt.setDate(0); dt.setDate(dt.getDate() - 1); return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`; }

    { id: "restDay", label: "Rest day", type: "select", options: [["", "No rest day"]].concat(DAYS.map((x, i) => [String(i), x])), value: a && a.restDay !== "" && a.restDay != null ? String(a.restDay) : "0", half: true },
    { id: "deposit", label: "Deposit (KSh)", type: "number", value: d.deposit || 0, half: true },
    { id: "noticeDays", label: "Notice period (days)", type: "number", value: t.noticeDays || 7, half: true },

async function sendContract(id) {
  const k = kById(id); if (!k) return;
  const bodyHash = await sha256(k.body);
  const ok = await save(() => S.db.doc(`contracts/${id}`).update({ status: "sent", sentAt: S.raw.TS, bodyHash }), "Sent to the driver");
  if (ok) { postEvent(S.fleet, "driver:" + k.driverId, "contract", `Your contract (${k.title}) is ready. Open DRYVR to read and sign it.`); setTimeout(() => openContract(id), 300); }
}

// ---- View ----
function sigBlock(label, sg) {

  return `<div><span>${label}</span><img class="sig-img" src="${esc(sg.image)}" alt="Signature of ${esc(sg.name)}"><div class="small">${esc(sg.name)}${sg.method === "in_person" ? " (signed in person)" : ""} · ${esc(fmtDate(String(sg.at || "").slice(0, 10)))}</div></div>`;
}

  if (mgr && k.status === "sent" && !k.driverSig) acts.push(`<button class="btn sm" data-action="k-sign" data-role="driver_in_person" data-v="${esc(id)}">Driver signs on this phone</button>`);
  if (mgr && ["sent", "driver_signed"].includes(k.status) && !k.managerSig) acts.push(`<button class="btn primary sm" data-action="k-sign" data-role="manager" data-v="${esc(id)}">Sign as manager</button>`);
  if (isDrv && k.status === "sent" && !k.driverSig) acts.push(`<button class="btn primary" data-action="k-sign" data-role="driver" data-v="${esc(id)}">Sign this contract</button>`);
  if (k.status !== "draft") acts.push(`<button class="btn sm" data-action="k-pdf" data-v="${esc(id)}">Download PDF</button>`);
  if (mgr && ["signed", "sent", "driver_signed"].includes(k.status)) acts.push(`<button class="btn sm" data-action="k-end" data-v="${esc(id)}">${k.status === "signed" ? "End contract" : "Cancel"}</button>`);
  openSheet(k.title, `<div class="section-head" style="margin:0 0 8px"><span class="small">${isDrv ? "" : esc(driverNameSafe(k.driverId)) + " · "}${k.carPlate ? plate(k.carPlate) : ""} ${ksh(k.rate)}/day · ${fmtDate(k.start)} – ${k.end ? fmtDate(k.end) : "open-ended"}</span>${pill(cls, lab)}</div>
    ${k.status === "ended" ? `<p class="small"><b>Ended ${fmtDate(k.endedOn)}</b>${k.endReason ? ": " + esc(k.endReason) : ""}</p>` : ""}

    <div class="detail-grid" style="margin-top:12px">${sigBlock("Driver", k.driverSig)}${sigBlock("Manager", k.managerSig)}</div>

function initSigPad(id) {
  const c = document.getElementById(id); if (!c) return;
  const r = c.getBoundingClientRect(), dpr = Math.max(1, window.devicePixelRatio || 1);
  c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr);
  const ctx = c.getContext("2d"); ctx.scale(dpr, dpr); ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = 2.4; ctx.strokeStyle = "#022353";

  c.onpointerdown = e => { drawing = true; last = pos(e); c.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last.x, last.y, 1.1, 0, Math.PI * 2); ctx.fillStyle = "#022353"; ctx.fill(); c.dataset.drawn = "1"; const h = c.parentNode.querySelector(".hint"); if (h) h.style.display = "none"; e.preventDefault(); };
  c.onpointermove = e => { if (!drawing) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; c.dataset.strokes = String((+c.dataset.strokes || 0) + 1); e.preventDefault(); };

}

  const out = document.createElement("canvas"), w = 480, h = Math.round(c.height * w / c.width);
  out.width = w; out.height = h; out.getContext("2d").drawImage(c, 0, 0, w, h);
  return out.toDataURL("image/png");
}
async function doSign(id, role) {
  const k = kById(id); if (!k) return;

// ---- Contract manager (Records → Contracts) ----
function viewContracts() {
  const tabs = REC_TABS();
  const ks = (S.contracts || []).slice().sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  const T = todayStr();
  const active = S.drivers.filter(d => d.status !== "left" && !(d.settlement && d.settlement.date));
  const signedFor = id => ks.find(k => k.driverId === id && k.status === "signed" && (!k.end || k.end >= T));
  const missing = active.filter(d => !signedFor(d.id));
  const ending = ks.filter(k => k.status === "signed" && k.end && k.end >= T && dayDiff(T, k.end) <= 30);
  const waiting = ks.filter(k => k.status === "sent" || k.status === "driver_signed");
  const group = (title, rows) => rows.length ? `<h3>${title} <span class="small muted">${rows.length}</span></h3><div class="list">${rows.map(kRow).join("")}</div>` : "";
  return `<div class="section"><div class="section-head"><h2>Records</h2></div>
  <div class="section-head"><div class="seg">${tabs.map(([k, l]) => `<button data-action="more-tab" data-v="${k}" class="${k === "contracts" ? "on" : ""}">${l}</button>`).join("")}</div>${S.canManage ? `<button class="btn sm" data-action="k-template">Edit template</button>` : ""}</div>
  <div class="grid kpis" style="margin-bottom:12px">
    <div class="card kpi"><div class="label">Active drivers with a signed contract</div><div class="value num">${active.length - missing.length} / ${active.length}</div></div>
    <div class="card kpi"><div class="label">Waiting for signatures</div><div class="value num">${waiting.length}</div></div>

  };
  sigBox(M, "Driver", k.driverSig); sigBox(M + colW + 8, `Manager, for ${S.orgName || "the Manager"}`, k.managerSig);
  y += 44; need(20);

  const pages = doc.getNumberOfPages();

function oddsBy(carId) {
  const r = [];

const MAINT = ["Service", "Repairs & parts", "Tyres"];
function perfCars(c) {

  const exP = all("expenses").filter(x => x.date >= from && x.date <= end);

      net: x.net, netDay: x.denomP ? x.net / x.denomP : NaN, rev: x.revP, cost: x.costP, util: x.util, km: x.kmP, kmDay: x.earnP && x.kmP ? x.kmP / x.earnP : NaN,

    if (!as.length) continue;
    let due = 0, dueAmt = 0, worked = 0, absent = 0, km = 0, weeks = 0, wkRep = 0; const dueDays = [];
    for (const a of as) {

        if (a.restDay !== "" && a.restDay != null && Number(a.restDay) === weekday(day)) continue;

      for (let w = s0; w <= e0; w = addDays(w, 7)) { const we = [addDays(w, 6), e0].sort()[0]; weeks++; if (reads.some(r => r.date >= w && r.date <= we)) wkRep++; }

function perfRecos(cars, drivers, c, kind) {

const STOCK_CATS = ["Oil & filters", "Brakes", "Tyres & wheels", "Battery & electrical", "Suspension & steering", "Engine parts", "Body & glass", "Fluids", "Tools & accessories", "Other"];

function nextCode(category, taken) {

    for (const it of missing.sort((a, b) => String(a.createdAt || a.updatedAt || "").localeCompare(String(b.createdAt || b.updatedAt || "")))) {

async function saveService() {

  const g = id => String((document.getElementById(id) || {}).value || "").trim();
  const date = g("sv-date") || todayStr(), odometer = Number(g("sv-odo")) || 0, type = g("sv-type") || "service";
  const lines = readLines().filter(l => l.desc || l.amount).map(({ el, ...l }) => l);
  if (!lines.length) { toast("Add at least one item with its cost"); return; }
  if (lines.some(l => !l.desc)) { toast("Describe every line, e.g. Oil filter"); return; }
  if (type === "service" && !odometer) { toast("Enter the odometer reading. It resets the service reminder."); return; }
  if (date < trackStart()) { toast("Date is before your tracking start date"); return; }
  const lastKm = S.calc && (S.calc.cars.find(c => c.id === ed.carId) || {}).odo ? S.calc.cars.find(c => c.id === ed.carId).odo.lastKm : null;
  if (odometer && lastKm != null && odometer < lastKm - 5 && !ed.id && !confirm(`${odometer.toLocaleString()} km is lower than the last reading (${lastKm.toLocaleString()} km). Save anyway?`)) return;

  const paidBy = g("sv-paid") === "driver" ? "driver" : "owner";
  let driverId = "";
  if (paidBy === "driver") { const a = assignOn(ed.carId, date); if (!a) { toast("No driver had this car on that date"); return; } driverId = a.driverId; }
  const car = carById(ed.carId) || {}, iv = Number(car.serviceIntervalKm) || Number(S.settings.serviceIntervalKm) || 5000;
  const nextKm = Number(g("sv-next")) || (type === "service" && odometer ? odometer + iv : 0);
  const ref = ed.id ? S.db.doc(`services/${ed.id}`) : S.db.collection("services").doc();
  const id = ed.id || ref.id, m = monthOf(date), old = ed.id ? svcById(ed.id) : null;
  // one expense per category, e.g. svc_<id>_Service

  for (const l of lines) (byCat[l.cat] = byCat[l.cat] || []).push(l);
  const exps = Object.entries(byCat).map(([cat, ls]) => {
    const exId = `svc_${id}_${cat.replace(/[^A-Za-z]/g, "")}`;
    const amount = Math.round(ls.reduce((t, l) => t + l.amount, 0) * 100) / 100;
    const e = { carId: ed.carId, category: cat, amount, date, vendor: g("sv-garage").slice(0, 120), note: `${(SVC_TYPES.find(t => t[0] === type) || SVC_TYPES[0])[1]}: ${ls.map(l => `${l.desc}${l.qty && l.qty !== 1 ? " ×" + fmtQty(l.qty) : ""}`).join(", ")}`.slice(0, 500), source: "service", serviceId: id, updatedAt: new Date().toISOString() };
    if (odometer) e.odometer = odometer;

    return { exId, e };
  });
  const data = { carId: ed.carId, date, odometer, type, garage: g("sv-garage").slice(0, 120), ref: g("sv-ref").slice(0, 60), paidBy, driverId, lines, total, nextKm, notes: g("sv-notes").slice(0, 1000),
    expenseIds: exps.map(x => x.exId), expenseMonth: m, updatedAt: new Date().toISOString(), updatedBy: S.uid };
  if (!ed.id) { data.createdAt = new Date().toISOString(); data.createdBy = S.uid; data.inspectionId = ""; }
  const withInsp = !ed.id && (document.getElementById("sv-with-insp") || {}).checked;
  const ok = await save(async () => {

    if (old && old.expenseIds) for (const x of old.expenseIds) await S.db.doc(`months/${old.expenseMonth || monthOf(old.date)}/expenses/${x}`).delete().catch(() => {});
    for (const { exId, e } of exps) await S.db.doc(`months/${m}/expenses/${exId}`).set(e);

  if (!ed.id && !withInsp) postEvent(S.fleet, "owners", "service", `${carLabel(ed.carId)}: ${(SVC_TYPES.find(t => t[0] === type) || SVC_TYPES[0])[1].toLowerCase()} done for ${ksh(total)}${odometer ? " at " + odometer.toLocaleString() + " km" : ""}`);

}

/* ============ Vehicle inspections ============ */
// Status: ok = fine, soon = future attention, now = immediate attention, na = not applicable
const IN_ST = { ok: "OK", soon: "Soon", now: "Now", na: "N/A" };
const WHEELS = [["FL", "Front left"], ["FR", "Front right"], ["RL", "Rear left"], ["RR", "Rear right"]];
// Wheel checks: [key, label, kind, front/rear only?, thresholds mm [now, soon]]
const WHEEL_ITEMS = [
  ["tyreSize", "Tyre size", "text"], ["tyre", "Tyre condition", "st"], ["treadO", "Tread outer (mm)", "mm", null, [1.6, 3.5]], ["treadM", "Tread middle (mm)", "mm", null, [1.6, 3.5]], ["treadI", "Tread inner (mm)", "mm", null, [1.6, 3.5]],
  ["pressure", "Tyre pressure", "st"], ["pad", "Brake pad (mm)", "mm", "front", [2, 4]], ["disc", "Brake disc", "st", "front"], ["lining", "Brake lining / drum", "st", "rear"],
  ["shock", "Shock absorber", "st"], ["spring", "Coil spring", "st"], ["steer", "Steering parts", "st"]
];
const INSP_SECTIONS = [
  ["spare", "Spare tyre", [["spare", "Spare tyre present", "st"]]],
  ["dash", "Dashboard warning lights", [["engineLight", "Engine check light", "st"], ["absLight", "ABS / handbrake", "st"], ["tpms", "Tyre pressure (TPMS)", "st"], ["tracLight", "Traction control", "st"], ["battLight", "Battery light", "st"], ["ac", "Air conditioning", "st"]]],
  ["front", "Exterior front", [["wiperL", "Wiper front left", "stv", "size"], ["wiperR", "Wiper front right", "stv", "size"], ["frontLights", "Front lights", "st"], ["windscreen", "Windscreen", "st"]]],
  ["hood", "Under the hood", [["cabinFilter", "Cabin filter", "st"], ["airFilter", "Air filter", "st"], ["washer", "Washer fluid", "st"], ["brakeFluid", "Brake fluid level", "st"], ["powerSteer", "Power steering fluid", "st"], ["oilLevel", "Engine oil level", "st"], ["oilCond", "Engine oil condition", "st"], ["coolant", "Coolant level", "st"], ["plugs", "Spark plugs", "st"], ["belts", "Belts and hoses", "st"], ["hoodLeaks", "Leaks", "st"]]],
  ["battery", "Battery", [["battery", "Battery test", "stv", "size"], ["battClamp", "Battery clamp and terminals", "st"]]],
  ["safety", "Safety kit", [["triangle", "Safety triangle", "st"], ["extinguisher", "Fire extinguisher", "st"], ["firstAid", "First aid kit", "st"]]],
  ["rear", "Exterior rear", [["wiperRear", "Rear wiper", "stv", "size"], ["rearLights", "Rear lights", "st"], ["body", "Body and paint", "st"]]],
  ["under", "Under the body", [["underLeaks", "Leaks", "st"], ["exhaust", "Exhaust", "st"]]]
];
const inspById = id => (S.inspections || []).find(x => x.id === id);
const latestInsp = carId => (S.inspections || []).filter(x => x.carId === carId).sort((a, b) => (b.date + (b.createdAt || "")).localeCompare(a.date + (a.createdAt || "")))[0];
function wheelStatus(def, val) {
  if (def[2] !== "mm") return "";
  const v = parseFloat(val); if (!isFinite(v)) return "";
  const [now, soon] = def[4]; return v < now ? "now" : v < soon ? "soon" : "ok";
}
// Flat list of everything that needs attention, from a saved inspection
function inspFindings(x) {
  const out = [], it = x.items || {}, rank = { now: 2, soon: 1 };
  // the three tread readings of a tyre are reported together, at the status of the worst one
  for (const [w, wl] of WHEELS) {
    const ks = ["treadO", "treadM", "treadI"].map(t => `${t}.${w}`).filter(k => it[k]);
    if (!ks.length) continue;
    const worst = ks.map(k => ({ k, st: it[k].st || wheelStatus(WHEEL_ITEMS.find(d => d[0] === k.split(".")[0]), it[k].val) })).sort((a, b) => (rank[b.st] || 0) - (rank[a.st] || 0))[0];
    if (worst.st === "now" || worst.st === "soon") out.push({ k: worst.k, st: worst.st, label: `Tyre tread ${wl.toLowerCase()}: ${ks.map(k => it[k].val).join(" / ")} mm`, section: "Wheels, tyres and brakes", note: "", fixed: it[worst.k].fixed || "" });
  }
  for (const d of WHEEL_ITEMS) for (const [w, wl] of WHEELS) {
    if (d[0].startsWith("tread")) continue;
    const k = `${d[0]}.${w}`, e = it[k]; if (!e) continue;
    const st = e.st || wheelStatus(d, e.val);
    if (st === "now" || st === "soon") out.push({ k, st, label: `${d[1].replace(/ \(mm\)/, "")} ${wl.toLowerCase()}${e.val ? ": " + e.val + (d[2] === "mm" ? " mm" : "") : ""}`, section: "Wheels, tyres and brakes", note: e.note || "", fixed: e.fixed || "" });
  }
  for (const [, sl, rows] of INSP_SECTIONS) for (const [key, label] of rows) {
    const e = it[key]; if (!e) continue;
    if (e.st === "now" || e.st === "soon") out.push({ k: key, st: e.st, label: label + (e.val ? ` (${e.val})` : ""), section: sl, note: e.note || "", fixed: e.fixed || "" });

}
function inspCounts(x) { const f = inspFindings(x); return { now: f.filter(i => i.st === "now").length, soon: f.filter(i => i.st === "soon").length, open: f.filter(i => i.st === "now" && !i.fixed).length }; }

}
function inspCard(carId) {

}
function viewInspections() {

  const T = todayStr(), every = Number(S.settings.inspectEveryDays) || 90;

  ${rows.length ? `<div class="list">${rows.map(inspRow).join("")}</div>` : `<div class="card empty small">No inspections yet.${S.canWrite ? " Record one after each garage visit or monthly check." : " Your manager records them after each check."}</div>`}</div>`;

// ---- Form ----
function stBtns(cur) { return `<span class="stbtns">${Object.entries(IN_ST).map(([k, l]) => `<button type="button" class="${k}${cur === k ? " on" : ""}" data-action="in-st" data-v="${k}">${l}</button>`).join("")}</span>`; }
function formInspection(carId, rec, pre) {

  const prev = rec ? null : latestInsp(carId);
  const it = rec ? rec.items || {} : {};
  const pv = k => (it[k] && it[k].val) || (prev && prev.items && prev.items[k] && /size/i.test(k + "") ? prev.items[k].val : "") || "";
  // carry sizes forward from the last inspection (tyre and wiper/battery sizes rarely change)

    return `<select data-wk="${k}" aria-label="${esc(d[1] + " " + w)}"><option value=""></option>${Object.entries(IN_ST).map(([s2, l]) => `<option value="${s2}"${e.st === s2 ? " selected" : ""}>${l}</option>`).join("")}</select>`;
  };
  const wheels = `<div class="wgrid"><span></span>${WHEELS.map(([w]) => `<span class="h">${w}</span>`).join("")}${WHEEL_ITEMS.map(d => `<span class="lbl">${esc(d[1])}</span>${WHEELS.map(([w]) => wheelCell(d, w)).join("")}`).join("")}</div>
    <p class="small muted" style="margin:8px 0 0">FL front left · FR front right · RL rear left · RR rear right. Tread under 3.5 mm turns amber, under 1.6 mm red; brake pads under 4 mm amber, under 2 mm red.</p>`;

  S._inspEdit = { carId, id: rec ? rec.id : null, serviceId: rec ? rec.serviceId || "" : pre.serviceId || "" };
  openSheet(rec ? "Edit inspection" : `Inspection: ${car.plate}`, `

      <label class="fl">Date<input id="in-date" type="date" value="${esc(rec ? rec.date : pre.date || todayStr())}"></label>
      <label class="fl">Mileage (km)<input id="in-km" type="number" step="any" inputmode="decimal" value="${esc(rec ? rec.mileage || "" : pre.mileage || "")}"></label>
      <label class="fl">Garage / done by<input id="in-garage" value="${esc(rec ? rec.garage || "" : pre.garage || (prev ? prev.garage || "" : ""))}" placeholder="e.g. AutoXpress Embakasi"></label>

}
async function saveInspection() {

    const k = el.dataset.wk, val = String(el.value || "").trim(); if (!val) return;

    if (prevItems[k] && prevItems[k].fixed) items[k].fixed = prevItems[k].fixed;
  });
  document.querySelectorAll("#sheet .insp-row[data-k]").forEach(row => {
    const k = row.dataset.k, on = row.querySelector(".stbtns button.on"), val = (row.querySelector(`[data-val="${k}"]`) || {}).value, note = (row.querySelector(`[data-note="${k}"]`) || {}).value;

  const data = { serviceId: ed.serviceId || "", carId: ed.carId, date, mileage: km, garage: g("in-garage").slice(0, 120), inspector: g("in-inspector").slice(0, 80), ref: g("in-ref").slice(0, 60), estimate: Number(g("in-estimate")) || 0, comments: g("in-comments").slice(0, 1000), items, updatedAt: new Date().toISOString(), updatedBy: S.uid };
  const ref = ed.id ? S.db.doc(`inspections/${ed.id}`) : S.db.collection("inspections").doc();

  const ok = await save(async () => {
    await ref.set(data, { merge: !!ed.id });
    // the inspection mileage also feeds the service tracker
    if (km > 0 && !ed.id && !ed.serviceId) await writeRecord("odo", { carId: ed.carId, km, date, source: "inspection", note: "From inspection" }, null, true);
    if (ed.serviceId && !ed.id) await S.db.doc(`services/${ed.serviceId}`).set({ inspectionId: ref.id }, { merge: true });

  if (!ed.id && !ed.serviceId) { const c = inspCounts({ items }); postEvent(S.fleet, "owners", "inspection", `Inspection for ${carLabel(ed.carId)}: ${c.now ? c.now + " need attention now" : "nothing urgent"}${c.soon ? ", " + c.soon + " soon" : ""}`); }
  if (!ed.id && ed.serviceId) { const c = inspCounts({ items }), sv = (S.services || []).find(x => x.id === ed.serviceId); postEvent(S.fleet, "owners", "service", `${carLabel(ed.carId)} serviced${sv ? " for " + ksh(sv.total) : ""}. Inspection: ${c.now ? c.now + " need attention now" : "nothing urgent"}${c.soon ? ", " + c.soon + " soon" : ""}`); }

async function toggleFixed(arg) {

// ---- PDF ----
async function inspectionPdf(id) {
  const x = inspById(id); if (!x) return;
  toast("Preparing the PDF…");
  try { if (!window.jspdf) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"); }
  catch (e) { toast("Couldn't load the PDF maker. Check your connection and try again."); return; }

  const need = h => { if (y + h > 282) { doc.addPage(); y = 16; } };
  const car = carById(x.carId) || {}, it = x.items || {}, f = inspFindings(x);
  const logo = await imgData("logo.png"); if (logo) { try { doc.addImage(logo, "PNG", M, y, 44, 8); } catch (e) {} }
